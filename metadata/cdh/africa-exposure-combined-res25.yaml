# CDH v0.3.0 record - the combined crop + livestock exposure table on the 0.25 degree NEX-GDDP
# hazard grid. THIS is the denominator for africa-hazard-exposure-nexgddp (same grid). Its
# 0.05 degree sibling is africa-exposure-combined-res05; the two are separate records because
# they resolve different sets of administrative units (README: a different-resolution
# representation is a separate record).
$schema: https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.3.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json

id: africa-exposure-combined-res25
title: Crop and Livestock Exposure by Administrative Unit, Sub-Saharan Africa, on the 0.25 degree Hazard Grid
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  One table of what is exposed, per administrative unit: MapSPAM 2020 crop production, harvested
  area, physical area and value of production, and GLW4 2020 livestock numbers and value of
  production, summed onto GAUL 2024 country, first- and second-level units for Sub-Saharan Africa.
  Zonal statistics are computed on the 0.25 degree NEX-GDDP-CMIP6 grid, the grid the Atlas hazard
  product is built on, so this table is the denominator that turns hazard-exposed value into a share
  of total value. Value of production is carried on two bases in one table, constant 2015
  international dollars and nominal 2021 US dollars, distinguished by the unit column.
resource_type: dataset
license: CC-BY-4.0 # derived product; principal inputs MapSPAM Adaptation Atlas SSA (CC-BY-4.0) and GAUL 2024 (CC-BY-4.0)
keywords:
  [
    exposure,
    value of production,
    crop production,
    livestock,
    MapSPAM,
    GLW4,
    administrative units,
    sub-saharan africa,
  ]

note: >
  THIS IS THE DENOMINATOR FOR THE HAZARD PRODUCT. Divide africa-hazard-exposure-nexgddp by THIS
  table, not by the 0.05 degree sibling (africa-exposure-combined-res05): both products rasterise
  administrative zones on the same 0.25 degree grid, so a second-level unit that owns no cell is
  absent from both, and the ratio stays at or below one. The 0.05 degree table resolves roughly
  2,100 more second-level units than the hazard product can populate; dividing by it yields exposure
  shares above 100 per cent in small units.
  THE TABLE IS MULTI-UNIT. SELECT ON `unit`. Rows with unit intld15-2021 are value of production in
  constant 2015 international dollars, the Atlas standard basis; rows with unit nominal-usd-2021 are
  nominal 2021 US dollars and share the basis of the published hazard product. The two must not be
  summed or compared. unit_full is an identical copy of unit kept for older readers; unit carries the
  vintage since 2026-09-25 (before that it read intld15 and usd).
  ROW POPULATION. Crop rows exist per technology (all, irr, rf-all, rf-highinput, rf-lowinput,
  rf-subsistence); the whole-crop figure is tech = all. Livestock rows (cattle, sheep, goats, pigs,
  poultry, each split highland / tropical, plus total-highland and total-tropical) have no technology
  and carry number and vop only. Every row is a sum (stat = sum).
  CHANGED AGAINST THE PREVIOUS PUBLICATION (2026-10-06). Both value bases were republished after one
  correction pass (hazards_prototype issues 38, 39 and 40, and a review of the nominal price method;
  method text docs/methods/nominal_price_method.md in the repository). NOMINAL-USD-2021 ROWS: the price
  per country and crop is now FAOSTAT's implied price (gross production value in current US dollars
  divided by production), with the producer price as fallback, a test that rejects frozen
  local-currency imputations, a clip to five times the world value, median fills from neighbours,
  region and continent, a within-crop basis guard, and four cited evidence pins (Angola banana; coffee
  in Ethiopia, Uganda and Guinea, per tonne of green bean). Own prices now cover about 80 per cent of
  FAOSTAT production, up from about 56. Continental nominal crop value is about 0.82 times the previous
  publication; the largest per-crop moves are cowpea (0.33), plantain (0.41) and coffee (0.57), where
  FAO's own country valuations replace fills that had carried a few high prices across whole regions.
  INTLD15-2021 ROWS: a FAOSTAT item shared by several MapSPAM crops is split by production share
  (small-millet now has values and pearl-millet no longer carries all millet value); bananas and
  plantains are pooled and split the same way; where MapSPAM holds less than 10 per cent of FAOSTAT's
  tonnage for a country and crop, the constant-dollar value is left empty instead of being placed on a
  sliver of cells (every crop in Sudan, plus a few small pairs elsewhere); North Africa lies outside the
  MapSPAM release and has no constant-dollar crop rows. BOTH: values are allocated and priced on the
  0.05 degree grid at both resolutions, so the Seychelles, empty on the 0.25 degree grid before, now
  carry value. Livestock rows did not change.
  INTERIM MISMATCH WITH THE HAZARD PRODUCT. africa-hazard-exposure-nexgddp as published on 2026-09-30
  was built with the previous nominal prices. Until it is re-baked against this table (scheduled
  immediately after this publication), an exposed share computed as hazard product divided by this
  table is too high for crops whose price fell: cowpea about three times, plantain about 2.4 times,
  coffee about 1.75 times, and it can exceed 100 per cent. Most crops are within a few per cent.
  KNOWN LIMITATIONS. FAOSTAT coffee tonnage for the Central African Republic (about 300 thousand
  tonnes) and Guinea (about 240) is far above International Coffee Organization figures (2-6 and about
  9), and MapSPAM is calibrated to FAOSTAT, so coffee value there is overstated on both bases. Three
  pairs remain outside the cross-basis band for documented tonnage or price reasons: Ethiopia tea,
  Togo oil palm, Guinea-Bissau maize.
  On this 0.25 degree table a small country's border units can show value of a crop it does not grow
  in FAOSTAT (Chad yams, Benin bean): that is the neighbour's value in grid cells assigned to the unit
  under the one-cell-one-zone allocation (hazards_prototype issue 18).
  HISTORY. The unsuffixed key variable=crop-livestock_all.parquet is a deprecated alias of the 0.05
  degree table, not of this one. Until 2026-09-25 the only published table was on the 0.05 degree
  grid and its livestock constant-dollar rows held nominal values (hazards_prototype issue 30); this
  resolution-explicit table was first published with that fix.

contact:
  - organization: Alliance of Bioversity International and CIAT
    url: https://alliancebioversityciat.org/
    roles: [licensor, producer]
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact]

citation:
  title: Africa Agriculture Adaptation Atlas combined crop and livestock exposure table, 0.25 degree grid
  authors:
    - "Alliance of Bioversity International and CIAT"
  date: "2026"
  publisher: Alliance of Bioversity International and CIAT
  url: https://adaptationatlas.cgiar.org/

created: "2026-09-26"
updated: "2026-10-06"

spatial:
  bbox: [-26.0, -35.0, 58.0, 28.0] # Sub-Saharan Africa, 55 countries present
  crs: EPSG:4326
  geography: [sub-saharan-africa]
  resolution:
    - type: xy
      value: 0.25
      unit: degree
      label: 0.25 degree (NEX-GDDP-CMIP6 hazard grid; zonal statistics only, the table itself is per administrative unit)

temporal:
  date: "2020" # MapSPAM 2020 and GLW4 2020 physical quantities; values are 2019-2023 median FAOSTAT prices and production values

dimensions:
  - name: exposure
    type: variable
    description: What is being counted.
    values: [prod, harv-area, phys-area, vop, number]
  - name: unit
    type: unit
    description: >
      Unit of `value`, and for vop the currency basis. Select on this column; the constant-dollar and
      nominal-dollar rows must not be combined.
    values: [t, ha, intld15-2021, nominal-usd-2021, number]
  - name: tech
    type: technology
    description: MapSPAM production system for crop rows; tech = all is the whole crop. Absent for livestock rows.
    values: [all, irr, rf-all, rf-highinput, rf-lowinput, rf-subsistence]
  - name: crop
    type: commodity
    description: >
      Commodity, 54 present: 42 MapSPAM crops plus livestock species split highland / tropical
      (cattle, sheep, goats, pigs, poultry) and their totals.
  - name: gaul2_code
    type: location
    description: >
      Administrative unit as the GAUL 2024 code. Country rows carry gaul0_code only, first-level rows
      gaul0 and gaul1, second-level rows all three; admin1_name and admin2_name are null above their
      level. 55 countries, 696 first-level and 4,338 second-level units are present on this grid.

variables:
  - name: value
    dimensions: [exposure, unit, tech, crop, gaul2_code]
    description: The exposure total for that commodity and unit, summed over the cells the unit owns on the 0.25 degree grid.
    data_type: double
    unit: "1"
  - name: unit_full
    dimensions: [unit]
    description: Identical copy of `unit`, kept for readers written before the vintage moved into `unit`.
    data_type: string
    unit: "1"

joins:
  - target: https://digital-atlas.s3.amazonaws.com/domain=boundaries/type=admin/source=gaul2024/region=africa/processing=analysis-ready/level=adm2/atlas_gaul24_a2_africa.parquet
    left_fields: [gaul2_code]
    right_fields: [gaul2_code]

processing:
  - id: source
    description: >
      MapSPAM 2020 Adaptation Atlas SSA production, harvested and physical area rasters; GLW4 2020
      livestock density rasters; FAOSTAT gross production value, producer prices and production for
      the currency layers.
    derived_from:
      - title: MapSPAM2020_AdaptationAtlas_SSA (record mapspam2020-adaptation-atlas-ssa)
        url: https://doi.org/10.7910/DVN/Z0HK7R
      - title: Gridded Livestock of the World 4, 2020
        url: https://www.fao.org/livestock-systems/global-distributions/en/
      - title: FAOSTAT Value of Agricultural Production, Producer Prices, Crops and livestock products
        url: https://www.fao.org/faostat/en/#data
  - id: value
    description: >
      Crop value in constant 2015 international dollars distributes FAOSTAT gross production value
      across pixels by the production share of the MapSPAM crops that share a FAOSTAT item, left empty
      where MapSPAM holds under 10 per cent of FAOSTAT's tonnage; crop nominal 2021 US dollars multiply
      SPAM production by a national price (FAOSTAT implied price, producer-price fallback, stale-price
      test, world clip, median fills, basis guard, cited pins; docs/methods/nominal_price_method.md);
      both computed on the 0.05 degree grid and sum-resampled; livestock values distribute FAOSTAT
      national values by GLW4 head share.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: R/0.4.0_create_crop_vop_intld15.R, R/0.4.1_create_livestock_vop.R, R/0.4.2_create_crop_vop_nominal_usd.R
  - id: zonal
    description: >
      Rasterise GAUL 2024 units onto the 0.25 degree NEX-GDDP grid (EXPOSURE_RES=0.25), sum every
      exposure raster per unit, and stack the results into one table with the unit vintage kept in
      the name.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: R/0.4.4_process_exposure.R

data:
  - name: crop-livestock-all-res-25
    description: >
      One parquet, about 5.5 million rows and 7 MB, sorted for predicate pushdown. A JSON sidecar
      beside it records the zonal grid, source versions and per-column descriptions. Published by
      scripts/r3_publish_tiers.R --reference-only --res 0.25.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=exposure/type=combined/source=glw4-2020_spam2020AA/region=ssa/processing=atlas-harmonized/variable=crop-livestock_all_res-25.parquet
        title: HTTPS
      - url: s3://digital-atlas/domain=exposure/type=combined/source=glw4-2020_spam2020AA/region=ssa/processing=atlas-harmonized/variable=crop-livestock_all_res-25.parquet
        title: S3
    media_type: application/vnd.apache.parquet
    file_size: 7 MB
    processing_steps: [source, value, zonal]

cdh:
  domain: [agricultural-production]
  usage:
    intended_uses:
      - Denominator for africa-hazard-exposure-nexgddp, turning exposed value into a share of total value per unit.
      - Total crop and livestock value, production, area and head per administrative unit on the same footprint as the hazard product.
    not_recommended_for:
      - use: Dividing the hazard product by the 0.05 degree sibling table instead of this one.
        reason: >
          The 0.05 degree table resolves about 2,100 more second-level units than the 0.25 degree
          hazard product populates; shares come out above 100 per cent in small units.
        use_instead: This table (crop-livestock_all_res-25) for anything divided into the hazard product.
      - use: Summing or comparing rows across the two vop units.
        reason: intld15-2021 is constant 2015 international dollars; nominal-usd-2021 is nominal 2021 US dollars.
        use_instead: Filter on `unit` and stay on one basis.
      - use: Dividing africa-hazard-exposure-nexgddp by this table before that product is re-baked (October 2026).
        reason: The hazard product published 2026-09-30 uses the previous nominal prices; shares are inflated where prices fell (cowpea, plantain, coffee).
        use_instead: Wait for the re-baked hazard product, or restrict to crops whose price did not move.
      - use: Coffee value for the Central African Republic or Guinea.
        reason: FAOSTAT and MapSPAM coffee tonnage there is far above International Coffee Organization figures.
        use_instead: No substitute in this table; treat as an upper bound.
      - use: Reading the table as a map of second-level units for a small country.
        reason: >
          A second-level unit that owns no 0.25 degree cell has no row here. Use the 0.05 degree
          sibling where completeness of small units matters and the hazard product is not involved.
        use_instead: africa-exposure-combined-res05.
