# CDH v0.3.0 metadata record — HOTOSM health + education facilities, Kenya (KE-39 exposure overlay, Adaptation Atlas).
# Validate (cdh-metadata-standard v0.3.0 checkout):
#   node scripts/validate-yaml.js --profile spec/schemas/profiles/cdh.schema.json <this file>
$schema: https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.3.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json

id: kenya-facilities-hotosm
title: Kenya Health and Education Facilities (HOTOSM)
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Health facilities and education facilities (schools) for Kenya from the Humanitarian OpenStreetMap
  Team exports on HDX (OpenStreetMap-derived), clipped to Kenya and delivered as two GeoJSON files.
  The critical-asset overlay of the KE-ENSO Explorer flood and drought exposure. HOTOSM is the open
  working substitute for the official registries (KMHFR health facilities, GIGA schools), whose APIs
  were not reachable when the layer was built.
resource_type: dataset
license: ODbL-1.0 # OpenStreetMap contributors via HOTOSM; a clip/subset, so the source licence carries through

keywords:
  [
    health facilities,
    schools,
    education,
    critical infrastructure,
    HOTOSM,
    OpenStreetMap,
    exposure,
    Kenya,
  ]

note: >
  ODbL: attribution "(c) OpenStreetMap contributors, via Humanitarian OpenStreetMap Team" and
  share-alike apply to redistribution of the data. Snapshot of the HDX export as of August 2026.
  OSM-derived completeness varies by region; this is not an authoritative facility registry.

contact:
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact]
  - organization: Humanitarian OpenStreetMap Team (via HDX)
    url: https://data.humdata.org/organization/hot
    roles: [licensor, producer]

citation:
  title: "HOTOSM Kenya Health Facilities and Education Facilities (OpenStreetMap Export)"
  authors: [Humanitarian OpenStreetMap Team, OpenStreetMap contributors]
  date: "2026"
  publisher: Humanitarian Data Exchange (HDX)
  url: https://data.humdata.org/dataset/hotosm_ken_health_facilities

created: "2026-08-28"
updated: "2026-09-14"

spatial:
  bbox: [33.9, -4.7, 41.9, 5.5]
  crs: EPSG:4326
  geography: [kenya]
  geometry_column: geometry
  resolution:
    - type: point
      label: Facility features (points, some building polygons)

temporal:
  date: "2026-08" # snapshot of the HDX export

processing:
  - id: source
    description: HDX HOTOSM health-facility and education-facility exports (OpenStreetMap-derived).
    derived_from:
      - title: HDX hotosm_ken_health_facilities
        url: https://data.humdata.org/dataset/hotosm_ken_health_facilities
      - title: HDX hotosm_ken_education_facilities
        url: https://data.humdata.org/dataset/hotosm_ken_education_facilities
  - id: clip
    description: Resolve the HDX CKAN resource, force EPSG:4326, clip to the Kenya bbox, write GeoJSON.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_exposure_hotosm.py

data:
  - name: health
    description: Health facilities, GeoJSON.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=exposure/type=infrastructure/source=hotosm/region=kenya/processing=analysis-ready/variable=health/health.geojson
        title: HTTPS
      - url: s3://digital-atlas/domain=exposure/type=infrastructure/source=hotosm/region=kenya/processing=analysis-ready/variable=health/health.geojson
        title: S3
    media_type: application/geo+json
    file_size: 2.0 MB
    processing_steps: [source, clip]
  - name: schools
    description: Education facilities (schools), GeoJSON.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=exposure/type=infrastructure/source=hotosm/region=kenya/processing=analysis-ready/variable=schools/schools.geojson
        title: HTTPS
      - url: s3://digital-atlas/domain=exposure/type=infrastructure/source=hotosm/region=kenya/processing=analysis-ready/variable=schools/schools.geojson
        title: S3
    media_type: application/geo+json
    file_size: 10.3 MB
    processing_steps: [source, clip]

additional_links:
  - name: Open Data Commons Open Database License v1.0
    rel: license
    url: https://opendatacommons.org/licenses/odbl/1-0/
  - name: OpenStreetMap copyright and licence
    rel: about
    url: https://www.openstreetmap.org/copyright
    description: Attribution wording required for OpenStreetMap-derived data.

cdh:
  domain: [socioeconomic]
  usage:
    intended_uses:
      - Counting health facilities and schools exposed to flood or drought when overlaid with the hazard layers.
    not_recommended_for:
      - use: Treating counts as a complete or authoritative facility registry.
        reason: OpenStreetMap-derived; completeness varies by region.
        use_instead: The KMHFR (health) and GIGA (schools) official registries where accessible.
