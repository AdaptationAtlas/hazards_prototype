# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Projected trend (change per year and per decade) in seasonal climate-hazard values for Africa, by
# administrative unit, from an 18-model NEX-GDDP-CMIP6 ensemble (Adaptation Atlas). Supersedes the
# pre-standard draft ensemble_season_trends.cdh.yaml.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/climate/schema.json

id: africa-hazard-season-trends-nexgddp
title: Projected Trends in Seasonal Climate Hazards by Administrative Unit, Africa (NEX-GDDP-CMIP6 18-model ensemble)
version: v2026.11
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  How fast nine agro-climatic hazard indices (rainfall, temperature, heat-stress days, dry days, soil
  water stress, waterlogging, and human and livestock heat stress) are projected to change within
  each 20-year window from 2021 to 2100, for every country and first-level administrative unit in
  Africa, by rolling three-month season and for the whole year, under four emissions scenarios. A
  trend line is fitted to each of 18 NEX-GDDP-CMIP6 climate models separately, using a method that
  resists outlier years; each row gives the average trend across the models and how much the models
  disagree. Use it to map where and in which season a hazard is getting worse fastest, and how
  consistent the models are about it.
resource_type: dataset
license: CC-BY-4.0 # Atlas-derived aggregate; NEX-GDDP-CMIP6 input is openly licensed
attribution: >
  Climate scenarios used were from the NEX-GDDP-CMIP6 dataset, prepared by the Climate Analytics
  Group and NASA Ames Research Center using the NASA Earth Exchange, and distributed by the NASA
  Center for Climate Simulation (NCCS).
keywords:
  - climate hazards
  - agro-climatic indices
  - trend
  - change per decade
  - Theil-Sen slope
  - Sen's slope
  - trend-free pre-whitening
  - climate projections
  - multi-model ensemble
  - NEX-GDDP
  - administrative units

note: >
  Only the size and direction of the trend are published. Whether a trend is statistically
  significant is not: averaging significance tests across models has no clear meaning, and a measure
  of model agreement is planned instead. Trends are fitted within each 20-year window separately and
  are not a trend over the whole century. Country-level rows (admin1_name empty) for Egypt, Kenya,
  Sudan and South Sudan, the four countries that claim disputed border areas, are missing values;
  use their first-level units. Read the files with hive partitioning turned off (in DuckDB,
  hive_partitioning = false): the storage path contains timeframe=3months, which otherwise replaces
  the timeframe column. Changes to these files before and since this first Hub version are listed in
  the linked version history.

