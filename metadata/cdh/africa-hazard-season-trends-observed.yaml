# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Observed trends, WMO 1991-2020 normals and seasonal anomalies of agro-climatic hazard indices for Africa,
# 1982-2024, per 0.25-degree cell and by administrative unit (CHIRPS v3 / CHIRTS-ERA5 / AgERA5; Adaptation
# Atlas). Built by R/obs/s7_trends_anomalies.R, published by scripts/s7_publish_obs_trends.R
# (DISPATCH_cglabs_obs_long_series.md, M-20261119-s7-2). The three file inventories next to this record list
# every COG; the publisher's gate P1 stops if the files on disk and these inventories differ.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json

id: africa-hazard-season-trends-observed
title:
  Observed Trends, Normals and Anomalies of Seasonal Climate Hazards, Africa 1982-2024 (CHIRPS, CHIRTS-ERA5,
  AgERA5)
version: v1.0
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  How five agro-climatic hazard indices (soil water-stress days, waterlogging days, days above 35 °C,
  seasonal rainfall and the livestock temperature-humidity index) have changed over the 43 growing
  seasons 1982-2024 across Africa, computed from observation-based daily data over each crop's own
  growing season and over a 12-month livestock window. For every 0.25-degree cell it gives the trend
  (change per decade and whether it is statistically significant), the 1991-2020 normal (mean,
  spread and percentiles), and each season's anomaly against that normal. The same statistics are
  given for every country and first- and second-level administrative unit, averaged over cropland
  or livestock (by production) as well as over all land. Use it to see where a hazard has already
  been rising, and how unusual a given season was.
resource_type: dataset
license: CC-BY-4.0 # Atlas-derived; CHIRPS / CHIRTS are public domain, AgERA5 is under the Copernicus licence
attribution: >
  Rainfall from CHIRPS v3 and temperature from CHIRTS-ERA5, Climate Hazards Center, UC Santa Barbara.
  Humidity and radiation from AgERA5: contains modified Copernicus Climate Change Service information
  (2026); neither the European Commission nor ECMWF is responsible for any use of the information.
keywords:
  - climate hazards
  - agro-climatic indices
  - observed trends
  - Theil-Sen slope
  - Mann-Kendall test
  - false discovery rate
  - climate normal
  - anomaly
  - CHIRPS
  - CHIRTS-ERA5
  - AgERA5
  - administrative units

note: >
  Seasons are labelled by their start year: a season that starts in one year and ends in the next
  carries the first year, so in eastern Kenya, which plants in October, season 2010 is the OND-2010
  failure. The trend significance (p_mk) is a Mann-Kendall test with the Hamed-Rao autocorrelation
  correction applied inflate-only, so a trend is never judged more significant than the plain test
  would judge it; sig_fdr controls the false discovery rate (Benjamini-Hochberg, 0.05) within one
  stack only (one window x index for the grids; one admin level x window x index x weighting for the
  tables). CHIRPS blends a station network whose density changes over time, so part of a rainfall
  trend, and of the soil-water indices that use rainfall, may come from the network rather than the
  climate. CHIRTS-ERA5 temperatures were repaired at coastal-edge pixels above physical caps (57 °C
  maximum, 43 °C minimum), mostly on the Red Sea, Gulf of Aden and Gulf coasts. The soil layers
  behind NDWS and NDWL0 had coverage gaps filled by interpolation within 0.5 degrees. Mauritius,
  Cabo Verde and Seychelles lie outside the processed area and have no values. The admin tables
  carry three weightings; read crop windows by crop_production and the livestock window (annual12)
  by livestock_tlu, since the area weighting is dominated by land that produces nothing. The
  -rh15 source is a sensitivity variant of THI_max_max only, using relative humidity at 15:00.
  Read the tables with hive partitioning turned off, or the version= path segment becomes a column.
  Every object has a JSON sidecar (key + .json) with its checksums, code commit and field notes.

