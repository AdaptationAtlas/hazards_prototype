created: "2026-11-19"
updated: "2026-11-19"

spatial:
  bbox: [-25.5, -47.0, 63.6, 37.6] # Africa including island states
  crs: EPSG:4326
  geography: [africa]

temporal:
  start_date: "1982"
  end_date: "2024"

structures:
  - name: cell-trend
    dimensions: &cell-dims
      - name: cell
        type: xy
        description: >
          0.25-degree cell on the NEX-GDDP-CMIP6 lattice, so the grids line up with the projected
          Atlas hazard products. Cells outside Africa, and land cells without a season, are NaN.
        step: 0.25
        unit: degree
      - &source-dim
        name: source
        type: source
        description: >
          Input combination. chirps-chirts-agera5: CHIRPS v3 rainfall, CHIRTS-ERA5 temperature and
          AgERA5 humidity and radiation. chirps-chirts-agera5-rh15: the same, with the
          temperature-humidity index computed from relative humidity at 15:00 (THI_max_max only; a
          sensitivity layer).
        values: [chirps-chirts-agera5, chirps-chirts-agera5-rh15]
        data_type: string
      - &window-dim
        name: window
        type: season
        description: >
          Season window, per cell. ggcmi-<crop> is that crop's GGCMI rainfed growing season (bar barley,
          bea bean, cas cassava, cot cotton, mai maize, mil millet, nut groundnut, pea field pea, pot
          potato, rap rapeseed, ri1 rice, sgb sugar beet, sor sorghum, soy soybean,
          sun sunflower, swh spring wheat). annual12 is the 12 months from the cell's maize planting
          month, used for livestock and for crops without a GGCMI calendar. custom-mai_plant-8 is the
          8 months from maize planting, custom-mai_maturity-4 the 4 months up to maize maturity.
        values:
          [
            annual12,
            custom-mai_maturity-4,
            custom-mai_plant-8,
            ggcmi-bar,
            ggcmi-bea,
            ggcmi-cas,
            ggcmi-cot,
            ggcmi-mai,
            ggcmi-mil,
            ggcmi-nut,
            ggcmi-pea,
            ggcmi-pot,
            ggcmi-rap,
            ggcmi-ri1,
            ggcmi-sgb,
            ggcmi-sor,
            ggcmi-soy,
            ggcmi-sun,
            ggcmi-swh,
          ]
        data_type: string
      - &index-dim
        name: index
        type: hazard
        description: >
          Hazard index and the statistic taken over the window's months. NDWS_mean soil water-stress
          days, NDWL0_mean waterlogging days and NTx35_mean days above 35 °C, each per month and
          averaged over the window; PTOT_sum total precipitation over the window (mm); THI_max_max the
          highest monthly maximum livestock temperature-humidity index (unitless).
        values: [NDWL0_mean, NDWS_mean, NTx35_mean, PTOT_sum, THI_max_max]
        data_type: string
    variables:
      - name: slope_per_decade
        description: >
          Theil-Sen (Sen's) slope of the seasonal index value over the seasons 1982-2024, in the
          index's unit per decade. NaN where fewer than 30 seasons are valid.
        data_type: float32
        nodata: "NaN"
      - name: p_mk
        description: >
          Two-sided Mann-Kendall p-value of the trend, with the Hamed-Rao (1998) autocorrelation
          correction applied inflate-only: the variance is widened for positive serial correlation and
          never narrowed, so p is never smaller than the uncorrected Mann-Kendall p.
        data_type: float32
        nodata: "NaN"
        unit: "1"
      - name: sig_fdr
        description: >
          1 where the trend is significant at a false discovery rate of 0.05 (Benjamini-Hochberg over
          the valid cells of this one window x index grid), 0 where it is not. The control holds
          within one grid only.
        data_type: float32
        nodata: "NaN"
        categories:
          - value: 0
            label: Not significant
          - value: 1
            label: Significant at FDR 0.05
      - name: n_years
        description: Valid seasons in the trend, of 43; slope and p are NaN below 30.
        data_type: float32
        nodata: "NaN"
        unit: "1"
  - name: cell-normal
    dimensions: *cell-dims
    variables:
      - name: mean
        description: >
          Mean of the seasonal index value over the WMO 1991-2020 normal, in the index's unit. NaN
          where fewer than 25 of the 30 seasons are valid (as for every band of this structure).
        data_type: float32
        nodata: "NaN"
      - name: sd
        description: Standard deviation over the 1991-2020 normal.
        data_type: float32
        nodata: "NaN"
      - name: p10
        description: 10th percentile over the 1991-2020 normal.
        data_type: float32
        nodata: "NaN"
      - name: p50
        description: Median over the 1991-2020 normal.
        data_type: float32
        nodata: "NaN"
      - name: p90
        description: 90th percentile over the 1991-2020 normal.
        data_type: float32
        nodata: "NaN"
  - name: cell-anomaly
    dimensions:
      - name: cell
        type: xy
        description: 0.25-degree cell on the NEX-GDDP-CMIP6 lattice; outside Africa NaN.
        step: 0.25
        unit: degree
      - *source-dim
      - *window-dim
      - *index-dim
      - name: season
        type: temporal
        description: >
          Season, labelled by its start year; one band per season, named by that year.
        extent: ["1982", "2024"]
        step: P1Y
    variables:
      - name: anomaly_diff
        description: >
          The season's value minus the 1991-2020 normal mean, in the index's unit (days per month, mm
          or THI units).
        data_type: float32
        nodata: "NaN"
      - name: anomaly_z
        description: >
          The season's anomaly divided by the 1991-2020 standard deviation (a standardised anomaly).
          NaN where the standard deviation is not above 0.
        data_type: float32
        nodata: "NaN"
        unit: "1"
  - name: admin-trends
    dimensions: &admin-dims
      - *source-dim
      - name: level
        type: location
        description: >
          Administrative level of the file and of its rows: admin0 country, admin1 and admin2 as in FAO
          GAUL 2024 (catalogued as africa-admin-boundaries-gaul2024). One file per level.
        values: [admin0, admin1, admin2]
        data_type: string
      - name: iso3
        type: location
        description: ISO 3166-1 alpha-3 country code.
        reference_system: https://www.iso.org/iso-3166-country-codes.html
        data_type: string
      - name: admin0_name
        type: location
        description: Country name, as in FAO GAUL 2024.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: string
      - name: admin1_name
        type: location
        description: First-level unit name (GAUL 2024); in the admin1 and admin2 files only.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: string
      - name: admin2_name
        type: location
        description: Second-level unit name (GAUL 2024); in the admin2 file only.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: string
      - *window-dim
      - *index-dim
      - name: weighting
        type: statistic
        description: >
          How the cell values are averaged into the unit. Read crop windows by crop_production and the
          livestock window (annual12) by livestock_tlu; use area only for a land-area view.
        categories:
          - value: area
            label: Land area
            description: >
              Cell area times boundary coverage: every land cell counts, so land that produces
              nothing dominates large units.
          - value: crop_production
            label: Crop production
            description: >
              MapSPAM 2020 production (t) of the crops that use this window, summed per cell.
          - value: livestock_tlu
            label: Livestock (TLU)
            description: >
              GLW4 2020 head counts in Tropical Livestock Units (cattle 0.7, sheep and goats 0.1, pigs
              0.2, poultry 0.01), so poultry numbers do not swamp the weight. annual12 window only.
        data_type: string
    variables:
      - name: slope_per_decade
        description: >
          Theil-Sen slope of the unit's own seasonal series (the weighted mean of its cells) over
          1982-2024, in the index's unit per decade. The admin statistics are computed on the unit's
          series, not by averaging cell statistics.
        data_type: float64
      - name: p_mk
        description: >
          Two-sided Mann-Kendall p-value of the unit's trend, Hamed-Rao correction applied inflate-only
          (as for the grids).
        data_type: float64
        unit: "1"
      - name: sig_fdr
        description: >
          1 where the trend is significant at a false discovery rate of 0.05 (Benjamini-Hochberg over
          all units of one admin level x window x index x weighting), 0 where it is not.
        data_type: float64
      - name: n_years
        description: Valid seasons in the unit's trend, of 43; slope and p are missing below 30.
        data_type: float64
        unit: "1"
      - name: normal_mean
        description: Mean of the unit's seasonal values over the WMO 1991-2020 normal (missing below 25 valid seasons).
        data_type: float64
      - name: normal_sd
        description: Standard deviation of the unit's seasonal values over the 1991-2020 normal.
        data_type: float64
  - name: admin-series
    dimensions:
      - *source-dim
      - name: level
        type: location
        description: Administrative level of the file and of its rows (admin0, admin1, admin2; GAUL 2024).
        values: [admin0, admin1, admin2]
        data_type: string
      - name: iso3
        type: location
        description: ISO 3166-1 alpha-3 country code.
        reference_system: https://www.iso.org/iso-3166-country-codes.html
        data_type: string
      - name: admin0_name
        type: location
        description: Country name, as in FAO GAUL 2024.
        data_type: string
      - name: admin1_name
        type: location
        description: First-level unit name (GAUL 2024); in the admin1 and admin2 files only.
        data_type: string
      - name: admin2_name
        type: location
        description: Second-level unit name (GAUL 2024); in the admin2 file only.
        data_type: string
      - *window-dim
      - *index-dim
      - name: weighting
        type: statistic
        description: >
          How the cell values are averaged into the unit: area, crop_production or livestock_tlu, as in
          the admin-trends structure. Read crop windows by crop_production and the livestock window
          (annual12) by livestock_tlu.
        values: [area, crop_production, livestock_tlu]
        data_type: string
      - name: year
        type: temporal
        description: Season, labelled by its start year.
        extent: ["1982", "2024"]
        step: P1Y
        data_type: int32
    variables:
      - name: value
        description: The unit's seasonal index value (weighted mean of its cells), in the index's unit.
        data_type: float64
      - name: anomaly_diff
        description: value minus the unit's 1991-2020 normal mean (normal_mean in the trends table).
        data_type: float64
      - name: anomaly_z
        description: anomaly_diff divided by the unit's 1991-2020 standard deviation; missing where it is not above 0.
        data_type: float64
        unit: "1"

processing:
  - id: source
    description: >
      Daily CHIRPS v3 rainfall, CHIRTS-ERA5 maximum and minimum temperature and AgERA5 humidity and
      radiation, 1981-2025, read from the Climate Data Hub cubes and aggregated to the 0.25-degree
      NEX-GDDP-CMIP6 lattice; coastal CHIRTS-ERA5 values above 57 °C (maximum) or 43 °C (minimum)
      replaced by the median of the valid neighbours.
    derived_from:
      - title: CHIRPS-3.0 (Climate Hazards Center)
        url: https://data.chc.ucsb.edu/products/CHIRPS-3.0/
      - title: CHIRTS-ERA5 (Climate Hazards Center)
        url: https://www.chc.ucsb.edu/data/chirts
      - title: AgERA5 (Copernicus Climate Change Service)
        url: https://cds.climate.copernicus.eu/datasets/sis-agrometeorological-indicators
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/python/obs/s1_ingest.py
      version: develop
  - id: seasonal
    description: >
      Monthly hazard indices (the same definitions as the projected Atlas hazards; soil water from a
      bucket model on gap-filled soil layers), then one value per cell, season window and season
      start year: the mean, sum or maximum of the window's months.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/R/obs/s3_s5_obs_hazards.R
      version: develop
  - id: statistics
    description: >
      Per cell and per admin unit, over the 43 seasons 1982-2024: Theil-Sen slope; Mann-Kendall
      test with an inflate-only Hamed-Rao correction (only significant lags of the rank
      autocorrelation of the Sen-detrended series); Benjamini-Hochberg at 0.05 within each grid or
      table group; WMO 1991-2020 normal (mean, sd, p10, p50, p90; 25 of 30 seasons needed); and each
      season's anomaly. Admin units average their cells by area, crop production or livestock TLU
      first, then take the statistics of that series.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/R/obs/s7_trends_anomalies.R
      version: develop
  - id: publish
    description: >
      Gated publish: the anomalies are re-derived from the input stacks and the table anomalies from
      the trends table before upload; every object gets a JSON sidecar with MD5 and SHA-256 and the
      code commit; a version is never overwritten.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/scripts/s7_publish_obs_trends.R
      version: develop

