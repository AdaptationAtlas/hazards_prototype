  - title: Projected trends in seasonal climate hazards (NEX-GDDP-CMIP6)
    rel: related
    url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/metadata/cdh/africa-hazard-season-trends-nexgddp.yaml
    description: The projected counterpart, by administrative unit and 20-year window.

cdh:
  domain: [climate]
  usage:
    intended_uses:
      - Mapping where a hazard has risen or fallen since 1982, per cell or per admin unit.
      - Judging how unusual a past season was against the 1991-2020 normal.
      - Comparing observed 1995-2014 conditions with the NEX-GDDP-CMIP6 baseline of the projected Atlas products.
    not_recommended_for:
      - use: Treating a rainfall trend as a climate signal without checking the station record.
        reason: >
          CHIRPS station density changes over time, so part of a rainfall trend may come from the
          network rather than the climate.
        use_instead: Corroborate with station records or a second rainfall product where it matters.
      - use: Reading crop or livestock exposure from the area weighting.
        reason: Area-weighted means are dominated by land that produces nothing.
        use_instead: The crop_production or livestock_tlu weighting.
      - use: Testing many grids or tables jointly with sig_fdr.
        reason: The false discovery rate is controlled within one grid or table group only.
        use_instead: Re-run a false discovery rate procedure on p_mk over the set you are testing.
