      index, four bands. 114 files.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=hazard-indices/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=hazard-indices/
        title: S3
    file_index:
      - format: cdh-inventory
        title: File inventory, trend grids
        locations:
          - url: ./africa-hazard-season-trends-observed-files-trends.csv
        media_type: text/csv
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    processing_steps: [source, seasonal, statistics, publish]
    structures: [cell-trend]
  - name: cell-normals
    description: Normal grids, one COG per source x window x index, five bands. 114 files.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=hazard-indices/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=hazard-indices/
        title: S3
    file_index:
      - format: cdh-inventory
        title: File inventory, normal grids
        locations:
          - url: ./africa-hazard-season-trends-observed-files-normals.csv
        media_type: text/csv
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    processing_steps: [source, seasonal, statistics, publish]
    structures: [cell-normal]
  - name: cell-anomalies
    description: >
      Anomaly grids, one COG per source x window x index x anomaly type (difference, standardised),
      one band per season 1982-2024. 228 files.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=hazard-indices/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=hazard-indices/
        title: S3
    file_index:
      - format: cdh-inventory
        title: File inventory, anomaly grids
        locations:
          - url: ./africa-hazard-season-trends-observed-files-anomalies.csv
        media_type: text/csv
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    processing_steps: [source, seasonal, statistics, publish]
    structures: [cell-anomaly]
  - name: admin-trends
    description: >
      Trend and normal per admin unit, window, index and weighting; one Parquet table per source and
      admin level.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=hazard-indices/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=hazard-indices/
        title: S3
    href_template: source={source}/region=africa/processing=trends/version=v1.0/admin_trends_{level}_1982-2024_v1.0.parquet
    media_type: application/vnd.apache.parquet
    processing_steps: [source, seasonal, statistics, publish]
    structures: [admin-trends]
  - name: admin-series
    description: >
      Seasonal value and anomaly per admin unit, window, index, weighting and season; one Parquet
      table per source and admin level (the admin2 table of the main source has about 37 million
      rows).
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=hazard-indices/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=hazard-indices/
        title: S3
    href_template: source={source}/region=africa/processing=anomalies/version=v1.0/admin_series_{level}_1982-2024_v1.0.parquet
    media_type: application/vnd.apache.parquet
    processing_steps: [source, seasonal, statistics, publish]
    structures: [admin-series]

