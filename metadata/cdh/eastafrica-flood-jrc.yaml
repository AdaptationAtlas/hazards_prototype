# CDH v0.3.0 record - JRC / GloFAS return-period river-flood hazard, global, federated to the
# cloud-optimized Source Cooperative publication. The Atlas holds a provisional Kenya crop.
# Validate (cdh-metadata-standard v0.3.0 checkout):
#   node scripts/validate-yaml.js --profile spec/schemas/profiles/cdh.schema.json <this file>
$schema: https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.3.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json

id: eastafrica-flood-jrc
title: JRC / GloFAS Return-Period River Flood Hazard (Global)
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Modelled global riverine flood hazard from the JRC / GloFAS Global Flood Maps (CEMS-GLOFAS v2.1.2):
  inundation depth for seven return periods, 10 to 500 years, at 3 arc-seconds, as a static baseline
  climatology. Published as Cloud Optimized GeoTIFFs with internal overviews on Source Cooperative,
  which is the canonical read location. The Adaptation Atlas additionally holds a provisional Kenya
  crop of the same data. Within the KE-ENSO Explorer this is the MODELLED flood-prone baseline
  complementing the OBSERVED Copernicus GFM extent (record kenya-flood-gfm): JRC answers "how
  flood-prone at magnitude X", GFM answers "where and when it actually flooded".
resource_type: dataset
license: CC-BY-4.0 # JRC / European Commission free and open data policy

keywords:
  [
    flood,
    river flood,
    hazard,
    return period,
    JRC,
    GloFAS,
    inundation depth,
    Kenya,
    East Africa,
  ]

note: >
  FEDERATED TO THE CLOUD-OPTIMIZED UPSTREAM (2026-09-18, following review on cdh-catalog#32).
  The full global product is already published as COGs with internal overviews under CC-BY-4.0 on
  Source Cooperative, at the same seven return periods and the same 3 arc-second resolution as the
  Atlas crop. The canonical asset in this record is therefore the global collection, not our subset.
  The Kenya crop is retained as a provisional second asset because the KE-ENSO Explorer currently
  reads it, but it carries no information the global collection lacks and the performance argument
  for keeping it is untested. Measuring that is the open task; retiring the duplicate is the likely
  outcome.
  Static modelled hazard (return-period depths); not an observed time series and not
  scenario-projected, so no temporal coverage is declared. Pair with the GFM observed extent for the
  "modelled vs observed" flood story.

contact:
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact]
  - organization: Source Cooperative / Radiant Earth Foundation
    url: https://source.coop/nlebovits/jrc-glofas
    roles: [processor]
  - organization: European Commission Joint Research Centre (JRC)
    url: https://data.jrc.ec.europa.eu/
    roles: [licensor, producer]

citation:
  title: "Development and evaluation of a framework for global flood hazard mapping"
  authors:
    - "Dottori, F."
    - "Salamon, P."
    - "Bianchi, A."
    - "Alfieri, L."
    - "Hirpa, F. A."
    - "Feyen, L."
  date: "2016"
  publisher: Advances in Water Resources
  url: https://doi.org/10.1016/j.advwatres.2016.05.002
related_publications:
  - doi: 10.1016/j.advwatres.2016.05.002

created: "2026-08-28"
updated: "2026-09-14"

spatial:
  bbox: [-170.0, -59.99, 179.97, 80.0] # global extent of the canonical Source Cooperative collection; the Atlas crop covers [33.9, -4.7, 41.9, 5.5]
  crs: EPSG:4326
  geography: [world, kenya]
  resolution:
    - type: xy
      value: 3
      unit: arc_second
      label: 3 arc-seconds (~90 m)

dimensions:
  - name: return_period
    type: return-period
    description: Flood recurrence interval in years; the {return_period} token (rp=10 ... rp=500).
    values: [10, 20, 50, 75, 100, 200, 500]
    unit: year

variables:
  - name: flood_depth
    dimensions: [return_period]
    description: Modelled inundation depth for the given return period; 0 or NoData = not flood-prone at that magnitude.
    data_type: float32
    unit: m

processing:
  - id: source
    description: JRC / GloFAS global river flood hazard maps (hydrodynamic modelling of return-period flows).
    derived_from:
      - title: JRC Global Flood Maps (JRC Data Catalogue)
        url: https://data.jrc.ec.europa.eu/dataset/jrc-floods-floodmapgl_rp50y
      - title: Global riverine flood hazard maps, JRC CEMS-GLOFAS v2.1.2 (Source Cooperative)
        url: https://source.coop/nlebovits/jrc-glofas
  - id: crop-cog
    description: Crop to the Kenya window and write one COG per return period with internal overviews.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_flood_jrc.py

data:
  - name: global-cog
    description: >
      The full global product as cloud-optimized GeoTIFFs with internal overviews, one collection per
      return period, published on Source Cooperative. Same seven return periods, same 3 arc-second
      resolution and same CC-BY-4.0 terms as the subset below - this is the canonical thing to read.
    locations:
      - url: https://data.source.coop/nlebovits/jrc-glofas/
        title: HTTPS
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    processing_steps: [source]
  - name: kenya-crop
    description: >
      A Kenya-window crop of the same data, held on Atlas storage and read by the KE-ENSO Explorer.
      PROVISIONAL, and kept only for as long as it earns its place: it adds no information over the
      global collection above, and exists solely on the expectation that a smaller window renders
      faster in the browser. That trade-off has NOT been measured. If the global COGs perform
      acceptably over range requests, this asset should be retired rather than maintained as a
      duplicate.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=flood/source=jrc-glofas/region=east-africa/processing=return-period/variable=flood-depth/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=flood/source=jrc-glofas/region=east-africa/processing=return-period/variable=flood-depth/
        title: S3
    href_template: "rp={return_period}/flood-depth_rp{return_period}.tif" # e.g. rp=100/flood-depth_rp100.tif
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    file_size: 28 MB
    processing_steps: [source, crop-cog]

cdh:
  domain: [hydrology]
  usage:
    intended_uses:
      - Static flood-prone baseline behind the observed GFM extent in the KE-ENSO Explorer.
      - Population and infrastructure exposure to flood magnitudes (record kenya-flood-exposure-intersect).
    not_recommended_for:
      - use: Reading it as observed or future-scenario flooding.
        reason: Modelled static return-period hazard for the baseline climatology only.
        use_instead: Copernicus GFM observed flood extent (record kenya-flood-gfm).
