# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Year-to-year variability of seasonal climate-hazard values for Africa, by administrative unit, now
# and projected, from an 18-model NEX-GDDP-CMIP6 ensemble (Adaptation Atlas).
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/climate/schema.json

id: africa-hazard-season-variability-nexgddp
title: Year-to-Year Variability of Seasonal Climate Hazards by Administrative Unit, Africa (NEX-GDDP-CMIP6 18-model ensemble)
version: v2026.11
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  How much nine agro-climatic hazard indices (rainfall, temperature, heat-stress days, dry days, soil
  water stress, waterlogging, and human and livestock heat stress) swing from one year to the next,
  for every country and first-level administrative unit in Africa, by rolling three-month season and
  for the whole year. Variability is measured for 1995-2014 and for each 20-year window from 2021 to
  2100 under four emissions scenarios, as the standard deviation of yearly values after removing the
  window's trend. Each of 18 NEX-GDDP-CMIP6 climate models is measured separately; rows give the
  average across models, the spread between them, and for future windows the change from 1995-2014
  and the share of models that project more variability. Use it to see where seasons are projected
  to become more erratic, not just wetter, drier or hotter on average.
resource_type: dataset
license: CC-BY-4.0 # Atlas-derived aggregate; NEX-GDDP-CMIP6 input is openly licensed
attribution: >
  Climate scenarios used were from the NEX-GDDP-CMIP6 dataset, prepared by the Climate Analytics
  Group and NASA Ames Research Center using the NASA Earth Exchange, and distributed by the NASA
  Center for Climate Simulation (NCCS).
keywords:
  - climate hazards
  - agro-climatic indices
  - interannual variability
  - year-to-year variability
  - detrended standard deviation
  - model agreement
  - climate projections
  - multi-model ensemble
  - NEX-GDDP
  - administrative units

note: >
  The column pct_gcms_increase holds a fraction from 0 to 1, not a percentage. Country-level rows
  (admin1_name empty) for Egypt, Kenya, Sudan and South Sudan, the four countries that claim
  disputed border areas, are missing values; use their first-level units. Read the files with hive
  partitioning turned off (in DuckDB, hive_partitioning = false): the storage path contains
  timeframe=3months, which otherwise replaces the timeframe column. Changes to these files before
  and since this first Hub version are listed in the linked version history.

