id: kenya-population-knbs-projections
title: KNBS Official Population Projections by County, 2020-2045 (Kenya)
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Kenya's official cohort-component population projections, from the 2019 KPHC Analytical Report on
  Population Projections (Volume XVI, KNBS 2022), tabulated from the report's Appendix 5 as
  county x year x 5-year age group x sex, keyed on IEBC COD-AB adm1_pcode. National trajectory
  48.82 M (2020), 53.33 M (2025), 57.81 M (2030), 62.16 M (2035), 66.31 M (2040), 70.18 M (2045).
  Lets forward-framed flood and drought exposure use a population denominator for the year in
  question instead of a 2020 surface read as current.
resource_type: dataset
license: LicenseRef-KNBS-All-Rights-Reserved # CORRECTED 2026-09-18. Volume XVI states "All rights reserved ... without the prior written permission of the Bureau". This is NOT an open licence and the earlier LicenseRef-KNBS-Open-License claim on this record was wrong. Redistribution of derived tables requires written permission from KNBS - see the licence note.

keywords:
  [
    population,
    projections,
    KNBS,
    cohort-component,
    denominator,
    exposure,
    counties,
    Kenya,
    2020-2045,
  ]

note: >
  LICENCE - CORRECTED 2026-09-18, READ BEFORE REUSE OR REDISTRIBUTION.
  This record previously claimed the KNBS Open License Agreement. That was WRONG. Volume XVI was
  read directly on 2026-09-18 and its copyright page states: "(c) 2022 Kenya National Bureau of
  Statistics. All rights reserved. No part of this publication may be reproduced, distributed, or
  transmitted in any form or by any means ... without the prior written permission of the Bureau."
  The KNBS Open License Agreement is scoped to data published on the KNBS Open Data Platform and
  does not reach a PDF published on knbs.or.ke, and a search of HDX on 2026-09-18 found NO licensed
  mirror of these projections anywhere - the UNFPA COD-PS product (cod-ps-ken, CC-BY-3.0-IGO) carries
  the 2019 census only and contains no projections, so there is no openly licensed substitute.
  CONSEQUENCE. Extracting these figures for analysis is ordinary research use. REDISTRIBUTING them,
  including as the derived parquet files this record points at, needs written permission from KNBS
  (info@knbs.or.ke / directorgeneral@knbs.or.ke, the addresses given in the report). Until that
  permission exists this record must NOT be submitted to cdh-catalog, and the published derivatives
  should be treated as pending clearance rather than as open data. Tracked in hazards_prototype
  issue 33.
  This constraint does NOT apply to the census counts - record kenya-population-knbs-census is
  CC0-1.0, released without restriction by KNBS's own HDX account.

  LICENCE EVIDENCE.
  Weaker footing than the census record, and the difference is worth stating. KNBS's Open License
  Agreement grants worldwide, royalty-free, non-exclusive rights to reuse, adapt, redistribute and
  create derivative works with attribution - but it is scoped to data published on the KNBS Open
  Data Platform, and Volume XVI is a PDF hosted on knbs.or.ke. Unlike the 2019 census tables, no
  licensed mirror of these projections exists anywhere (searched HDX, open.africa and the Kenya data
  portal, 2026-09-17): UNFPA's COD-PS covers the census, not Volume XVI. What is published here is a
  derived tabulation of figures printed in a public national statistical report, attributed, not a
  copy of the report. Confirm with KNBS before this record is contributed to cdh-catalog.
  Required attribution:
  "This product was adapted from the Statistical Office of Kenya's information, which is licensed under the KNBS Open License Agreement."

  COUNTY ONLY. Volume XVI does not project below county - no sub-county name appears anywhere in the
  report - so this record stops at county. The KE-ENSO exposure tables (record
  kenya-flood-exposure-intersect) do carry sub-county figures for a projection year, and the way they
  get there is stated there in full: each sub-county's share of its county is held fixed at the
  gridded 2020 distribution and the whole county is moved by its own percentage change from this
  table (pop_growth_county), with the enumerated census supplying the level. That means no
  sub-county-specific growth is represented; growth varies between counties (2025 factors span 1.03
  to 1.15) but is uniform within one. Anyone wanting genuine sub-county differentials needs a source
  that produces them - this one does not.
  YEAR COVERAGE IS UNEVEN. The report's annual panels cover 2020-2035; 2040 and 2045 appear only in
  the five-yearly milestone panel, so 2036-2039 and 2041-2044 are absent.
  TWO SOURCE DEFECTS, both handled and logged by the ingest rather than silently absorbed.
  (1) Busia 2030, age 80+, female reads 3,120 in the 2030-2035 panel against 5,799 in the two other
  panels that carry 2030; the printed row total (9,714) reconciles only with 5,799, so 5,799 is
  used. (2) Kiambu's 2026-2030 panel labels its open-ended top age group "80-84" where every other
  panel says "80+"; it is relabelled "80+", without which it would double-count against the
  overlapping panels.
  KNBS rounds each printed cell independently, so sums do not close exactly: age groups land within
  five people of the printed All Ages row, and the 47 counties sum to roughly 15 to 20 people below
  the national row in every year.
  The identical report is also hosted as ...-Analytical-Report-on-Population-Projections-Vol-XVI.pdf
  (2024/05, 32.9 MB); its extracted text is identical to the 2023/09 upload used here.

