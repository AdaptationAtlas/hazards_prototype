cdh:
  domain: [socioeconomic]
  usage:
    intended_uses:
      - Population denominator for a stated projection year in forward-framed exposure work.
      - County age and sex structure for vulnerability weighting (children, older people).
    not_recommended_for:
      - use: Sub-county (adm2) projected denominators.
        reason: Volume XVI projects to county only.
        use_instead: County projection combined with a gridded within-county share, stated as such.
      - use: Years 2036-2039 or 2041-2044.
        reason: Not published - the annual panels stop at 2035 and only 2040 and 2045 follow.
        use_instead: The nearest published year, or interpolate and say so.
      - use: Reporting the 2019 enumerated baseline.
        reason: These are projections, not census counts.
        use_instead: Record kenya-population-knbs-census.
