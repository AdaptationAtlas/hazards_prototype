spatial:
  bbox: [33.9, -4.7, 41.9, 5.5]
  crs: EPSG:4326
  geography: [kenya]
  resolution:
    - type: polygon
      value: 1
      unit: admin-level
      label: counties (47 admin-1 units)
      reference_system: OCHA COD-AB Kenya (IEBC), record kenya-admin-codab

temporal:
  start_date: "2020"
  end_date: "2045"

dimensions:
  - name: adm1_pcode
    type: location
    description: IEBC county p-code (47 units); the join key to the boundary record.
  - name: year
    type: temporal
    description: Projection year. Annual 2020-2035 plus the 2040 and 2045 milestones; 2036-2039 and 2041-2044 are not published.
    values:
      [
        "2020",
        "2021",
        "2022",
        "2023",
        "2024",
        "2025",
        "2026",
        "2027",
        "2028",
        "2029",
        "2030",
        "2031",
        "2032",
        "2033",
        "2034",
        "2035",
        "2040",
        "2045",
      ]
    step: P1Y
  - name: age_group
    type: other
    description: Five-year age groups, open-ended at 80+.
    values:
      [
        "0-4",
        "5-9",
        "10-14",
        "15-19",
        "20-24",
        "25-29",
        "30-34",
        "35-39",
        "40-44",
        "45-49",
        "50-54",
        "55-59",
        "60-64",
        "65-69",
        "70-74",
        "75-79",
        "80+",
      ]
  - name: sex
    type: other
    description: Projected sex; "total" is the report's own Total column (male + female).
    values: [male, female, total]

variables:
  - name: population
    dimensions: [adm1_pcode, year, age_group, sex]
    description: Projected people in the county in that year, age group and sex.
    data_type: int64
    unit: "{person}"
  - name: pop_total
    dimensions: [adm1_pcode, year]
    description: Totals table. All Ages, both sexes - the county denominator for a projection year.
    data_type: int64
    unit: "{person}"
  - name: pop_male
    dimensions: [adm1_pcode, year]
    description: Totals table. All Ages, male.
    data_type: int64
    unit: "{person}"
  - name: pop_female
    dimensions: [adm1_pcode, year]
    description: Totals table. All Ages, female.
    data_type: int64
    unit: "{person}"

joins:
  - target: https://digital-atlas.s3.amazonaws.com/domain=boundaries/type=admin/source=iebc-codab/region=kenya/processing=analysis-ready/level=adm1/ken_adm1.geojson
    left_fields: [adm1_pcode]
    right_fields: [adm1_pcode]

processing:
  - id: source
    description: KNBS 2019 KPHC Analytical Report on Population Projections, Volume XVI, Appendix 5.
    derived_from:
      - title: 2019 KPHC Analytical Report on Population Projections (Volume XVI)
        url: https://www.knbs.or.ke/wp-content/uploads/2023/09/2019-Kenya-population-and-Housing-Census-Analytical-Report-on-Population-Projections.pdf
  - id: tabulate
    description: >
      Extract Appendix 5 with pdftotext -layout, parse each county block's age x sex x year panels,
      reconcile the years that appear in more than one panel (ties broken on the row's own
      male + female = total, so a cell contradicting its printed total loses), attach IEBC COD-AB
      adm1_pcode, write parquet. Gated on the published national totals for all six milestone years,
      on the 47 counties resolving in COD-AB order, and on counties summing to the national row.
    date: "2026-09-15"
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_population_knbs_projections.py

