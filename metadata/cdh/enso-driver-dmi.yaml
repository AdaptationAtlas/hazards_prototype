cdh:
  domain: [climate]
  usage:
    intended_uses:
      - Characterising Indian Ocean Dipole state when selecting analogue seasons for Kenyan seasonal outlooks.
    not_recommended_for:
      - use: Including DMI values in a redistributed Atlas data product.
        reason: >
          HadISST is Crown Copyright under a Non-Commercial Government Licence, which is incompatible
          with the open licences the Atlas publishes under.
        use_instead: Cite the index and link to the provider; compute and display without redistributing the series.
      - use: Weighting IOD and ENSO equally in an unscaled analogue distance.
        reason: >
          For Kenya OND the two axes have very different spread (ENSO sd about 1.179 against IOD
          about 0.362), so an unscaled squared distance lets ENSO dominate by roughly ten to one -
          backwards for the season IOD matters most in.
        use_instead: Z-score each driver axis before computing distance.
