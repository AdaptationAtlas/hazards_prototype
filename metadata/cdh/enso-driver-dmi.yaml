citation:
  title: Indian Ocean Dipole Mode Index (DMI), monthly, ERSSTv6, 1991-2020 climatology
  authors:
    - "NOAA Climate Prediction Center"
  date: "2026"
  publisher: NOAA National Weather Service, Climate Prediction Center
  url: https://www.cpc.ncep.noaa.gov/products/international/ocean_monitoring/indian/IODMI/DMI_month.html

created: "2026-09-18"
updated: "2026-09-18"

temporal:
  start_date: "1950-01"
  end_date: null

dimensions:
  - name: month
    type: temporal
    description: Calendar month of the anomaly, one row per month.
    step: P1M

variables:
  - name: WTIO
    dimensions: [month]
    description: Western tropical Indian Ocean SST anomaly, averaged over 50E-70E, 10S-10N.
    data_type: float32
    unit: Cel
  - name: SETIO
    dimensions: [month]
    description: South-eastern tropical Indian Ocean SST anomaly, averaged over 90E-110E, 10S-0.
    data_type: float32
    unit: Cel
  - name: DMI
    dimensions: [month]
    description: Dipole Mode Index, WTIO minus SETIO. Positive is a positive IOD phase.
    data_type: float32
    unit: Cel

processing:
  - id: source
    description: >
      CPC area-averages ERSSTv6 sea-surface-temperature anomalies over the two dipole poles defined by
      Saji and colleagues (1999), against a 1991-2020 climatology, and publishes the poles and their
      difference as a monthly fixed-width table.
    derived_from:
      - title: NOAA CPC Indian Ocean Dipole Mode Index
        url: https://www.cpc.ncep.noaa.gov/products/international/ocean_monitoring/indian/IODMI/DMI_month.html
      - title: NOAA Extended Reconstructed Sea Surface Temperature (ERSST)
        url: https://www.ncei.noaa.gov/products/extended-reconstructed-sst

data:
  - name: dmi-monthly
    description: Fixed-width monthly table, columns Year, Month, WTIO, SETIO, DMI.
    locations:
      - url: https://www.cpc.ncep.noaa.gov/products/international/ocean_monitoring/indian/IODMI/mnth.ersstv6.clim19912020.dmi_current.txt
        title: HTTPS
    media_type: text/plain
    processing_steps: [source]

cdh:
  domain: [climate]
  usage:
    intended_uses:
      - Characterising Indian Ocean Dipole state when selecting analogue seasons for Kenyan seasonal outlooks.
      - Pairing with RONI (record enso-driver-roni) on a single SST reconstruction and base period.
    not_recommended_for:
      - use: Splicing this series onto the HadISST-based DMI served by NOAA PSL.
        reason: >
          Different SST reconstruction and different climatology, so the join introduces a step
          change that would be read as a physical signal.
        use_instead: One source end to end; this one, which is also the openly licensed option.
      - use: Weighting IOD and ENSO equally in an unscaled analogue distance.
        reason: >
          For Kenya OND the two axes have very different spread (ENSO sd about 1.179 against IOD
          about 0.362), so an unscaled squared distance lets ENSO dominate by roughly ten to one -
          backwards for the season IOD matters most in.
        use_instead: Z-score each driver axis before computing distance.
