id: enso-driver-dmi
title: Indian Ocean Dipole Mode Index (DMI, HadISST-based)
description: >
  Monthly Dipole Mode Index for the Indian Ocean: the anomalous sea-surface-temperature gradient
  between the western equatorial Indian Ocean (50E-70E, 10S-10N) and the south-eastern equatorial
  Indian Ocean (90E-110E, 10S-0N), computed from the Met Office Hadley Centre HadISST dataset and
  served as monthly time series by NOAA PSL. A federated record: the Adaptation Atlas cites this
  index but does not host or redistribute it.
resource_type: dataset
license: LicenseRef-UK-NCGL-2.0 # inherited from HadISST - see the licence note. NOT an open licence.
keywords:
  [
    indian ocean dipole,
    iod,
    dmi,
    sea surface temperature,
    climate index,
    hadisst,
  ]

note: >
  LICENCE - READ BEFORE REUSE. The underlying HadISST data are Crown Copyright, Met Office, released
  under the UK Non-Commercial Government Licence: the material may be downloaded for private study
  and scientific research, and any other use requires a licence from the Met Office IPR officer
  (ipr@metoffice.gov.uk). This is NOT an open licence and it does not match the CC-BY-4.0 terms of
  most Adaptation Atlas products. Citing DMI values is fine; baking them into a published Atlas
  artifact (a parquet or COG that ships the numbers) is a licensing question, not a technical one.
  As of 2026-09-18 no Adaptation Atlas producer stage ingests any sea-surface-temperature index,
  verified by grep across every tracked R, shell and Python source, so nothing downstream inherits
  this restriction today.
  DATA SHAPE. NOAA PSL serves the western and eastern poles as separate time series; the DMI is
  their difference. Take both poles from the same source and vintage rather than mixing providers.
  KNOWN GAP. In the KE-ENSO Explorer staging as of 2026-09-15, DMI is NULL for all of 2025 in both
  seasons, so 2025 cannot be used as an analogue year - and a z-scored analogue distance computed
  over a NULL axis fails SILENTLY rather than erroring.

