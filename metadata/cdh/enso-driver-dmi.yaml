  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json

id: enso-driver-dmi
title: Indian Ocean Dipole Mode Index (DMI, NOAA CPC / ERSSTv6)
description: >
  Monthly Dipole Mode Index for the Indian Ocean as published by the NOAA Climate Prediction Center:
  the sea-surface-temperature anomaly of the western tropical Indian Ocean (50E-70E, 10S-10N) minus
  that of the south-eastern tropical Indian Ocean (90E-110E, 10S-0), computed from ERSSTv6 against a
  1991-2020 climatology. A federated record - the Adaptation Atlas cites this index but does not host
  or redistribute it.
resource_type: dataset
license: CC0-1.0 # work of the US Government; NCEI records "no constraints on data access or use" for ERSST
keywords:
  [
    indian ocean dipole,
    iod,
    dmi,
    sea surface temperature,
    climate index,
    ersst,
    seasonal forecasting,
  ]

note: >
  CURRENT ATLAS CONSUMPTION HAS NOT CAUGHT UP WITH THIS RECORD (2026-09-18). This record describes
  the CPC ERSSTv6 series, which is the source the Atlas should read and the one that is openly
  licensed. The KE-ENSO notebook staging still fetches DMI from NOAA PSL's HadISST-based file and
  feeds it to the analogue engine, and the driver display falls back to an ERSST-based value only for
  the most recent point - a mid-series reconstruction switch, which is the very failure mode this
  record warns against. So the non-commercial HadISST encumbrance described below is LIVE in the
  consuming notebook until that migration happens. Tracked as hazards_prototype issue 36.
  SOURCE CHOICE IS DELIBERATE. The widely cited DMI series served by NOAA PSL is computed from
  HadISST, which is Crown Copyright, Met Office, released under the UK Non-Commercial Government
  Licence - downloads permitted for private study and scientific research, any other use requiring a
  licence from the Met Office IPR officer. That is incompatible with the open licences Adaptation
  Atlas products carry, so this record uses the CPC ERSSTv6 series instead, which is a work of the US
  Government with no constraints on access or use.
  The swap is not only a licensing fix. CPC computes RONI (record enso-driver-roni) from the same
  ERSSTv6 reconstruction against the same 1991-2020 base period, so pairing CPC DMI with CPC RONI
  puts both drivers on one SST basis and one climatology. Pairing HadISST DMI with ERSSTv6 RONI does
  not, and mixing reconstructions is the same class of error as mixing RONI with the raw Nino 3.4
  anomaly.
  VALUES DIFFER FROM THE HadISST SERIES. A different SST reconstruction and a different climatology
  produce a different series, not a relabelled one. Any analysis that selected analogue seasons from
  the HadISST-based DMI must be re-run after switching; do not splice the two.
  COVERAGE. Monthly, 1950-01 onward, updated automatically on the first Thursday of each month; the
  live file ran to 2026-08 when this record was written. This also resolves the staleness in the
  KE-ENSO staging, where DMI was NULL for all of 2025 in both seasons - a gap that made 2025 unusable
  as an analogue year and that failed SILENTLY in a z-scored analogue distance.
  The file carries both poles (WTIO, SETIO) alongside the index, so the two legs of a dipole event
  can be distinguished rather than inferred from the difference alone.

