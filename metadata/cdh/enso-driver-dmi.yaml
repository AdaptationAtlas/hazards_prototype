processing:
  - id: source
    description: >
      Met Office Hadley Centre produces HadISST; NOAA PSL area-averages the two dipole poles from it
      and publishes monthly time series, the difference of which is the Dipole Mode Index.
    derived_from:
      - title: Met Office Hadley Centre HadISST
        url: https://www.metoffice.gov.uk/hadobs/hadisst/
