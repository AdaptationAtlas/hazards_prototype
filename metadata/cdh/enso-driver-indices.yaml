created: "2026-09-25"
updated: "2026-09-25"

spatial:
  bbox: [-180.0, -20.0, 180.0, 20.0]
  crs: EPSG:4326
  geography: [global-oceans, equatorial-pacific, indian-ocean]

temporal:
  start_date: "1950-01"
  end_date: null

dimensions:
  - name: month
    type: temporal
    description: Calendar month of observation (1950 to present).
    step: P1M
  - name: season
    type: categorical
    description: Three-month seasonal rolling window (MAM, OND, etc.).

variables:
  - name: nino34_anom_noaa
    dimensions: [month]
    description: Unadjusted NOAA CPC Nino 3.4 SST anomaly relative to 1991-2020 base period.
    unit: Cel
  - name: roni
    dimensions: [season]
    description: Relative Oceanic Nino Index (Nino 3.4 minus tropical-mean anomaly).
    unit: Cel
  - name: dmi_ersst
    dimensions: [month]
    description: Dipole Mode Index computed from NOAA ERSSTv6 (WTIO minus SETIO).
    unit: Cel
  - name: dmi_hadisst
    dimensions: [month]
    description: Dipole Mode Index computed from Met Office HadISST.
    unit: Cel
  - name: wnp_std_mam
    dimensions: [season]
    description: Standardised Western North Pacific SST index for MAM Long Rains teleconnections.
    unit: dimensionless
  - name: wep_std_ond
    dimensions: [season]
    description: Standardised West Equatorial Pacific SST index for OND Short Rains.
    unit: dimensionless

data:
  - name: driver_indices_parquet
    description: Monthly multi-driver table combining Pacific, Indian Ocean, and Western-V indices.
    s3: s3://digital-atlas/domain=climate/type=teleconnections/driver_indices.parquet
    media_type: application/vnd.apache.parquet
  - name: enso_drivers_seasonal_parquet
    description: Seasonal rolling windows for RONI, DMI, and ENSO state classifications.
    s3: s3://digital-atlas/domain=climate/type=teleconnections/enso_drivers_seasonal.parquet
    media_type: application/vnd.apache.parquet

cdh:
  domain: [climate]
  usage:
    intended_uses:
      - Selecting historical analogue seasons for Kenyan seasonal outlooks.
      - Evaluating conditional probability distributions of rainfall anomalies.
      - Quantifying seasonal teleconnection asymmetry between OND and MAM.
    not_recommended_for:
      - use: Deterministic point-forecasts of county rainfall from ocean index values alone.
        reason: Ocean drivers alter conditional probability distributions; local weather is mediated by topography and synoptic meteorology.
        use_instead: Ensemble probabilistic scenarios combined with official KMSA statutory outlooks.
