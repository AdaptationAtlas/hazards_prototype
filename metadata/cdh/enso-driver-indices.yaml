id: enso-driver-indices
title: Ocean Climate Teleconnection Drivers (Pacific RONI, Indian Ocean DMI & Western-V)
description: >
  Harmonised multi-decadal monthly and seasonal time series of primary equatorial ocean-atmosphere
  climate teleconnection drivers governing Kenyan rainfall: NOAA CPC Relative Oceanic Niño Index
  (RONI) for Pacific ENSO state; NOAA CPC / HadISST Dipole Mode Index (DMI) for Indian Ocean Dipole
  state; and Funk et al. Western-V SST index for MAM Long Rains teleconnections. Standardised and
  compiled into analysis-ready parquet tables (1950 to present).
resource_type: dataset
license: CC0-1.0 # US Government public domain (NOAA CPC) combined with open academic indices
keywords:
  [
    enso,
    roni,
    oceanic nino index,
    indian ocean dipole,
    iod,
    dmi,
    western v,
    teleconnections,
    sea surface temperature,
    kenya rainfall,
    seasonal forecasting,
  ]

note: >
  Attribution: "Data provided by NOAA Climate Prediction Center (CPC) and compiled for the African Agriculture Adaptation Atlas (AAAA)."
  RELATIVE OCEANIC NINO INDEX (RONI) OVER RAW NINO 3.4. CPC computes RONI by subtracting the
  tropical-mean (20S-20N) SST anomaly from the Nino 3.4 anomaly. This detrending removes secular
  tropical ocean warming (~+0.6 degC since 1950) that otherwise causes historical cool baselines to
  register as artificial permanent El Nino conditions. Always use RONI for multi-decadal analogue
  selection.
  INDIAN OCEAN DIPOLE (IOD) DOMINANCE IN SHORT RAINS. The DMI is the primary physical forcing of
  Kenyan rainfall variability during the October-December (OND) Short Rains. Warm ENSO and positive
  IOD co-occur frequently but can decouple; off-diagonal states (El Nino + negative IOD) produce
  subdued anomalies.
  SEASONAL ASYMMETRY AND LONG RAINS (MAM) DECOUPLING. Pacific ENSO indices exhibit weak correlation
  with Kenyan rainfall during the March-May (MAM) Long Rains (r ~ 0.08). The Western-V index
  captures western Pacific warm pool gradients that govern convective subsidence over the Horn of
  Africa, providing independent predictive skill where ENSO fails.
  Z-SCORE STANDARDIZATION REQUIREMENT. Pacific SST anomalies (~0.5-2.5 degC) and regional rainfall
  anomalies exhibit a 10.6:1 variance distortion ratio. Multi-driver analogue selection must use
  z-score standardisation across all driver dimensions to ensure equal physical weighting.

