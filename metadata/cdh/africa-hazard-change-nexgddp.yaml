climate:
  mip_era: CMIP6
  scenarios: [historical, ssp126, ssp245, ssp370, ssp585]
  models:
    - ensemble
    - ACCESS-CM2
    - ACCESS-ESM1-5
    - CanESM5
    - CMCC-ESM2
    - EC-Earth3
    - EC-Earth3-Veg-LR
    - GFDL-ESM4
    - INM-CM4-8
    - INM-CM5-0
    - IPSL-CM6A-LR
    - KACE-1-0-G
    - MIROC6
    - MPI-ESM1-2-HR
    - MPI-ESM1-2-LR
    - MRI-ESM2-0
    - NorESM2-LM
    - NorESM2-MM
    - TaiESM1
  baseline:
    start_date: "1995-01-01"
    end_date: "2014-12-31"
  bias_adjustment:
    method: BCSD
    reference_dataset: GMFD
  downscaling:
    method: statistical
    resolution: 0.25

commodities: [cattle]

cdh:
  domain: [climate]
  usage:
    intended_uses:
      - Comparing how often drought, waterlogging and heat thresholds are crossed now and in future windows, by district.
      - Mapping where annual rainfall is projected to rise or fall, as a share of land and in millimetres.
      - Showing model agreement with the per-model tables or the ensemble minimum, maximum and spread.
    not_recommended_for:
      - use: Reading rainfall percentage change in deserts.
        reason: >
          Cells with less than 100 mm of rain a year are never counted as an increase or decrease, so
          a desert unit can show 0 % on both.
        use_instead: Use the change in millimetres (rainfall-difference tables), which covers all land.
      - use: Crop-specific heat stress.
        reason: The crop heat tables use generic 35 °C and 40 °C day counts, not each crop's own limits.
        use_instead: The crop-specific heat sets in the hazard-exposure records (africa-hazard-exposure-nexgddp).
