# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# How often drought, waterlogging and heat thresholds are crossed, and how annual rainfall changes,
# per 20-year window, by administrative unit across Africa, per NEX-GDDP-CMIP6 model and as an
# 18-model ensemble (Adaptation Atlas).
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/climate/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json

id: africa-hazard-change-nexgddp
title: Hazard Frequency, Heat-Affected Area and Rainfall Change by Administrative Unit, Africa (NEX-GDDP-CMIP6)
version: v2026.11
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Five summary tables of how agro-climatic hazards change between the 1995-2014 historical period
  and four future 20-year windows (2021-2040 to 2081-2100) under four emissions scenarios, for every
  country, first-level and second-level administrative unit in Africa: how often soil water stress
  (drought) and waterlogging pass severe and extreme thresholds; the share of land where crop heat
  stress (days above 35 °C and 40 °C) and cattle heat stress (temperature-humidity index) pass those
  thresholds; the share of land where annual rainfall rises or falls by 5 % or more; and the average
  change in annual rainfall in millimetres. Each table comes once per climate model (18
  NEX-GDDP-CMIP6 models) and once as an ensemble summary (mean, minimum, maximum and standard
  deviation across the models). Use it to compare how hazard exposure shifts by place, scenario and
  window, and how much the models agree.
resource_type: dataset
license: CC-BY-4.0 # Atlas-derived aggregate; NEX-GDDP-CMIP6 input is openly licensed
attribution: >
  Climate scenarios used were from the NEX-GDDP-CMIP6 dataset, prepared by the Climate Analytics
  Group and NASA Ames Research Center using the NASA Earth Exchange, and distributed by the NASA
  Center for Climate Simulation (NCCS).
keywords:
  - climate hazards
  - hazard frequency
  - drought
  - waterlogging
  - heat stress
  - livestock heat stress
  - temperature-humidity index
  - rainfall change
  - climate projections
  - multi-model ensemble
  - NEX-GDDP
  - administrative units

note: >
  This record describes the rebuilt tables, which replace the files published on 2026-06-24 before
  the 2026.11 release; columns and keys are unchanged, and the earlier files hold duplicate rows.
  Read the files with hive partitioning turned off (in DuckDB, hive_partitioning = false): the
  storage path contains timeframe=annual, which otherwise replaces the timeframe column. Where no
  model has a value, an ensemble mean is missing and its minimum and maximum can read as plus or
  minus infinity. Country rows for Egypt, Kenya, Sudan and South Sudan may include disputed border
  areas these countries claim; prefer their first- and second-level units. Changes to these files
  are listed in the linked version history.

contact:
