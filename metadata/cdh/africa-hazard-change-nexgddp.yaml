    structures: [crop-heat-area-by-model]
    description: Share of area under crop heat stress (days above 35 °C and 40 °C), one row per model.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=hazard-indices/source=nex-gddp-cmip6/region=africa/processing=hazard-change/timeframe=annual/variable=ntx_perc_area_by_model.parquet
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=hazard-indices/source=nex-gddp-cmip6/region=africa/processing=hazard-change/timeframe=annual/variable=ntx_perc_area_by_model.parquet
        title: S3
  - <<: *data-entry
    name: crop-heat-area-ensemble
    structures: [crop-heat-area-ensemble]
    description: Share of area under crop heat stress, summarised across the 18 models.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=hazard-indices/source=nex-gddp-cmip6/region=africa/processing=hazard-change/timeframe=annual/variable=ntx_perc_area_ensemble.parquet
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=hazard-indices/source=nex-gddp-cmip6/region=africa/processing=hazard-change/timeframe=annual/variable=ntx_perc_area_ensemble.parquet
        title: S3
  - <<: *data-entry
