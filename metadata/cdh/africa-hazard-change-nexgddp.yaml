        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=hazard-indices/source=nex-gddp-cmip6/region=africa/processing=hazard-change/timeframe=annual/variable=ptot_change_by_model.parquet
        title: S3
  - <<: *data-entry
