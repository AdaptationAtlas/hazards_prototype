    description: Area phase classifications and population-in-phase tables for Kenya.
    locations:
      - url: https://www.ipcinfo.org/ipc-country-analysis/en/?country=KEN
        title: HTTPS

cdh:
  domain: [socioeconomic]
  usage:
    intended_uses:
      - Placing a season's climate anomaly next to the food-security outcome that followed it, in the KE-ENSO Explorer.
    not_recommended_for:
      - use: Differencing phases between analysis rounds to derive a trend.
        reason: >
          A phase is an expert-consensus classification over converging evidence, not a measurement.
          Methodology, evidence base and analyst panel all change between rounds, so the ordinal
          scale is not comparable across them.
        use_instead: Compare the population-in-phase figures within a round, and treat each round as its own analysis.
      - use: Folding IPC phases into a derived Atlas product licensed CC-BY-4.0.
        reason: >
          CC BY-NC-SA 3.0 IGO is both non-commercial and share-alike, so the derived work would have
          to carry the same terms - incompatible with the rest of the Atlas stack.
        use_instead: Cite the classification and link to IPC, or seek written permission from the IPC Global Support Unit.
      - use: Interpolating between analyses to get a monthly series.
        reason: Kenya is analysed twice a year, after the long-rains and short-rains assessments; nothing is observed between.
        use_instead: Use the analysis windows as published.
