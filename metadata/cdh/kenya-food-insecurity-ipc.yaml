id: kenya-food-insecurity-ipc
title: Kenya Acute Food Insecurity Phase Classification (IPC / KFSSG)
description: >
  IPC Acute Food Insecurity phase classifications and population-in-phase tables for Kenya, produced
  twice a year by the Kenya Food Security Steering Group after the long-rains and short-rains
  assessments. A federated record - the Adaptation Atlas cites this analysis but does not host it.
resource_type: dataset
license: CC-BY-NC-SA-3.0-IGO # IPC states "All IPC results are licensed under Creative Commons Attribution-Noncommercial-Share-Alike 3.0 IGO". NON-COMMERCIAL and SHARE-ALIKE - see the note.
keywords:
  [
    ipc,
    food insecurity,
    kfssg,
    acute food insecurity,
    phase classification,
    kenya,
  ]

note: >
  LICENCE CONFIRMED 2026-09-18, AND IT CONSTRAINS DOWNSTREAM USE. IPC states that all IPC results
  are licensed CC BY-NC-SA 3.0 IGO. Two consequences that do not apply elsewhere in the Atlas stack:
  NON-COMMERCIAL, so IPC figures cannot travel into a commercially licensed or commercially used
  product; and SHARE-ALIKE, so any adapted work built on them must carry the same licence, which
  conflicts with the CC-BY-4.0 most Atlas products use. Citing IPC phases and linking out is
  unencumbered; folding them into a derived Atlas layer is not. The IPC Analysis Platform is hosted
  by FAO and governed by its terms of use.
  A PHASE IS A CLASSIFICATION, NOT A MEASUREMENT. Phases 1-5 come from an expert consensus process
  over converging evidence, so they are ordinal and are NOT comparable across analysis rounds in the
  way a measured index is: methodology, evidence base and analyst panel all change between rounds. Do
  not difference phases between rounds to derive a trend, and do not interpolate between analyses.
  Kenya analyses are conducted twice a year - long rains (July-August) and short rains
  (January-February) - and the IPC process is hosted within NDMA.

