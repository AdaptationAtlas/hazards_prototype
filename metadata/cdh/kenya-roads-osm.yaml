# CDH v0.3.0 metadata record — OpenStreetMap classified roads, Kenya (KE-39 exposure overlay, Adaptation Atlas).
# Validate (cdh-metadata-standard v0.3.0 checkout):
#   node scripts/validate-yaml.js --profile spec/schemas/profiles/cdh.schema.json <this file>
$schema: https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.3.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json

id: kenya-roads-osm
title: Kenya Classified Road Network (OpenStreetMap)
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Kenya's classified road network (motorway, trunk, primary, secondary and tertiary highways)
  extracted from the Geofabrik Kenya OpenStreetMap extract and delivered as GeoJSON. The road-access
  overlay of the KE-ENSO Explorer flood and drought exposure: the network that matters for access,
  not every track and footpath.
resource_type: dataset
license: ODbL-1.0 # OpenStreetMap contributors; a clip/subset, so the source licence carries through

keywords:
  [
    roads,
    road network,
    highways,
    infrastructure,
    OpenStreetMap,
    OSM,
    access,
    exposure,
    Kenya,
  ]

note: >
  ODbL: attribution "(c) OpenStreetMap contributors" and share-alike apply to redistribution of the
  data. Classified highways only (motorway to tertiary); footways, tracks and unclassified roads are
  excluded to keep the overlay light. Snapshot of the Geofabrik extract as of August 2026.

contact:
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact]
  - organization: OpenStreetMap contributors (Geofabrik extract)
    url: https://www.openstreetmap.org/copyright
    roles: [licensor, producer]

citation:
  title: "OpenStreetMap Kenya extract (Geofabrik), classified highways"
  authors: [OpenStreetMap contributors]
  date: "2026"
  publisher: OpenStreetMap / Geofabrik GmbH
  url: https://download.geofabrik.de/africa/kenya.html

created: "2026-08-28"
updated: "2026-09-14"

spatial:
  bbox: [33.9, -4.7, 41.9, 5.5]
  crs: EPSG:4326
  geography: [kenya]
  geometry_column: geometry

temporal:
  date: "2026-08" # snapshot of the Geofabrik extract

variables:
  - name: highway
    description: OpenStreetMap highway class of the feature - one of motorway, trunk, primary, secondary, tertiary (categorical).
    data_type: string
    unit: "1"

processing:
  - id: source
    description: Geofabrik Kenya OpenStreetMap extract (kenya-latest.osm.pbf), lines layer.
    derived_from:
      - title: Geofabrik Kenya OSM extract
        url: https://download.geofabrik.de/africa/kenya.html
  - id: extract
    description: ogr2ogr the classified highways, clip to the Kenya bbox, keep osm_id / name / highway, write GeoJSON.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_exposure_osm_roads.py

data:
  - name: roads
    description: Classified road network, LineString GeoJSON.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=exposure/type=infrastructure/source=osm/region=kenya/processing=analysis-ready/variable=roads/kenya_roads.geojson
        title: HTTPS
      - url: s3://digital-atlas/domain=exposure/type=infrastructure/source=osm/region=kenya/processing=analysis-ready/variable=roads/kenya_roads.geojson
        title: S3
    media_type: application/geo+json
    file_size: 30.5 MB
    processing_steps: [source, extract]

additional_links:
  - name: Open Data Commons Open Database License v1.0
    rel: license
    url: https://opendatacommons.org/licenses/odbl/1-0/
  - name: OpenStreetMap copyright and licence
    rel: about
    url: https://www.openstreetmap.org/copyright
    description: Attribution wording required for OpenStreetMap-derived data.

cdh:
  domain: [socioeconomic]
  usage:
    intended_uses:
      - Road length exposed to flood or drought when overlaid with the hazard layers (record kenya-flood-exposure-intersect).
    not_recommended_for:
      - use: Rural access or last-mile analysis.
        reason: Only classified highways are included; tracks, footways and unclassified roads are excluded.
        use_instead: The full Geofabrik extract for the complete OpenStreetMap road network.
