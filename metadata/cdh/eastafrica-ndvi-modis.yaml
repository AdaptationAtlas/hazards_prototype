# CDH v0.3.0 metadata record — MODIS MOD13Q1 NDVI seasonal means, East Africa (KE-ENSO Explorer, Adaptation Atlas).
# Validate (cdh-metadata-standard v0.3.0 checkout):
#   node scripts/validate-yaml.js --profile spec/schemas/profiles/cdh.schema.json <this file>
$schema: https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.3.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json

id: eastafrica-ndvi-modis
title: MODIS NDVI Seasonal Vegetation Condition (East Africa)
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Normalized Difference Vegetation Index from MODIS MOD13Q1 (250 m, 16-day composites), averaged
  over the two East African rainy seasons - the long rains (MAM, March to May) and the short rains
  (OND, October to December) - for every year from 2000 to 2025, over an East Africa window centred
  on Kenya. Written as Cloud Optimized GeoTIFFs. The vegetation-condition layer of the KE-ENSO
  Explorer: greenness response to seasonal rainfall and ENSO phase.
resource_type: dataset
license: CC-BY-4.0 # MODIS data are unrestricted; credit NASA LP DAAC / USGS EROS

keywords:
  [
    NDVI,
    vegetation,
    MODIS,
    MOD13Q1,
    greenness,
    seasonal,
    rainy season,
    East Africa,
    Kenya,
  ]

note: >
  Source MODIS data are free and unrestricted; these aggregated COGs are released CC-BY-4.0 with
  attribution to NASA LP DAAC. NDVI ranges roughly -0.2 to 1.0 (higher = greener). Only the MAM and
  OND windows are published (no other seasons, no annual mean). Each file covers the full East
  Africa window (~275 MB); read with a bbox/overview to avoid whole-file downloads.

contact:
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact]
  - organization: NASA LP DAAC / USGS EROS
    url: https://lpdaac.usgs.gov/products/mod13q1v061/
    roles: [licensor, producer]

citation:
  title: "MODIS/Terra Vegetation Indices 16-Day L3 Global 250 m SIN Grid V061 (MOD13Q1)"
  authors:
    - "Didan, K."
  date: "2021"
  publisher: NASA EOSDIS Land Processes DAAC
  url: https://doi.org/10.5067/MODIS/MOD13Q1.061
related_publications:
  - doi: 10.5067/MODIS/MOD13Q1.061

created: "2026-08-28"
updated: "2026-09-14"

spatial:
  bbox: [30.0, -10.0, 50.77, 10.0] # East Africa window (verified vs live COG 9894 x 9526 cells at ~0.0021 deg)
  crs: EPSG:4326
  geography: [eastern-africa, kenya]
  resolution:
    - type: xy
      value: 250
      unit: meter
      label: ~250 m (0.0021 deg, MOD13Q1 native)

temporal:
  start_date: "2000"
  end_date: "2025"

dimensions:
  - name: season
    type: season
    description: >
      Rainy-season window: MAM = March to May (long rains), OND = October to December (short rains).
      Each value covers three months.
    values: [MAM, OND]
  - name: year
    type: temporal
    description: Calendar year of the seasonal window; the {year} token.
    values:
      [
        "2000",
        "2001",
        "2002",
        "2003",
        "2004",
        "2005",
        "2006",
        "2007",
        "2008",
        "2009",
        "2010",
        "2011",
        "2012",
        "2013",
        "2014",
        "2015",
        "2016",
        "2017",
        "2018",
        "2019",
        "2020",
        "2021",
        "2022",
        "2023",
        "2024",
        "2025",
      ]
    step: P1Y

variables:
  - name: NDVI
    dimensions: [season, year]
    description: Mean NDVI over the seasonal window (higher = greener, denser vegetation).
    data_type: float32
    unit: "1"

processing:
  - id: source
    description: MODIS MOD13Q1 Collection 6.1, 250 m 16-day NDVI composites.
    derived_from:
      - title: MODIS MOD13Q1 v061 (NASA LP DAAC)
        url: https://doi.org/10.5067/MODIS/MOD13Q1.061
  - id: aggregate-cog
    description: Average the 16-day composites falling in each MAM / OND window per year; write COGs with overviews.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_ndvi_modis.py

data:
  - name: seasonal
    description: Per-year seasonal-window mean NDVI, one COG per season x year.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=vegetation/source=modis-mod13q1/region=east-africa/processing=seasonal/variable=NDVI/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=vegetation/source=modis-mod13q1/region=east-africa/processing=seasonal/variable=NDVI/
        title: S3
    href_template: "season={season}/NDVI_{season}_{year}_mean.tif" # e.g. season=MAM/NDVI_MAM_2020_mean.tif
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    file_size: 275 MB
    processing_steps: [source, aggregate-cog]

cdh:
  domain: [agricultural-production, climate]
  usage:
    intended_uses:
      - Vegetation-condition response to seasonal rainfall and ENSO phase in the KE-ENSO Explorer.
      - Rainy-season greenness anomalies alongside the CHIRPS and SPEI layers.
    not_recommended_for:
      - use: Analysis of seasons other than MAM and OND, or of within-season phenology.
        reason: Only the two rainy-season means are published; the 16-day cadence is not retained.
        use_instead: The MOD13Q1 16-day archive at NASA LP DAAC.
