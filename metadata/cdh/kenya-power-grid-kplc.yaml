# CDH v0.3.0 metadata record — KPLC electricity transmission grid, Kenya (KE-39 exposure overlay, Adaptation Atlas).
# Validate (cdh-metadata-standard v0.3.0 checkout):
#   node scripts/validate-yaml.js --profile spec/schemas/profiles/cdh.schema.json <this file>
$schema: https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.3.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json

id: kenya-power-grid-kplc
title: Kenya Electricity Transmission Grid (KPLC)
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Kenya's electricity transmission network - 11, 33, 66, 132 and 220 kV lines - from the Kenya Power
  and Lighting Company dataset on energydata.info, merged into one line layer (141,205 features) with
  a voltage attribute and delivered as GeoJSON. The 132 and 220 kV lines are the national backbone
  (highest-value at-risk assets). The power-infrastructure overlay of the KE-ENSO Explorer flood and
  drought exposure. The source's "Unidentified Grid Network" layer is excluded; gridfinder's modelled
  medium-voltage distribution grid is a deferred complement, not included here.
resource_type: dataset
license: CC0-1.0 # as published on energydata.info

keywords:
  [
    electricity,
    transmission grid,
    power lines,
    critical infrastructure,
    KPLC,
    energydata.info,
    exposure,
    Kenya,
  ]

note: >
  Transmission lines only (11 / 33 / 66 / 132 / 220 kV), not the distribution or medium-voltage
  network. Snapshot of the energydata.info dataset as retrieved in August 2026. The S3 object is
  served as application/octet-stream; it parses as GeoJSON.

contact:
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact]
  - organization: Kenya Power and Lighting Company (KPLC), via energydata.info
    url: https://energydata.info/dataset/kenya-kenya-electricity-network
    roles: [licensor, producer]

citation:
  title: "Kenya Electricity Network (KPLC transmission lines)"
  authors: [Kenya Power and Lighting Company]
  date: "2026"
  publisher: energydata.info
  url: https://energydata.info/dataset/kenya-kenya-electricity-network

created: "2026-08-31"
updated: "2026-09-14"

spatial:
  bbox: [33.9, -4.7, 41.9, 5.5]
  crs: EPSG:4326
  geography: [kenya]
  geometry_column: geometry

temporal:
  date: "2026-08" # snapshot of the energydata.info dataset

variables:
  - name: voltage_kv
    description: Nominal line voltage (11, 33, 66, 132 or 220 kV), added from the per-voltage source layer.
    data_type: int16
    unit: kV

processing:
  - id: source
    description: energydata.info KPLC transmission network, one GeoJSON per voltage class (11 / 33 / 66 / 132 / 220 kV).
    derived_from:
      - title: energydata.info - Kenya Electricity Network
        url: https://energydata.info/dataset/kenya-kenya-electricity-network
  - id: merge-clip
    description: Resolve the CKAN resources, add voltage_kv, concatenate the five voltage layers, force EPSG:4326, clip to the Kenya bbox, write GeoJSON.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_exposure_grid.py

data:
  - name: power-grid
    description: Merged transmission grid, LineString GeoJSON with a voltage_kv attribute.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=exposure/type=infrastructure/source=energydata-kplc/region=kenya/processing=analysis-ready/variable=power-grid/kenya_power_grid.geojson
        title: HTTPS
      - url: s3://digital-atlas/domain=exposure/type=infrastructure/source=energydata-kplc/region=kenya/processing=analysis-ready/variable=power-grid/kenya_power_grid.geojson
        title: S3
    media_type: application/geo+json
    file_size: 53.1 MB
    processing_steps: [source, merge-clip]

cdh:
  domain: [socioeconomic]
  usage:
    intended_uses:
      - Transmission-line length exposed to flood or drought when overlaid with the hazard layers (record kenya-flood-exposure-intersect).
    not_recommended_for:
      - use: Treating it as the full electricity network, including distribution.
        reason: Transmission lines only (11 to 220 kV); no distribution or medium-voltage network.
        use_instead: gridfinder's modelled medium-voltage grid for distribution-level coverage.
