    s3: s3://digital-atlas/domain=exposure/type=economic/exposure_vop.parquet
    media_type: application/vnd.apache.parquet

cdh:
  domain: [agriculture, exposure]
  usage:
    intended_uses:
      - Weighting multi-hazard climate exposure by economic rangeland capital.
      - Comparing baseline pastoral livestock wealth against crop production across counties.
    not_recommended_for:
      - use: Tracking real-time intra-annual livestock herd movements or nomad grazing ranges.
        reason: GLW4 models structural spatial density, not seasonal migratory tracking.
        use_instead: High-frequency dekadal MODIS NDVI pasture anomaly tracking and NDMA drought bulletins.
