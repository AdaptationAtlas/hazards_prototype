id: livestock-vop
title: Gridded Livestock of the World (GLW4) Value of Production (Adaptation Atlas SSA)
description: >
  Livestock numbers and economic value of production for five livestock species (cattle, sheep,
  goats, pigs, poultry; plus tropical livestock units) across Sub-Saharan Africa. Based on FAO
  Gridded Livestock of the World v4 (GLW4 2020, about 10 km / 0.0833 degree), converted from
  per-square-kilometre density to head per pixel at native resolution and summed onto the Atlas
  exposure grids (0.05 and 0.25 degree). National FAOSTAT value of production is distributed by
  each pixel's share of the national herd and split into highland and tropical zones. Values are
  published in constant 2015 international dollars (vop_intld15) and, separately, nominal 2021 US
  dollars (national producer prices since 2026-10-21, hazards_prototype issue 47).
resource_type: dataset
license: CC-BY-4.0 # FAO open data licensing
keywords:
  [
    livestock density,
    value of production,
    glw4,
    faostat,
    pastoralism,
    rangeland,
    cattle,
    shoats,
    sub-saharan africa,
    exposure,
  ]

note: >
  Attribution: "Data provided by FAO Gridded Livestock of the World (GLW4) and compiled for the African Agriculture Adaptation Atlas (AAAA)."
  CURRENCY BASIS MUST REMAIN CONSTANT INTERNATIONAL DOLLARS (vop_intld15). Several value-of-production
  metrics coexist (nominal USD, constant 2015 international dollars). To avoid severe distortions
  when pairing livestock with MapSPAM crop VoP, both portfolios must be evaluated on the identical
  constant 2015 international dollar basis. Past unit mismatches produced ~7x errors in cattle exposure.
  DENSITY VS PIXEL COUNTS. The GLW4-2020 source layers are per-km2 animal density (D-DA). The
  Atlas pipeline (R/0.4.1_create_livestock_exposure.R) multiplies them by cell area at native
  resolution to get head per pixel BEFORE any resampling, then resamples by sum, so the derived
  rasters hold counts and administrative totals are plain sums - no area weighting is needed or
  applied. Anyone working from the raw GLW4 density layers instead must weight by cell area.
  (Corrected 2026-10-23, issue 49: an earlier version listed camels, 1 km resolution and density units.)
  LIVESTOCK VULNERABILITY LAGS. Unlike annual field crops which fail within a single dry dekad,
  pastoral herds exhibit biological inertia: mortality, distress sales, and conception deficits lag
  rainfall anomalies by 6 to 12 months.

