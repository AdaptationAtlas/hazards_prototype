cdh:
  domain: [socioeconomic]
  usage:
    intended_uses:
      - Official population denominator for exposure counts presented to Kenyan users.
      - Levelling gridded exposure to census totals while keeping the gridded within-county share.
      - Reconciling the ~17 per cent gap between the gridded surfaces and the enumerated census.
    not_recommended_for:
      - use: Joining the sub-county table to COD-AB adm2 units on name.
        reason: The two sub-county universes differ; only 183 of 290 COD-AB units have an exact in-county name match.
        use_instead: County totals combined with a gridded within-county share (see record kenya-flood-exposure-intersect).
      - use: Current-year population figures.
        reason: These are 2019 enumerated counts; Kenya's population has grown by several million since.
        use_instead: Record kenya-population-knbs-projections for 2020-2045.
