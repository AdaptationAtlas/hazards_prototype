# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Harvested-area hazard exposure, first published 2026-10-19 by the issue-13 full rebake.
# Verification chain: G6b (product vs the exposure input it was built from, admin2 basis), B6
# (product vs the independent canonical reference, median ratio 1.000000), and 60/60 published keys
# MD5-verified. Source dispatch: archive/dispatches/DISPATCH_cglabs_issue13_rebake.md.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/climate/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json

id: africa-hazard-exposure-harvested-area
title: Hazard Frequency crossed with Crop Harvested Area, Sub-Saharan Africa
version: v2026.11
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Crop harvested area in hectares (MapSPAM 2020) exposed to each agro-climatic hazard, by administrative
  unit, crop, hazard, severity, scenario, period and timeframe, for Sub-Saharan Africa. No valuation enters
  it, so it is unaffected by currency and price choices.
resource_type: dataset
license: CC-BY-4.0 # derived product; principal inputs (MapSPAM2020_AdaptationAtlas_SSA doi:10.7910/DVN/Z0HK7R, GLW4-2020, GAUL 2024) are all CC-BY-4.0; share-alike does NOT apply (hazards_prototype issue 37, resolved 2026-10-08)
keywords:
  - hazard exposure
  - harvested area
  - climate risk
  - CMIP6
  - NEX-GDDP

note: >
  Crops only (33 crops plus a generic-crop row); livestock have no harvested area. Values are integer
  hectares rounded per pixel before aggregation, so totals under about 10,000 ha carry relative rounding
  error of up to a few per cent. Tanzania coconut undershoots its exposure by 2.4 per cent because part
  of Pemba Island has no hazard coverage at 0.25 degrees.

contact:
  - organization: Alliance of Bioversity International and CIAT
    url: https://alliancebioversityciat.org/
    roles: [licensor, producer]
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact, maintainer]

citation:
  title: Africa Agriculture Adaptation Atlas hazard-exposure product (harvested area)
  authors:
    - organization: Alliance of Bioversity International and CIAT
  date: "2026"
  publisher: Alliance of Bioversity International and CIAT
  url: https://adaptationatlas.cgiar.org/

created: "2026-10-19"
updated: "2026-11-13"

spatial:
  bbox: [-26.0, -35.0, 58.0, 28.0] # Sub-Saharan Africa, 55 countries present
  crs: EPSG:4326
  geography: [sub-saharan-africa]
  # No horizontal axes: the table's reporting unit is the gaul2_code location dimension.

temporal:
  start_date: "1995"
  end_date: "2100"

structures:
  - name: hazard-exposure
    dimensions:
      - name: period
        type: season
        description: >
          Hazard aggregation window. jagermeyr = the Jagermeyr et al. crop-calendar growing season;
          annual = the full calendar year. One key prefix per period; both published since
          2026-10-19.
        values: [jagermeyr, annual]
      - name: severity
        type: severity
        description: Hazard severity tier. One file per period x tier.
        values: [moderate, severe, extreme]
      - name: scenario
        type: scenario
        description: Emissions pathway; historic is the CMIP6 historical run.
        values: [historic, ssp126, ssp245, ssp370, ssp585]
      - name: timeframe
        type: temporal
        description: >
          Twenty-year window, labelled here by its first year; the column stores the window as text
          (1995-2014, 2021-2040, 2041-2060, 2061-2080, 2081-2100). 1995-2014 is the historical
          baseline.
        values: ["1995", "2021", "2041", "2061", "2081"]
      - name: crop
        type: commodity
        description: Crop, 34 present (33 crops + generic-crop). Livestock absent by construction.
      - name: hazard
        type: hazard
        description: >
          Agro-climatic hazard, plus the multi-hazard interaction sets. Since 2026-10 the published
          hazard_vars sets are NDWS+NTx35+NDWL0 (generic crop heat, water-balance framing),
          NDWS+NTxM+NDWL0 (crop-specific heat, water-balance framing; NEW), PTOT-L+NTxM+PTOT-G
          (crop-specific heat, precipitation framing; RENAMED from PTOT-L+NTxS+PTOT-G, issue 25), and
          the two livestock THI sets. hazard='any'/'none' rows are present per set, and any+none per
          (unit, crop) equals the exposure the tier was built from.
      - name: gaul2_code
        type: location
        description: >
          Second-level administrative unit, as the GAUL 2024 code and the join key to the GAUL 2024 boundary file named in foreign_keys. Rows also carry iso3, admin0_name, admin1_name,
          admin2_name and the adm0 and adm1 GAUL codes. 55 countries present.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: float64
      - name: iso3
        type: location
        description: ISO 3166-1 alpha-3 country code.
        reference_system: https://www.iso.org/iso-3166-country-codes.html
        data_type: string
      - name: admin0_name
        type: location
        description: Country name, as in FAO GAUL 2024.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: string
      - name: admin1_name
        type: location
        description: First-level administrative unit name, as in FAO GAUL 2024. Null on country rows.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: string
      - name: admin2_name
        type: location
        description: >
          Second-level administrative unit name, as in FAO GAUL 2024. Null on country and first-level
          rows.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: string
      - name: gaul0_code
        type: location
        description: Country as the GAUL 2024 code; present on every row.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: float64
      - name: gaul1_code
        type: location
        description: First-level unit as the GAUL 2024 code; null on country rows.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: float64
      - name: model
        type: model
        description: Always ENSEMBLEmean, the mean across the climate models (also in the file path).
        values: [ENSEMBLEmean]
        data_type: string
      - name: hazard_vars
        type: hazard
        description: >
          The hazard set the row belongs to, as the three hazard indices joined by + (dry, heat, wet);
          see `hazard` for the sets present.
        data_type: string
      - name: exposure_var
        type: variable
        description: What is exposed; one per tier.
        values: [harv-area]
        data_type: string
      - name: exposure_unit
        type: unit
        description: Unit of `value`, carried on every row; one per tier.
        values: [ha]
        data_type: string
    variables:
      - name: value
        description: >
          Harvested area exposed to the hazard at that severity, in hectares (integer).
        data_type: float64
        unit: ha
    foreign_keys:
      - fields: [gaul2_code]
        reference:
          resource: https://digital-atlas.s3.amazonaws.com/domain=boundaries/type=admin/source=gaul2024/region=africa/processing=analysis-ready/level=adm2/atlas_gaul24_a2_africa.parquet
          fields: [gaul2_code]

processing:
  - id: source
    description: >
      Monthly agro-climatic hazard indices computed per GCM from NEX-GDDP-CMIP6 (18 GCMs; the sidecar
      on every key records membership), and crop harvested area from MapSPAM2020_AdaptationAtlas_SSA,
      sum-resampled onto the 0.25 degree hazard grid.
    derived_from:
      - title: Monthly hazard indices from NEX-GDDP-CMIP6
        url: https://github.com/AdaptationAtlas/hazards
        version: v0.1.0-nexgddp
      - title: MapSPAM2020_AdaptationAtlas_SSA
        url: https://doi.org/10.7910/DVN/Z0HK7R
        version: "1.0"
      - id: africa-exposure-combined
        title: >-
          Combined crop and livestock exposure, 0.25 degree structure
          (variable=crop-livestock_all_res-25), the gate basis; built from the table as of
          2026-10-08, whose area, production and head-count rows are unchanged in v2026.11
        version: v2026.11
  - id: frequency
    description: >
      Convert hazard indices to the frequency with which each severity threshold is exceeded, per
      scenario, timeframe and admin unit.
  - id: exposure
    description: >
      Cross hazard frequency with crop harvested area, and aggregate onto GAUL 2024 administrative
      units.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/f434359/R/3_freq_x_exposure.R
      version: f434359

data:
  - name: hazard-exposure-ha-by-period-severity
    description: >
      One parquet per period x severity tier, 30 to 42 MB each. Published by scripts/r3_publish_tiers.R;
      every key carries a .json sidecar recording the 18-member ensemble.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=hazard_exposure/source=nex-gddp-cmip6/region=ssa/processing=hazard-risk-exposure/variable=harv-area_ha/
        title: HTTPS
      - url: s3://digital-atlas/domain=hazard_exposure/source=nex-gddp-cmip6/region=ssa/processing=hazard-risk-exposure/variable=harv-area_ha/
        title: S3
    href_template: "period={period}/model=ENSEMBLEmean/severity={severity}/int=multi-hazard.parquet"
    media_type: application/vnd.apache.parquet
    file_size: 37 MB
    processing_steps: [source, frequency, exposure]

additional_links:
  - title: Version history
    rel: version-history
    url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/metadata/cdh/changelogs/africa-hazard-exposure-harvested-area.md
    description: Public changes to these files, dated.

climate:
  mip_era: CMIP6
  scenarios: [historical, ssp126, ssp245, ssp370, ssp585]
  models: [ensemble]

commodities: [crops]

cdh:
  domain: [agricultural-production, climate]
  usage:
    intended_uses:
      - physical exposure of cropland to hazards, independent of price or currency
      - comparing hazard footprints between crops and regions
    not_recommended_for:
      - use: Reading totals below about 10,000 ha as precise.
        reason: >
          Per-pixel integer rounding accumulates: relative error grows as area shrinks (measured up
          to 7 per cent at about 1,500 ha).
        use_instead:
          Treat small-area pairs as indicative; the value tiers carry the same effect in their
          units.
