cdh:
  domain: [hydrology]
  usage:
    intended_uses:
      - Overlaying observed flood extent with population and asset exposure at Kenya admin levels (record kenya-flood-exposure-intersect).
      - Characterising seasonal and ENSO-linked flood occurrence in the KE-ENSO Explorer.
    not_recommended_for:
      - use: Splicing into one continuous flood time series with the pre-2018 Global Flood Database.
        reason: >
          GFD is MODIS optical, event-triggered, 250 m; GFM is Sentinel-1 SAR, continuous, ~20 m.
          A join introduces a methodological break, so apparent post-2018 increases would be artefacts.
        use_instead: Analyse GFM on its own; complement with the JRC modelled return-period hazard (record eastafrica-flood-jrc), not GFD.
      - use: Reading the history frequency as a return-period or design-flood magnitude.
        reason: A ~7-year SAR record captures recent observed occurrence, not rare-event magnitude.
        use_instead: JRC Global Flood Maps (record eastafrica-flood-jrc) for modelled return periods.
