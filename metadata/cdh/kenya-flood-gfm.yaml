# CDH metadata record — Kenya GFM observed flood extent (replaces GFD in KE-ENSO Explorer).
# Standard: CGIAR Climate Data Hub v0.1.0. Validate:
#   uvx check-jsonschema --schemafile spec/schemas/profiles/cdh.schema.json metadata/cdh/kenya-flood-gfm.yaml
# Values confirmed via cglabs GFM access probe (DISPATCH_cglabs_gfm_flood.md #1, 2026-08-28).
cdh_schema_version: v0.1.0

id: kenya-flood-gfm
title: Kenya Observed Flood Extent (Copernicus GFM, Sentinel-1)
description: >
  Observed flood extent for Kenya from the Copernicus Emergency Management Service GloFAS
  Global Flood Monitoring (GFM) product, which classifies flooding from every Sentinel-1 SAR
  acquisition (ensemble of the DLR, TU-Wien and LIST algorithms; permanent/reference water
  excluded). Delivered as four tiers: per-overpass extent (~20 m), a monthly flood-occurrence
  aggregate with a valid-observation count, a rolling 3-month (seasonal) aggregate aligned to
  the KE-ENSO Explorer precipitation seasons, and an optional full-record history (occurrence
  frequency + ever-flooded footprint). Replaces the MODIS Global Flood Database (ended 2018)
  with a cloud-penetrating, continuously updated SAR record (2018 -> present).
resource_type: dataset
license: LicenseRef-Copernicus-EMS   # Copernicus data policy (Reg. EU 1159/2013): free, full & open

keywords: [flood, inundation, Sentinel-1, SAR, Kenya, Copernicus, GloFAS, GFM, flood monitoring]

note: >
  Attribution required: "Contains modified Copernicus Emergency Management Service information
  [year]". Pixel coding 0=not-flooded, 1=flooded, 255=not-observed (SAR gap / excluded) — 255 is
  absence of observation, NOT dry; the nobs layer gives valid-observation count so no-flood is
  distinguishable from no-observation. Record spans ~2018-present (short) = recent observed
  flood-proneness, not return-period magnitude.

contact:
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact]
  - organization: Copernicus Emergency Management Service (CEMS)
    url: https://global-flood.emergency.copernicus.eu/
    roles: [licensor, producer]

citation:
  title: Copernicus GloFAS Global Flood Monitoring (GFM) — Kenya observed flood extent
  authors: [Copernicus Emergency Management Service]
  date: "2026"
  publisher: Copernicus Emergency Management Service (CEMS)
  url: https://global-flood.emergency.copernicus.eu/technical-information/glofas-gfm/

related_publications:
  - doi: 10.3390/rs14153673
  - doi: 10.1109/IGARSS47720.2021.9554214

created: "2026-08-26"
updated: "2026-08-28"

spatial:
  bbox: [33.9, -4.7, 41.9, 5.5]
  crs: EPSG:4326                     # delivered; native tiling = Equi7-AF (Azimuthal Equidistant)
  geography: [kenya]                 # TODO: verify id against vocab/geography.json (UN M49)
  resolution:
    - type: xy
      value: 20
      unit: meter
      label: ~20 m (Sentinel-1 / Equi7-AF native; overpass tier)
    - type: xy
      value: 111
      unit: meter
      label: ~111 m / 0.001 deg (monthly, seasonal, history aggregates)

temporal:
  start_date: "2018-01-01"
  end_date: null                     # open-ended (continuously updated)
  resolution:
    step: P1M
    unit: monthly
    note: >
      Observations are per Sentinel-1 overpass (irregular ~6-12 day revisit); aggregated to
      monthly occurrence, rolling 3-month seasonal windows, and a full-record history.

dimensions:
  - name: time
    type: temporal
    description: >
      Aggregation period. overpass keyed YYYY-MM-DDTHHMMSSZ; monthly YYYY-MM;
      seasonal YYYY-{3-letter window, e.g. MAM}; history has no time token.

variables:
  - name: flooded
    dimensions: [time]
    description: Flood occurrence (permanent/reference water excluded). 0=not-flooded, 1=flooded, 255=not-observed.
    data_type: uint8
    unit: "1"
    note: SAR false positives possible (wind-roughened water, radar shadow, wet soil, urban).
  - name: nobs
    dimensions: [time]
    description: Count of valid observations (overpasses with value in {0,1}) in the aggregation period.
    data_type: uint16
    unit: "1"
  - name: frequency
    description: History tier — flooded-months / observed-months (0-1, observation-density de-biased).
    data_type: float32
    unit: "1"
  - name: footprint
    description: History tier — ever-flooded over the full record (1=flooded at least once).
    data_type: uint8
    unit: "1"

processing:
  - id: source
    description: >
      Copernicus CEMS GFM per-Sentinel-1 acquisition flood classification. Ensemble of DLR/TU-Wien/
      LIST algorithms (pixel flooded when the ensemble agrees); flood = observed water minus reference
      water, so permanent water is excluded.
    derived_from:
      - title: Sentinel-1 SAR (Copernicus)
        url: https://sentinels.copernicus.eu/web/sentinel/missions/sentinel-1
      - title: Copernicus GloFAS Global Flood Monitoring (GFM), EODC STAC collection GFM
        url: https://stac.eodc.eu/api/v1/collections/GFM
  - id: mosaic-clip
    description: Mosaic the Equi7-AF 20 m ensemble_flood_extent tiles per acquisition, reproject to EPSG:4326 (nearest), clip Kenya bbox, write COG with overviews.
    date: "2026-08-28"
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_flood_gfm.py
  - id: aggregate-monthly
    description: Per-pixel monthly flood occurrence (max over valid overpasses) + valid-observation count, at ~111 m.
  - id: aggregate-seasonal
    description: Rolling 3-month occurrence + obs-count over the 12 seasonal windows.
  - id: aggregate-history
    description: Full-record occurrence frequency (flooded-months / observed-months) + ever-flooded footprint.

data:
  - name: overpass
    description: Per-Sentinel-1-acquisition observed flood extent, mosaicked + clipped to Kenya (~20 m).
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=flood/source=glofas-gfm/region=kenya/processing=overpass/variable=flooded/
        title: S3
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    href_template: "{time}.tif"           # time = YYYY-MM-DDTHHMMSSZ
    processing_steps: [source, mosaic-clip]
    nodata: 255
  - name: monthly
    description: Monthly flood occurrence + valid-observation count (~111 m).
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=flood/source=glofas-gfm/region=kenya/processing=monthly/
        title: S3
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    href_template: "variable={variable}/{variable}-{time}.tif"   # PTOT-aligned, e.g. variable=flooded/flooded-2020-04.tif; time = YYYY-MM
    processing_steps: [source, mosaic-clip, aggregate-monthly]
  - name: seasonal
    description: Rolling 3-month (seasonal) flood occurrence + obs-count for the notebook (~111 m).
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=flood/source=glofas-gfm/region=kenya/processing=seasonal/
        title: S3
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    href_template: "variable={variable}/season={season}/{variable}_{season}_{year}.tif"   # PTOT-aligned, e.g. variable=flooded/season=MAM/flooded_MAM_2020.tif
    processing_steps: [source, mosaic-clip, aggregate-monthly, aggregate-seasonal]
  - name: history
    description: Optional full-record roll-up — occurrence frequency + ever-flooded footprint (~111 m).
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=flood/source=glofas-gfm/region=kenya/processing=history/
        title: S3
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    href_template: "variable={variable}/{variable}.tif"   # variable in {frequency,footprint}
    processing_steps: [source, mosaic-clip, aggregate-monthly, aggregate-history]

cdh:
  domain: [hydrology]
  usage:
    intended_uses:
      - Overlaying observed flood extent with population and asset exposure at Kenya admin levels.
      - Characterising seasonal / ENSO-linked flood occurrence for the KE-ENSO Explorer.
    not_recommended_for:
      - use: Splicing into one continuous flood time series with the pre-2018 Global Flood Database.
        reason: >
          GFD is MODIS optical event-triggered at 250 m; GFM is Sentinel-1 SAR continuous at ~20 m.
          A join introduces a methodological break — apparent post-2018 increases would be artefacts.
        use_instead: Analyse GFM on its own; complement with JRC modelled return-period hazard, not GFD.
      - use: Reading the history frequency as a return-period / design-flood magnitude.
        reason: ~7-year SAR record captures recent observed occurrence, not rare-event magnitude.
        use_instead: JRC Global Flood Maps (modelled return periods).
  series: KE-ENSO Explorer exposure layers
