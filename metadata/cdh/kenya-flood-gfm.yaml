        title: S3
    href_template: "nobs-{time}.tif" # e.g. nobs-2020-04.tif
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    processing_steps: [source, mosaic-clip, aggregate-monthly]
  - name: seasonal-flooded
    description: Rolling 3-month flood occurrence, one COG per season x year.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=flood/source=glofas-gfm/region=kenya/processing=seasonal/variable=flooded/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=flood/source=glofas-gfm/region=kenya/processing=seasonal/variable=flooded/
        title: S3
    href_template: "season={season}/flooded_{season}_{year}.tif" # e.g. season=MAM/flooded_MAM_2020.tif
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
