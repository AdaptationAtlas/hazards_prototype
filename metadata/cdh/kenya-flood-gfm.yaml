        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=flood/source=glofas-gfm/region=kenya/processing=seasonal/variable=nobs/
        title: S3
    href_template: "season={season}/nobs_{season}_{year}.tif" # e.g. season=MAM/nobs_MAM_2020.tif
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
