id: kenya-flood-gfm
title: Kenya Observed Flood Extent (Copernicus GFM, Sentinel-1)
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Observed flood extent for Kenya from the Copernicus Emergency Management Service Global Flood
  Monitoring (GFM) product, which classifies flooding from every Sentinel-1 SAR acquisition
  (ensemble of the DLR, TU Wien and LIST algorithms; permanent and reference water excluded).
  Delivered as ~111 m aggregates built directly from the 20 m SAR tiles: a monthly flood-occurrence
  layer with its valid-observation count, a rolling 3-month (seasonal) layer aligned to the KE-ENSO
  Explorer precipitation seasons, and a full-record history (occurrence frequency and ever-flooded
  footprint), 2018 to present. Replaces the MODIS Global Flood Database (ended 2018) with a
  cloud-penetrating, continuously updated SAR record. The 20 m per-acquisition archive is not
  materialised here (16,000+ acquisitions); it can be re-pulled from the EODC STAC on demand.
resource_type: dataset
license: LicenseRef-Copernicus-EMS # Copernicus data policy (Commission Delegated Regulation (EU) No 1159/2013): free, full and open; attribution required

keywords:
  [
    flood,
    inundation,
    Sentinel-1,
    SAR,
    Kenya,
    Copernicus,
    GloFAS,
    GFM,
    flood monitoring,
    observed,
  ]

note: >
  Attribution required: "Contains modified Copernicus Emergency Management Service information
  [year]". Pixel coding of the flooded layers: 0 = not flooded, 1 = flooded, 255 = not observed
  (SAR gap or excluded) - 255 is absence of observation, NOT dry; the nobs layer gives the count of
  valid observations so no-flood is distinguishable from no-observation. Seasonal windows are named
  by the initials of their months and labelled by the year of their FIRST month (DJF_2018 = Dec 2018
  to Feb 2019), so NDJ and DJF exist for 2018 to 2024 only. This differs from the CHIRPS seasonal
  record (africa-precipitation-monthly-seasonal), which labels NDJ and DJF by the year the window
  ends; align on those two windows with care. A ~7-year record
  measures recent observed flood occurrence, not return-period magnitude.

