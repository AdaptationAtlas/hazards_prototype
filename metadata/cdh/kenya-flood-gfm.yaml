variables:
  - name: flooded
    description: Flood occurrence in the aggregation period (permanent and reference water excluded). 0 = not flooded, 1 = flooded, 255 = not observed.
    data_type: uint8
    unit: "1"
    nodata: 255
    note: SAR false positives are possible (wind-roughened water, radar shadow, wet soil, dense urban fabric).
  - name: nobs
    description: Count of valid Sentinel-1 observations (value 0 or 1) in the aggregation period.
    data_type: uint16
    unit: "1"
  - name: frequency
    description: Full-record flood frequency, flooded months divided by observed months (0 to 1), so observation density does not bias it.
    data_type: float32
    unit: "1"
  - name: footprint
    description: Ever-flooded footprint over the full record (1 = flooded in at least one month).
    data_type: uint8
    unit: "1"

processing:
  - id: source
    description: >
      Copernicus CEMS GFM per-Sentinel-1-acquisition flood classification: ensemble of the DLR, TU
      Wien and LIST algorithms (a pixel is flooded when the ensemble agrees); flood = observed water
      minus reference water, so permanent water is excluded.
    derived_from:
      - title: Copernicus Global Flood Monitoring (GFM), EODC STAC collection
        url: https://stac.eodc.eu/api/v1/collections/GFM
      - title: Sentinel-1 SAR (Copernicus)
        url: https://sentinels.copernicus.eu/web/sentinel/missions/sentinel-1
  - id: mosaic-clip
    description: >
      Mosaic the Equi7-AF 20 m ensemble flood-extent tiles per acquisition and warp onto the fixed
      0.001 deg EPSG:4326 Kenya grid (full-resolution read, max resampling, NoData-aware).
    date: "2026-08-28"
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_flood_gfm.py
  - id: aggregate-monthly
    description: Per-pixel monthly flood occurrence (max over the month's acquisitions) and valid-observation count.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_flood_gfm.py
  - id: aggregate-seasonal
    description: Rolling 3-month occurrence and observation count over the twelve seasonal windows.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_flood_gfm.py
  - id: aggregate-history
    description: Full-record occurrence frequency (flooded months / observed months) and ever-flooded footprint.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_flood_gfm.py

data:
  - name: monthly-flooded
    description: Monthly flood occurrence, one COG per month.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=flood/source=glofas-gfm/region=kenya/processing=monthly/variable=flooded/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=flood/source=glofas-gfm/region=kenya/processing=monthly/variable=flooded/
        title: S3
    href_template: "flooded-{time}.tif" # e.g. flooded-2020-04.tif
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    nodata: 255
    processing_steps: [source, mosaic-clip, aggregate-monthly]
  - name: monthly-nobs
    description: Monthly valid-observation count, one COG per month.
    locations:
