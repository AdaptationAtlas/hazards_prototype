# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Constant-international-dollar hazard exposure, first published 2026-10-19 by the issue-13 full
# rebake. Verification chain: G6b (product vs the exposure input it was built from, admin2 basis),
# B6 (product vs the independent canonical reference, median ratio 1.000000), and 60/60 published
# keys MD5-verified. Source dispatch: archive/dispatches/DISPATCH_cglabs_issue13_rebake.md.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/climate/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json

id: africa-hazard-exposure-intld
title: Hazard Frequency crossed with Crop and Livestock Value of Production (constant 2014-2016 international dollars), Sub-Saharan Africa
version: v2026.11
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  The constant-dollar companion of the Atlas hazard-exposure product: hazard frequency crossed with
  the value of crop and livestock production in constant 2014-2016 international dollars (FAOSTAT
  GPV, 2019-2023 window, labelled intld15-2021), by administrative unit, commodity, hazard,
  scenario, period and timeframe. Unlike the nominal-USD tier this basis is deflated, so changes
  between timeframes are real-terms. First published 2026-10-19; supersedes the retired legacy
  source=atlas_cmip6 vop_intld15 route, whose objects predate every 2026 correction.
resource_type: dataset
license: CC-BY-4.0 # derived product; principal inputs (MapSPAM2020_AdaptationAtlas_SSA doi:10.7910/DVN/Z0HK7R, GLW4-2020, GAUL 2024) are all CC-BY-4.0; share-alike does NOT apply (hazards_prototype issue 37, resolved 2026-10-08)
keywords:
  [
    hazard exposure,
    value of production,
    constant international dollars,
    climate risk,
    CMIP6,
    NEX-GDDP,
    sub-saharan africa,
  ]

note: >
  THE BASIS MOVED +20 PER CENT ON 2026-10-08, DELIBERATELY, BEFORE THIS TIER WAS FIRST PUBLISHED.
  The exposure this tier is built from was republished with FAOSTAT joins keyed on item code rather
  than item name: 55.12 billion international dollars over 57 FAOSTAT-renamed item codes had been
  silently dropped, and the continental constant-dollar reference moved 200.28 to 240.24 billion
  (hazards_prototype B5 dispatch, archived). Two FAOSTAT quantity pins apply (CAF and GIN coffee, a
  reporting break; metadata/fao_quantity_pins.csv). WHAT THIS TIER CAN AND CANNOT SUM TO. The tier
  total is about 266.8 billion international dollars: the reference's 240.24 billion crop side,
  MINUS 62.42 billion in nine SPAM composite groups (vegetables, tropical fruit, rest-of-crops, other
  roots and six more) that carry exposure but have no hazard frequency and therefore NO rows here,
  PLUS about 89.0 billion of livestock. Do not expect this tier to reconcile to the reference
  headline: about 19 per cent of the recovered constant-dollar exposure is in composite groups the
  hazard layer cannot see. One named residual: Tanzania coconut undershoots its exposure by 2.4 per
  cent because Wete district (Pemba Island) carries exposure and no hazard coverage at 0.25 degrees
  (hazards_prototype issue 50; metadata/g6b_expected_residuals.csv). Every other material (country,
  crop) pair reproduces its exposure within the publish gate's bounds. FOUR LIVESTOCK ROWS USE
  PLACEHOLDER CONSTANT-DOLLAR PRICES: Libya and Sierra Leone cattle, Lesotho poultry and Eswatini
  sheep (hazards_prototype issue 54). A correction that raises the livestock constant-dollar total by
  0.1 per cent has been validated but not yet published.
  VERSION HISTORY. This is the first Climate Data Hub release (v2026.11): the files as first
  published on 2026-10-19, unchanged since, built from the exposure table as of 2026-10-08. The
  version history linked below records this and will list later changes.

contact:
  - organization: Alliance of Bioversity International and CIAT
    url: https://alliancebioversityciat.org/
    roles: [licensor, producer]
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact, maintainer]

citation:
  title: Africa Agriculture Adaptation Atlas hazard-exposure product (constant international dollars)
  authors:
    - organization: Alliance of Bioversity International and CIAT
  date: "2026"
  publisher: Alliance of Bioversity International and CIAT
  url: https://adaptationatlas.cgiar.org/

created: "2026-10-19"
updated: "2026-11-13"

spatial:
  bbox: [-26.0, -35.0, 58.0, 28.0] # Sub-Saharan Africa, 55 countries present
  crs: EPSG:4326
  geography: [sub-saharan-africa]
  # No horizontal axes: the table's reporting unit is the gaul2_code location dimension.

temporal:
  start_date: "1995"
  end_date: "2100"

structures:
  - name: hazard-exposure
    dimensions:
      - name: period
        type: season
        description: >
          Hazard aggregation window. jagermeyr = the Jagermeyr et al. crop-calendar growing season;
          annual = the full calendar year. One key prefix per period; both published since
          2026-10-19.
        values: [jagermeyr, annual]
      - name: severity
        type: severity
        description: Hazard severity tier. One file per period x tier.
        values: [moderate, severe, extreme]
      - name: scenario
        type: scenario
        description: Emissions pathway; historic is the CMIP6 historical run.
        values: [historic, ssp126, ssp245, ssp370, ssp585]
      - name: timeframe
        type: temporal
        description: >
          Twenty-year window, labelled here by its first year; the column stores the window as text
          (1995-2014, 2021-2040, 2041-2060, 2061-2080, 2081-2100). 1995-2014 is the historical
          baseline.
        values: ["1995", "2021", "2041", "2061", "2081"]
      - name: crop
        type: commodity
        description: >
          Commodity - 33 crops, 10 livestock species-systems and generic-crop (44 present). The nine
          SPAM composite groups are absent by construction (no hazard frequency exists for an
          aggregate).
      - name: hazard
        type: hazard
        description: >
          Agro-climatic hazard, plus the multi-hazard interaction sets. Since 2026-10 the published
          hazard_vars sets are NDWS+NTx35+NDWL0 (generic crop heat, water-balance framing),
          NDWS+NTxM+NDWL0 (crop-specific heat, water-balance framing; NEW), PTOT-L+NTxM+PTOT-G
          (crop-specific heat, precipitation framing; RENAMED from PTOT-L+NTxS+PTOT-G, issue 25), and
          the two livestock THI sets. hazard='any'/'none' rows are present per set, and any+none per
          (unit, crop) equals the exposure the tier was built from.
      - name: gaul2_code
        type: location
        description: >
          Second-level administrative unit, as the GAUL 2024 code and the join key to the boundaries
          (record africa-admin-boundaries-gaul2024). Rows also carry iso3, admin0_name, admin1_name,
          admin2_name and the adm0 and adm1 GAUL codes. 55 countries present.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
    variables:
      - name: value
        description: >
          Value of production exposed to the hazard at that severity, in constant 2014-2016
          international dollars (label intld15-2021). Read exposure_var and exposure_unit on each row
          rather than assuming the basis.
        data_type: float64
        unit: "{intld15-2021}"
    foreign_keys:
      - fields: [gaul2_code]
        reference:
          resource: https://digital-atlas.s3.amazonaws.com/domain=boundaries/type=admin/source=gaul2024/region=africa/processing=analysis-ready/level=adm2/atlas_gaul24_a2_africa.parquet
          fields: [gaul2_code]

processing:
  - id: source
    description: >
      Monthly agro-climatic hazard indices computed per GCM from NEX-GDDP-CMIP6 (18 GCMs; the sidecar
      on every key records membership), and crop and livestock value of production in constant
      international dollars distributed from FAOSTAT GPV across MapSPAM production and GLW4-2020
      density shares.
    derived_from:
      - title: Monthly hazard indices from NEX-GDDP-CMIP6 (record nexgddp-indices-monthly)
        url: https://github.com/AdaptationAtlas/hazards
      - title: MapSPAM2020_AdaptationAtlas_SSA (record mapspam2020-adaptation-atlas-ssa)
        url: https://doi.org/10.7910/DVN/Z0HK7R
      - id: africa-exposure-combined
        title: >-
          Combined crop and livestock exposure, 0.25 degree structure
          (variable=crop-livestock_all_res-25), the gate basis; built from the table as of
          2026-10-08, before the first Hub release
  - id: frequency
    description: >
      Convert hazard indices to the frequency with which each severity threshold is exceeded, per
      scenario, timeframe and admin unit.
  - id: exposure
    description: >
      Cross hazard frequency with crop and livestock constant-dollar value of production, and
      aggregate onto GAUL 2024 administrative units.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/R/3_freq_x_exposure.R

data:
  - name: hazard-exposure-intld-by-period-severity
    description: >
      One parquet per period x severity tier, 76 to 86 MB each. Published by
      scripts/r3_publish_tiers.R behind gates G1-G6b; every key carries a .json sidecar recording
      the 18-member ensemble.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=hazard_exposure/source=nex-gddp-cmip6/region=ssa/processing=hazard-risk-exposure/variable=vop_intld15-21/
        title: HTTPS
      - url: s3://digital-atlas/domain=hazard_exposure/source=nex-gddp-cmip6/region=ssa/processing=hazard-risk-exposure/variable=vop_intld15-21/
        title: S3
    href_template: "period={period}/model=ENSEMBLEmean/severity={severity}/int=multi-hazard.parquet"
    media_type: application/vnd.apache.parquet
    file_size: 81 MB
    processing_steps: [source, frequency, exposure]

additional_links:
  - title: Version history
    rel: version-history
    url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/metadata/cdh/changelogs/africa-hazard-exposure-intld.md
    description: Public changes to these files, dated; lists the known correction still to come.

climate:
  mip_era: CMIP6
  scenarios: [historical, ssp126, ssp245, ssp370, ssp585]
  models: [ensemble]

commodities: [crops, cattle, goats, sheep, swine-pigs, chickens]

cdh:
  domain: [agricultural-production, climate]
  usage:
    intended_uses:
      - Real-terms comparison of exposed production value between scenarios and timeframes.
      - Crop and livestock exposure on one deflated basis, jointly.
    not_recommended_for:
      - use: Reconciling this tier's total to the published exposure reference headline.
        reason: >
          The reference's constant-dollar crop side is 240.24 billion; this tier reads about 266.8
          billion because it adds livestock and cannot carry the nine composite crop groups (62.42
          billion of exposure with no hazard rows).
        use_instead: Compare modelled crops only (about 177.8 billion) against the reference filtered to the same crop set, or use the gate outputs in the source dispatch.
      - use: Mixing with the nominal-USD tier without converting.
        reason: >
          Different currency basis; the two sit under one exposure value in the reference, separated
          only by unit.
        use_instead: Filter unit explicitly on both sides (hazards_prototype issue 52).
      - use: Reading Libya or Sierra Leone cattle value from this tier.
        reason: >
          FAOSTAT's constant-dollar gross production value for indigenous cattle meat is about 1,000
          international dollars for both countries (expected tens of millions), so cattle meat is
          effectively absent and their cattle rows carry milk only (hazards_prototype issue 54; the
          correction, which also covers Lesotho poultry and Eswatini sheep, is validated but not yet
          published).
        use_instead: Use the head-count tier or the nominal-USD tier for cattle in these two countries until issue 54 resolves.
