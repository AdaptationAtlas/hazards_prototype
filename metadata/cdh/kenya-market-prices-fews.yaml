cdh:
  domain: [socioeconomic]
  usage:
    intended_uses:
      - Showing how staple and livestock prices moved through past ENSO-linked seasons in the Kenya ENSO Explorer.
      - Deriving a pastoral terms-of-trade ratio as a proxy for purchasing power in pastoral counties.
    not_recommended_for:
      - use: Republishing the price series as an Atlas data product.
        reason: >
          FEWS NET warns that third-party series inside the warehouse may not be redistributed
          without the original provider's consent, and market prices are commonly collected by
          national agencies rather than by FEWS NET.
        use_instead: Read for analysis, publish derived indicators, and identify the originating agency before redistributing any series.
      - use: Comparing prices across years without deflating.
        reason: Values are nominal Kenyan shillings over a 26-year span.
        use_instead: Apply a deflator, or compare a ratio such as terms of trade, which is unit-free.
      - use: Reading a missing market-month as a zero or a low price.
        reason: Coverage is uneven - 42 of 47 counties, and products are not quoted in every market every month.
        use_instead: Treat gaps as unreported and check per-market coverage before mapping or ranking.
