id: kenya-market-prices-fews
title: Kenya Retail and Wholesale Market Prices (FEWS NET Data Warehouse)
description: >
  Staple and livestock market prices for Kenya from the FEWS NET Data Warehouse market price facts:
  42 counties by market by product, 12 products, retail and wholesale, in Kenyan shillings, 2000 to
  2026. Pulled through the FDW API. The price basis behind the Kenya ENSO Explorer's market panel and
  behind the pastoral terms of trade shown there, which the Atlas derives rather than reads.
resource_type: dataset
license: LicenseRef-FEWSNET-Data-Use-Policy # no SPDX id fits: FEWS NET publishes data as a public service under USAID's open-data policy (ADS 579) with attribution required, and some series are third-party and carry their own terms. See the licence note.
keywords:
  [
    market prices,
    retail prices,
    wholesale prices,
    terms of trade,
    staple foods,
    livestock,
    fews net,
    kenya,
  ]

note: >
  LICENCE IS A POLICY, NOT A CREATIVE COMMONS GRANT. FEWS NET provides data as a public service,
  managed under USAID's policy on sharing Agency-funded data (ADS 579). Attribution is required, in
  the manner indicated in the metadata accompanying the data, prominently on any visual that uses it,
  with a link to the FEWS NET website, and without claiming or implying that FEWS NET endorses the
  use. FEWS NET disclaims liability and makes no guarantee of accuracy or completeness.
  THE CLAUSE THAT MATTERS FOR REDISTRIBUTION. FEWS NET states that "some data are provided by third
  parties, and may not be redistributed or reused without the consent of the original data provider,
  or may be subject to additional terms and conditions", and instructs users to check the primary
  source's own policy. Market price series are commonly collected by national agencies rather than by
  FEWS NET itself, so this clause is live for this dataset: reading the prices for analysis is
  unencumbered, republishing the series as an Atlas data product needs the originating agency
  identified first. Nothing derived from this is published by the Atlas today.
  TERMS OF TRADE IS OURS, NOT THEIRS. The pastoral terms of trade shown in the Explorer is computed
  here as goat price divided by maize price. It is not an NDMA figure and it is not published by
  FEWS NET in that form. It is a ratio, so it moves with either leg - a fall can mean cheaper
  livestock or dearer grain, which have opposite implications - and it should never be read as a
  price index.
  NOT NDMA. Kenya's National Drought Management Authority publishes drought early warning bulletins
  carrying market prices and terms of trade, and an earlier version of the Atlas metadata wrongly
  named them as a source. No NDMA bulletin is fetched, parsed or mirrored anywhere. The NDMA
  bulletins remain a candidate source, held as a local draft record.
  COVERAGE IS UNEVEN. 42 of 47 counties appear, markets within a county vary, and a product is not
  quoted in every market in every month. Absence is a gap in market reporting, not a zero price.

