temporal:
  start_date: "2000"
  end_date: null

dimensions:
  - name: month
    type: temporal
    description: Month of the price observation.
    step: P1M
  - name: market
    type: location
    description: Reporting market, nested within a county. Markets present vary by county and by period.
  - name: product
    type: product
    description: Traded commodity, 12 in total, covering staple cereals, pulses and livestock.
  - name: price_type
    type: price-type
    description: Whether the quote is retail or wholesale.
    values: [retail, wholesale]

variables:
  - name: price
    dimensions: [month, market, product, price_type]
    description: >
      Observed market price in Kenyan shillings. Nominal, not deflated - any multi-year comparison
      needs a deflator applied first.
    data_type: float64
    unit: KES

