# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Production-tonnes hazard exposure (issues 13 and 41), first published 2026-10-19 by the issue-13
# full rebake. Verification chain: G6b (product vs the exposure input it was built from, admin2
# basis), B6 (product vs the independent canonical reference, median ratio 1.000000), and 60/60
# published keys MD5-verified. Source dispatch: archive/dispatches/DISPATCH_cglabs_issue13_rebake.md.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/climate/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json

id: africa-hazard-exposure-production
title: Hazard Frequency crossed with Crop Production, Sub-Saharan Africa
version: v2026.11
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Hazard frequency crossed with crop production in tonnes (MapSPAM2020_AdaptationAtlas_SSA), by
  administrative unit, crop, hazard, scenario, period and timeframe. The physical tier that lets
  money be applied AFTER aggregation (issue 41): prices are national and the exposure pipeline is
  linear, so exposed tonnes times a national price equals the value tiers - meaning a future price
  revision is a table join against this tier rather than a full pipeline re-run. A matching
  constant-dollar price-factor raster (fao_prices/crop_factor_intld15-2021-t_res-05.tif, reproducing
  the value allocation cell-for-cell) is produced alongside the exposure inputs. First published
  2026-10-19.
resource_type: dataset
license: CC-BY-4.0 # derived product; principal inputs (MapSPAM2020_AdaptationAtlas_SSA doi:10.7910/DVN/Z0HK7R, GLW4-2020, GAUL 2024) are all CC-BY-4.0; share-alike does NOT apply (hazards_prototype issue 37, resolved 2026-10-08)
keywords:
  [
    hazard exposure,
    crop production,
    tonnes,
    physical exposure,
    climate risk,
    CMIP6,
    NEX-GDDP,
    sub-saharan africa,
  ]

note: >
  CROPS ONLY: the livestock physical tier is head counts (record
  africa-hazard-exposure-livestock-numbers). Values are INTEGER TONNES, rounded per pixel before
  zonal aggregation; totals under about 10,000 t carry relative rounding error up to a few per cent,
  and the publish gate's materiality floor is 10,000 t for this reason. The nine SPAM composite
  groups carry production in the exposure reference but have no hazard rows here, as in the
  constant-dollar tier. One named residual: Tanzania coconut undershoots its exposure by 2.4 per
  cent because Wete district (Pemba Island) carries exposure and no hazard coverage at 0.25 degrees
  (hazards_prototype issue 50; metadata/g6b_expected_residuals.csv). Every other material (country,
  crop) pair reproduces its exposure within the publish gate's bounds.
  VERSION HISTORY. This is the first Climate Data Hub release (v2026.11): the files as first
  published on 2026-10-19, unchanged since. The version history linked below records this and will
  list later changes.

contact:
  - organization: Alliance of Bioversity International and CIAT
    url: https://alliancebioversityciat.org/
    roles: [licensor, producer]
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact, maintainer]

citation:
  title: Africa Agriculture Adaptation Atlas hazard-exposure product (production tonnes)
  authors:
    - organization: Alliance of Bioversity International and CIAT
  date: "2026"
  publisher: Alliance of Bioversity International and CIAT
  url: https://adaptationatlas.cgiar.org/

created: "2026-10-19"
updated: "2026-11-13"

spatial:
  bbox: [-26.0, -35.0, 58.0, 28.0] # Sub-Saharan Africa, 55 countries present
  crs: EPSG:4326
  geography: [sub-saharan-africa]
  # No horizontal axes: the table's reporting unit is the gaul2_code location dimension.

temporal:
  start_date: "1995"
  end_date: "2100"

structures:
  - name: hazard-exposure
    dimensions:
      - name: period
        type: season
        description: >
          Hazard aggregation window. jagermeyr = the Jagermeyr et al. crop-calendar growing season;
          annual = the full calendar year. One key prefix per period; both published since
          2026-10-19.
        values: [jagermeyr, annual]
      - name: severity
        type: severity
        description: Hazard severity tier. One file per period x tier.
        values: [moderate, severe, extreme]
      - name: scenario
        type: scenario
        description: Emissions pathway; historic is the CMIP6 historical run.
        values: [historic, ssp126, ssp245, ssp370, ssp585]
      - name: timeframe
        type: temporal
        description: >
          Twenty-year window, labelled here by its first year; the column stores the window as text
          (1995-2014, 2021-2040, 2041-2060, 2061-2080, 2081-2100). 1995-2014 is the historical
          baseline.
        values: ["1995", "2021", "2041", "2061", "2081"]
      - name: crop
        type: commodity
        description: >
          Crop, 34 present (33 crops + generic-crop). Livestock and the nine SPAM composite groups
          absent by construction.
      - name: hazard
        type: hazard
        description: >
          Agro-climatic hazard, plus the multi-hazard interaction sets. Since 2026-10 the published
          hazard_vars sets are NDWS+NTx35+NDWL0 (generic crop heat, water-balance framing),
          NDWS+NTxM+NDWL0 (crop-specific heat, water-balance framing; NEW), PTOT-L+NTxM+PTOT-G
          (crop-specific heat, precipitation framing; RENAMED from PTOT-L+NTxS+PTOT-G, issue 25), and
          the two livestock THI sets. hazard='any'/'none' rows are present per set, and any+none per
          (unit, crop) equals the exposure the tier was built from.
      - name: gaul2_code
        type: location
        description: >
          Second-level administrative unit, as the GAUL 2024 code and the join key to the boundaries
          (record africa-admin-boundaries-gaul2024). Rows also carry iso3, admin0_name, admin1_name,
          admin2_name and the adm0 and adm1 GAUL codes. 55 countries present.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
    variables:
      - name: value
        description: >
          Production exposed to the hazard at that severity, in tonnes (integer).
        data_type: float64
        unit: t
    foreign_keys:
      - fields: [gaul2_code]
        reference:
          resource: https://digital-atlas.s3.amazonaws.com/domain=boundaries/type=admin/source=gaul2024/region=africa/processing=analysis-ready/level=adm2/atlas_gaul24_a2_africa.parquet
          fields: [gaul2_code]

processing:
  - id: source
    description: >
      Monthly agro-climatic hazard indices computed per GCM from NEX-GDDP-CMIP6 (18 GCMs; the sidecar
      on every key records membership), and crop production in tonnes from
      MapSPAM2020_AdaptationAtlas_SSA (spam_prod_t_all), sum-resampled onto the 0.25 degree hazard
      grid.
    derived_from:
      - title: Monthly hazard indices from NEX-GDDP-CMIP6 (record nexgddp-indices-monthly)
        url: https://github.com/AdaptationAtlas/hazards
      - title: MapSPAM2020_AdaptationAtlas_SSA (record mapspam2020-adaptation-atlas-ssa)
        url: https://doi.org/10.7910/DVN/Z0HK7R
      - id: africa-exposure-combined
        title: >-
          Combined crop and livestock exposure, 0.25 degree structure
          (variable=crop-livestock_all_res-25), the gate basis; built from the table as of
          2026-10-08, before the first Hub release
  - id: frequency
    description: >
      Convert hazard indices to the frequency with which each severity threshold is exceeded, per
      scenario, timeframe and admin unit.
  - id: exposure
    description: >
      Cross hazard frequency with crop production tonnage, and aggregate onto GAUL 2024
      administrative units.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/R/3_freq_x_exposure.R

data:
  - name: hazard-exposure-prod-by-period-severity
    description: >
      One parquet per period x severity tier, 33 to 47 MB each. Published by
      scripts/r3_publish_tiers.R behind gates G1-G6b; every key carries a .json sidecar recording
      the 18-member ensemble.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=hazard_exposure/source=nex-gddp-cmip6/region=ssa/processing=hazard-risk-exposure/variable=prod_t/
        title: HTTPS
      - url: s3://digital-atlas/domain=hazard_exposure/source=nex-gddp-cmip6/region=ssa/processing=hazard-risk-exposure/variable=prod_t/
        title: S3
    href_template: "period={period}/model=ENSEMBLEmean/severity={severity}/int=multi-hazard.parquet"
    media_type: application/vnd.apache.parquet
    file_size: 42 MB
    processing_steps: [source, frequency, exposure]

additional_links:
  - title: Version history
    rel: version-history
    url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/metadata/cdh/changelogs/africa-hazard-exposure-production.md
    description: Public changes to these files, dated.

climate:
  mip_era: CMIP6
  scenarios: [historical, ssp126, ssp245, ssp370, ssp585]
  models: [ensemble]

commodities: [crops]

cdh:
  domain: [agricultural-production, climate]
  usage:
    intended_uses:
      - Applying any price table to hazard-exposed production after aggregation, instead of re-running the pipeline per price decision.
      - Physical exposure of production to hazards, free of currency basis questions.
    not_recommended_for:
      - use: Multiplying by a sub-national price surface at the published resolution.
        reason: >
          Pricing must happen on the fine (0.05 degree) grid or per admin unit: a 0.25 degree border
          cell carries both countries' production but takes one country's price.
        use_instead: Use national prices per (iso3, crop), or the 0.05 degree factor raster upstream.
