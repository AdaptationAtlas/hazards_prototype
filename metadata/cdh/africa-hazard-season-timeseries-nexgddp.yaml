climate:
  mip_era: CMIP6
  scenarios: [historical, ssp126, ssp245, ssp370, ssp585]
  models:
    - ensemble
    - ACCESS-CM2
    - ACCESS-ESM1-5
    - CanESM5
    - CMCC-ESM2
    - EC-Earth3
    - EC-Earth3-Veg-LR
    - GFDL-ESM4
    - INM-CM4-8
    - INM-CM5-0
    - IPSL-CM6A-LR
    - KACE-1-0-G
    - MIROC6
    - MPI-ESM1-2-HR
    - MPI-ESM1-2-LR
    - MRI-ESM2-0
    - NorESM2-LM
    - NorESM2-MM
    - TaiESM1
  baseline:
    start_date: "1995-01-01"
    end_date: "2014-12-31"
  bias_adjustment:
    method: BCSD
    reference_dataset: GMFD
  downscaling:
    method: statistical
    resolution: 0.25

cdh:
  domain: [climate]
  usage:
    intended_uses:
      - Charting how a seasonal hazard is projected to change in a country or province, year by year.
      - Comparing emissions scenarios and showing model disagreement with the 17th-83rd percentile band.
      - Seasonal climate context for adaptation planning in agriculture.
    not_recommended_for:
      - use: Reading a single future year as a forecast for that year.
        reason: >
          Climate models do not reproduce the timing of individual wet or dry years. A future year is
          one plausible year from that climate, not a prediction.
        use_instead: Average over the 20-year window, or use the trends record africa-hazard-season-trends-nexgddp.
      - use: Comparing against observations averaged over 1991-2020.
        reason: The model historical runs end in 2014, so no 1991-2020 baseline can be built from them.
        use_instead: Use the 1995-2014 or 1981-2014 baseline and state it.
      - use: Point or field-scale analysis.
        reason: Values are averages over administrative units of a 0.25° (about 28 km) model grid.
