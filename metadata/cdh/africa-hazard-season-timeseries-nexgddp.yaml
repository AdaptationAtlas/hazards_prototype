# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# Year-by-year seasonal climate-hazard values for Africa, averaged over administrative units and
# summarised across an 18-model NEX-GDDP-CMIP6 ensemble (Adaptation Atlas).
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/climate/schema.json

id: africa-hazard-season-timeseries-nexgddp
title: Seasonal Climate Hazard Time Series by Administrative Unit, Africa (NEX-GDDP-CMIP6 18-model ensemble)
version: v2026.11
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Year-by-year values of nine agro-climatic hazard indices (rainfall, temperature, heat-stress days,
  dry days, soil water stress, waterlogging, and human and livestock heat stress) for every country
  and first-level administrative unit in Africa, for each rolling three-month season and for the
  whole year. Each row summarises 18 bias-corrected, downscaled climate models from NASA's
  NEX-GDDP-CMIP6: the ensemble mean, the spread between models (standard deviation and 17th-83rd
  percentile range, the IPCC "likely" range), and the same statistics for the anomaly from a
  historical baseline average. Historical years (1981-2014) come from the models' historical runs;
  future years cover 2021-2100 under four emissions scenarios. Use it to chart how a hazard is
  projected to evolve in a region and season, and how much the models disagree.
resource_type: dataset
license: CC-BY-4.0 # Atlas-derived aggregate; NEX-GDDP-CMIP6 input is openly licensed
attribution: >
  Climate scenarios used were from the NEX-GDDP-CMIP6 dataset, prepared by the Climate Analytics
  Group and NASA Ames Research Center using the NASA Earth Exchange, and distributed by the NASA
  Center for Climate Simulation (NCCS).
keywords:
  - climate hazards
  - agro-climatic indices
  - seasonal time series
  - climate projections
  - multi-model ensemble
  - anomaly
  - NEX-GDDP
  - heat stress
  - drought
  - waterlogging
  - administrative units

note: >
  Country-level rows (admin1_name empty) are not usable for Egypt, Kenya, Sudan and South Sudan, the
  four countries that claim disputed border areas: each holds a single malformed year instead of a
  series. Use their first-level units. Read the files with hive partitioning turned off (in DuckDB,
  hive_partitioning = false): the storage path contains timeframe=3months, which otherwise replaces
  the timeframe column. The human heat-stress index (HSH-max) will be recalculated in a later
  version; the correction raises it by about 7 °C. Changes to these files before and since this
  first Hub version are listed in the linked version history.

