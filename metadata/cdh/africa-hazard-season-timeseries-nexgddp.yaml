created: "2026-11-13"
updated: "2026-11-13"

spatial:
  bbox: [-25.5, -47.0, 63.6, 37.6] # Africa including island states, 55 countries
  crs: EPSG:4326
  geography: [africa]
  # No horizontal axes: the table's reporting unit is the admin1_name location dimension.

temporal:
  start_date: "1981"
  end_date: "2100"

structures:
  - name: season-timeseries
    dimensions:
      - name: iso3
        type: location
        description: ISO 3166-1 alpha-3 country code. 55 countries. Files are sorted on it.
        data_type: string
      - name: admin0_name
        type: location
        description: Country name, as in FAO GAUL 2024.
        data_type: string
      - name: admin1_name
        type: location
        description: >
          First-level administrative unit name (province, region, county), as in FAO GAUL 2024; the
          boundaries are catalogued as africa-admin-boundaries-gaul2024. Empty (null) on the
          country-level rows. Values are the average over the 0.25° model grid cells that touch the
          unit.
        data_type: string
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
      - &scenario
        name: scenario
        type: scenario
        description: >
          Emissions scenario. historical is the models' historical run; the others are CMIP6 Shared
          Socioeconomic Pathways, from low (ssp126) to very high (ssp585) emissions.
        values: [historical, ssp126, ssp245, ssp370, ssp585]
        data_type: string
      - name: timeframe
        type: temporal
        description: >
          The window a file covers, labelled here by its first year; the column stores the window as
          text (1981-2014, 1995-2014, 2021-2040, 2041-2060, 2061-2080, 2081-2100). The two
          historical windows are 34 and 20 years long, the future windows 20 years. One file per
          timeframe and baseline.
        values: ["1981", "1995", "2021", "2041", "2061", "2081"]
        data_type: string
      - name: year
        type: temporal
        description: >
          Calendar year in which the season starts. A November-January (NDJ) or December-February
          (DJF) value labelled 2041 runs from late 2041 into 2042, so those two seasons have one
          year fewer per window. Years 2015-2020 are not covered.
        extent: ["1981", "2100"]
        step: P1Y
        data_type: float64
      - &hazard
        name: hazard
        type: hazard
        description: >
          Agro-climatic hazard index, computed per model from daily data, summarised by month and
          then over the season. Its unit applies to every value column except n_models.
        categories:
          - value: PTOT
            label: Total precipitation (mm)
            description: Rainfall summed over the season (or the year).
          - value: TAVG
            label: Mean temperature (°C)
            description: Average daily mean temperature over the season.
          - value: TMAX
            label: Maximum temperature (°C)
            description: Highest monthly average of daily maximum temperature in the season.
          - value: NTx35
            label: Heat-stress days above 35 °C (days per month)
            description: Days with maximum temperature above 35 °C, averaged per month over the season.
          - value: NDD
            label: Dry days (days per month)
            description: Days with less than 1 mm of rain, averaged per month over the season.
          - value: NDWS
            label: Soil water-stress days (days per month)
            description: >
              Days on which a simple soil water balance meets less than half of crop water demand
              (actual over potential evapotranspiration below 0.5), averaged per month.
          - value: NDWL0
            label: Waterlogging days (days per month)
            description: >
              Days on which soil moisture in the water balance is above field capacity, averaged per
              month.
          - value: THI-max
            label: Livestock temperature-humidity index, maximum (index)
            description: >
              Highest monthly maximum of the daily temperature-humidity index used for livestock heat
              stress. Unitless; on a Fahrenheit-based scale.
          - value: HSH-max
            label: Human heat index, maximum (°C)
            description: Highest monthly maximum of the daily heat index (apparent temperature).
        data_type: string
      - &season
        name: season
        type: season
        description: >
          Rolling three-month season, named by the initials of its months (JFM = January-March, DJF
          = December-February), or annual for the full calendar year.
        values:
          [JFM, FMA, MAM, AMJ, MJJ, JJA, JAS, ASO, SON, OND, NDJ, DJF, annual]
        data_type: string
      - name: baseline_name
        type: baseline
        description: >
          Historical window the anomaly columns are measured against. Both baselines come from the
          same models' historical runs; 1981-2014 is offered because it starts with the satellite
          rainfall record. One file per timeframe and baseline.
        values: [1981-2014, 1995-2014]
        data_type: string
    variables:
      - name: mean
        description: >
          Ensemble mean of the hazard value for that unit, season and year: the average across the
          18 models. Unit as given for the hazard.
        data_type: float64
        nodata: "NaN"
      - name: sd
        description: Standard deviation of the hazard value across the 18 models (model disagreement).
        data_type: float64
        nodata: "NaN"
      - name: q17
        description: >
          17th percentile of the hazard value across the 18 models. With q83 it brackets the IPCC
          "likely" range.
        data_type: float64
        nodata: "NaN"
      - name: q83
        description: 83rd percentile of the hazard value across the 18 models.
        data_type: float64
        nodata: "NaN"
      - name: n_models
        description: >
          Number of models with a value. 18 throughout, or 0 where no model has a value for that
          unit and hazard (a few small units, mostly for the soil water-balance indices); every other
          value column is then missing too.
        data_type: float64
        unit: "1"
      - name: mean_anomaly
        description: >
          Ensemble mean of the difference between the hazard value and its historical average for the
          same unit and season over the baseline window (all 18 models pooled). Positive means
          higher than the baseline.
        data_type: float64
        nodata: "NaN"
      - name: sd_anomaly
        description: Standard deviation of the anomaly across the 18 models.
        data_type: float64
        nodata: "NaN"
      - name: q17_anomaly
        description: 17th percentile of the anomaly across the 18 models.
        data_type: float64
        nodata: "NaN"
      - name: q83_anomaly
        description: 83rd percentile of the anomaly across the 18 models.
        data_type: float64
        nodata: "NaN"

processing:
  - id: source
    description: >
      NASA NEX-GDDP-CMIP6: daily CMIP6 climate model output, bias-corrected and downscaled to a 0.25°
      grid. 18 models, historical run and four future scenarios.
    derived_from:
      - title: NEX-GDDP-CMIP6 (NASA Center for Climate Simulation)
        url: https://www.nccs.nasa.gov/services/data-collections/land-based-products/nex-gddp-cmip6
  - id: indices
    description: >
      Monthly agro-climatic hazard indices computed per model from the daily fields, including a
      simple soil water balance for the water-stress and waterlogging indices.
    code:
      url: https://github.com/AdaptationAtlas/hazards
  - id: admin-seasons
    description: >
      Each monthly index averaged over GAUL 2024 country and first-level units per model, then
      combined into three-month seasons and the year (summed for rainfall, maximum for TMAX, THI and
      the heat index, averaged for the rest).
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/R/2.1_create_monthly_haz_tables.R
  - id: ensemble
    description: >
      Anomaly computed for each model against the baseline average of all 18 models, then mean,
      standard deviation, 17th and 83rd percentiles and model count taken across the 18 models for
      every unit, season and year.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/R/2.1_create_monthly_haz_tables.R
    date: "2026-09-20"

data:
  - name: season-timeseries
    description: >
      One Parquet table per timeframe and baseline: 10 files, 35 to 140 MB, about 1.7 to 7 million
      rows each. Sorted by country so a query filtered on iso3 reads only that country's part.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=climate/type=hazard-indices/source=nex-gddp-cmip6/region=africa/processing=timeseries_mean_month/timeframe=3months/
        title: HTTPS
      - url: s3://digital-atlas/domain=climate/type=hazard-indices/source=nex-gddp-cmip6/region=africa/processing=timeseries_mean_month/timeframe=3months/
        title: S3
    file_index:
      - format: cdh-inventory
        title: File inventory
        locations:
          - url: ./africa-hazard-season-timeseries-nexgddp-files.csv
        media_type: text/csv
    media_type: application/vnd.apache.parquet
    processing_steps: [source, indices, admin-seasons, ensemble]

