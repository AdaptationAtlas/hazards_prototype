      - *iso3
      - *admin0
      - *admin1
      - *admin2
      - *gaul0
      - *gaul1
      - *gaul2_25
      - *stat
    variables:
      - *value25
      - *unit_full
    foreign_keys:
      - *gaul_fk
  - name: vop-intld15-2021-res-25
    dimensions:
      - *exp_vop
      - name: unit
