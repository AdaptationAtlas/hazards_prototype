cdh:
  domain: [agricultural-production]
  usage:
    intended_uses:
      - Denominator for the hazard-exposure tiers (res-25), turning exposed value into a share of total value per unit.
      - Total crop and livestock value, production, area and head per administrative unit, complete to second level (res-05).
      - The country and first-level "Key Facts" denominator in the Atlas notebooks (res-05).
    not_recommended_for:
      - use: Dividing the hazard-exposure tiers by the res-05 table.
        reason: >
          The 0.05 degree table resolves about 2,100 more second-level units than the 0.25 degree
          hazard product populates; shares come out above 100 per cent in small units.
        use_instead: The res-25 table (variable=crop-livestock_all_res-25) for anything divided into the hazard product.
      - use: Reading the res-25 table as a map of second-level units for a small country.
        reason: >
          A second-level unit that owns no 0.25 degree cell has no row there.
        use_instead: The res-05 table, where completeness of small units matters and the hazard product is not involved.
      - use: Summing or comparing rows across the two vop units.
        reason: intld15-2021 is constant 2015 international dollars; nominal-usd-2021 is nominal 2021 US dollars.
        use_instead: Filter on `unit` and stay on one basis.
      - use: Exposed shares for Kenya robusta coffee or Sierra Leone robusta coffee and coconut.
        reason: A border cell is assigned to a different country here (admin0) than in the hazard product (aggregated from second-level units); hazards_prototype issue 18.
        use_instead: Treat those three national shares as indicative; sub-national units away from the border are unaffected.
      - use: Coffee value for the Central African Republic or Guinea.
        reason: FAOSTAT and MapSPAM coffee tonnage there is far above International Coffee Organization figures.
        use_instead: No substitute in this table; treat as an upper bound.
      - use: Reading the unsuffixed keys as distinct datasets.
        reason: They are byte-identical aliases of the res-05 files and will not be maintained separately.
        use_instead: The _res-05 keys.
