spatial:
  bbox: [-26.0, -35.0, 58.0, 28.0] # Sub-Saharan Africa, 55 countries present
  crs: EPSG:4326
  geography: [sub-saharan-africa]
  # No horizontal axes: each table's reporting unit is its gaul2_code location dimension. The
  # 0.05 / 0.25 degree grids are only where the zonal statistics were computed.

temporal:
  date: "2020" # MapSPAM 2020 and GLW4 2020 physical quantities; values are 2019-2023 median FAOSTAT prices and production values

# Two structures with the same columns: they differ in the zonal grid, and so in which
# administrative units have rows and what each value sums.
structures:
  - name: res-05
    dimensions:
      - &exposure
        name: exposure
        type: variable
        description: What is being counted.
        values: [prod, harv-area, phys-area, vop, number]
      - &unit
        name: unit
        type: unit
        description: >
          Unit of `value`, and for vop the currency basis. Select on this column; the constant-dollar
          and nominal-dollar rows must not be combined.
        values: [t, ha, intld15-2021, nominal-usd-2021, number]
      - &tech
        name: tech
        type: technology
        description: MapSPAM production system for crop rows; tech = all is the whole crop. Absent for livestock rows.
        values: [all, irr, rf-all, rf-highinput, rf-lowinput, rf-subsistence]
      - &crop
        name: crop
        type: commodity
        description: >
          Commodity, 54 present: 42 MapSPAM crops plus livestock species split highland / tropical
          (cattle, sheep, goats, pigs, poultry) and their tropical-livestock-unit totals.
      - name: gaul2_code
        type: location
        description: >
          Administrative unit as the GAUL 2024 code, from zones rasterised on the 0.05 degree Atlas
          exposure grid. Country rows carry gaul0_code only, first-level rows gaul0 and gaul1,
          second-level rows all three; admin1_name and admin2_name are null above their level. 55
          countries, 712 first-level and 6,478 second-level units are present on this grid.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
    variables:
      - name: value
        description: >
          The exposure total for that commodity and unit, summed over the cells the administrative
          unit owns on the 0.05 degree grid. The unit of each row is in the `unit` column.
        data_type: float64
      - &unit_full
        name: unit_full
        description: Identical copy of `unit`, kept for readers written before the vintage moved into `unit`.
        data_type: string
    foreign_keys:
      - &gaul_fk
        fields: [gaul2_code]
        reference:
          resource: https://digital-atlas.s3.amazonaws.com/domain=boundaries/type=admin/source=gaul2024/region=africa/processing=analysis-ready/level=adm2/atlas_gaul24_a2_africa.parquet
          fields: [gaul2_code]
  - name: res-25
    dimensions:
      - *exposure
      - *unit
      - *tech
      - *crop
      - name: gaul2_code
        type: location
        description: >
          Administrative unit as the GAUL 2024 code, from zones rasterised on the 0.25 degree
          NEX-GDDP-CMIP6 hazard grid; a second-level unit that owns no cell has no row. Country rows
          carry gaul0_code only, first-level rows gaul0 and gaul1, second-level rows all three;
          admin1_name and admin2_name are null above their level. 55 countries, 696 first-level and
          4,338 second-level units are present on this grid.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
    variables:
      - name: value
        description: >
          The exposure total for that commodity and unit, summed over the cells the administrative
          unit owns on the 0.25 degree grid. The unit of each row is in the `unit` column.
        data_type: float64
      - *unit_full
    foreign_keys:
      - *gaul_fk

processing:
  - id: source
    description: >
      MapSPAM 2020 Adaptation Atlas SSA production, harvested and physical area rasters; GLW4 2020
      livestock density rasters; FAOSTAT gross production value, producer prices and production for
      the currency layers.
    derived_from:
      - title: MapSPAM2020_AdaptationAtlas_SSA (record mapspam2020-adaptation-atlas-ssa)
        url: https://doi.org/10.7910/DVN/Z0HK7R
      - id: glw4-2020
        title: Gridded Livestock of the World 4, 2020
      - title: FAOSTAT Value of Agricultural Production, Producer Prices, Crops and livestock products
        url: https://www.fao.org/faostat/en/#data
  - id: value
    description: >
      Crop value in constant 2015 international dollars distributes FAOSTAT gross production value
      across pixels by the production share of the MapSPAM crops that share a FAOSTAT item, left
      empty where MapSPAM holds under 10 per cent of FAOSTAT's tonnage; crop nominal 2021 US dollars
      multiply SPAM production by a national price (FAOSTAT implied price, producer-price fallback,
      stale-price test, world clip, median fills, basis guard, cited pins;
      docs/methods/nominal_price_method.md); both computed on the 0.05 degree grid and
      sum-resampled; livestock values distribute FAOSTAT national values by GLW4 head share.
      Scripts R/0.4.0_create_crop_vop_intld15.R, R/0.4.1_create_livestock_exposure.R and
      R/0.4.2_create_crop_vop_nominal_usd.R.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/tree/develop/R
  - id: zonal
    description: >
      Rasterise GAUL 2024 units onto the zonal grid (EXPOSURE_RES=0.05 for res-05, 0.25 for res-25),
      sum every exposure raster per unit, and stack the results into one table with the unit
      vintage kept in the name. The vop_* tables are the same rows filtered to one unit.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/R/0.4.4_process_exposure.R

