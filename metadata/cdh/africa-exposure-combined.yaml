# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# The combined crop + livestock exposure table, one structure per zonal grid: res-05 (0.05 degree
# Atlas exposure grid, the notebook "Key Facts" denominator, aliased by the unsuffixed keys) and
# res-25 (0.25 degree NEX-GDDP hazard grid, the denominator of the hazard-exposure tiers). Replaces
# the draft records africa-exposure-combined-res05 and africa-exposure-combined-res25.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json

id: africa-exposure-combined
title: Crop and Livestock Exposure by Administrative Unit, Sub-Saharan Africa
version: v2026.11
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Crop and livestock exposure totals per administrative unit for Sub-Saharan Africa: MapSPAM 2020 crop
  production, harvested area, physical area and value of production, and GLW4 2020 livestock numbers and
  value of production, summed onto GAUL 2024 country, first- and second-level units. The table comes in
  two structures, from zonal statistics on two grids. The 0.05 degree structure (res-05) resolves nearly
  every second-level unit and is the complete per-unit table. The 0.25 degree structure (res-25) is on
  the NEX-GDDP-CMIP6 grid used by the hazard-exposure tables and is the denominator for exposed shares.
  Value of production is carried on two bases, constant 2015 international dollars and nominal 2021 US
  dollars, distinguished by the unit column; single-basis extracts are published beside each table.
resource_type: dataset
license: CC-BY-4.0 # derived product; principal inputs MapSPAM Adaptation Atlas SSA (CC-BY-4.0) and GAUL 2024 (CC-BY-4.0)
keywords:
  - exposure
  - value of production
  - MapSPAM
  - GLW4
  - administrative units

note: >
  The res-05 structure holds about 2,100 second-level units (6,478 against 4,338) that the 0.25 degree
  hazard-exposure tables cannot populate, so dividing those tables by res-05 gives shares above 100 per
  cent in small units. On res-25 a second-level unit that owns no grid cell has no row, and a small country's
  border units can show value of a crop it does not grow (Chad yams, Benin beans), because each cell is
  assigned to one unit. The total-highland and total-tropical livestock number rows are Tropical Livestock
  Units (cattle 0.7, sheep 0.1, goats 0.1, pigs 0.2, poultry 0.01), not head sums; a later version relabels
  them without changing values. Poultry is GLW4 chickens. Constant-dollar crop value is left empty where
  MapSPAM holds under 10 per cent of FAOSTAT's tonnage for a country and crop (every crop in Sudan, and
  a few small pairs elsewhere); North Africa lies outside the MapSPAM release and has no constant-dollar
  crop rows. Nominal crop prices are each country's own FAOSTAT prices for about 80 per cent of production
  and gap fills elsewhere. FAOSTAT coffee tonnage for the Central African Republic and Guinea is far above
  International Coffee Organization figures, so coffee value there is overstated on both bases. Ethiopia
  tea, Togo oil palm and Guinea-Bissau maize disagree between the two currency bases by more than the
  expected margin, for documented tonnage or price reasons. Thirty-one border cells are assigned to one
  country here and to its neighbour in the hazard-exposure tables, which shows at country level for Kenya
  robusta coffee and Sierra Leone robusta coffee and coconut.

