processing:
  - id: source
    description: >
      MapSPAM 2020 Adaptation Atlas SSA production, harvested and physical area rasters; GLW4 2020
      livestock density rasters; FAOSTAT gross production value, producer prices and production for
      the currency layers.
    derived_from:
      - title: MapSPAM2020_AdaptationAtlas_SSA
        url: https://doi.org/10.7910/DVN/Z0HK7R
        version: "1.0"
      - id: glw4-2020
        title: Gridded Livestock of the World 4, 2020
        version: "1"
      - title: >-
          FAOSTAT Value of Agricultural Production, Producer Prices, Crops and livestock products (bulk
          files downloaded 2026-05-14; FAOSTAT publishes no release labels)
        url: https://www.fao.org/faostat/en/#data
  - id: value
    description: >
      Crop value in constant 2015 international dollars distributes FAOSTAT gross production value across
      pixels by the production share of the MapSPAM crops that share a FAOSTAT item, left empty where
      MapSPAM holds under 10 per cent of FAOSTAT's tonnage; crop nominal 2021 US dollars multiply SPAM
      production by a national price (FAOSTAT implied price, producer-price fallback, stale-price test,
      world clip, median fills, basis guard, cited pins; docs/methods/nominal_price_method.md); both computed
      on the 0.05 degree grid and sum-resampled; livestock values distribute FAOSTAT national values by
      GLW4 head share. Scripts R/0.4.0_create_crop_vop_intld15.R, R/0.4.1_create_livestock_exposure.R
      and R/0.4.2_create_crop_vop_nominal_usd.R. Nominal livestock values use each country's own FAOSTAT
      producer price (2019-2023 median, clipped) with median gap fills. FAOSTAT is matched on item code;
      bananas and plantains are pooled and split by production share.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/tree/03a5705/R
      version: 03a5705
  - id: zonal
    description: >
      Rasterise GAUL 2024 units onto the zonal grid (EXPOSURE_RES=0.05 for res-05, 0.25 for res-25),
      sum every exposure raster per unit, and stack the results into one table with the unit
      vintage kept in the name. The vop_* tables are the same rows filtered to one unit.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/1825d3a/R/0.4.4_process_exposure.R
      version: 1825d3a

