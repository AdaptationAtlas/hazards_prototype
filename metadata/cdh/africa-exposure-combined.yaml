spatial:
  bbox: [-26.0, -35.0, 58.0, 28.0] # Sub-Saharan Africa, 55 countries present
  crs: EPSG:4326
  geography: [sub-saharan-africa]
  # No horizontal axes: each table's reporting unit is its gaul2_code location dimension. The
  # 0.05 / 0.25 degree grids are only where the zonal statistics were computed.

temporal:
  date: "2020" # MapSPAM 2020 and GLW4 2020 physical quantities; values are 2019-2023 median FAOSTAT prices and production values

# Two structures with the same columns: they differ in the zonal grid, and so in which
# administrative units have rows and what each value sums.
structures:
  - name: res-05
    dimensions:
      - &exposure
        name: exposure
        type: variable
        description: >
          What is being counted. tlu marks the two whole-species aggregate rows per country
          (crop total-tropical and total-highland), counted in tropical livestock units since
          2026-11-17; the per-species rows stay under number.
        values: [prod, harv-area, phys-area, vop, number, tlu]
      - &unit
        name: unit
        type: unit
        description: >
          Unit of `value`, and for vop the currency basis. Select on this column; the constant-dollar
          and nominal-dollar rows must not be combined.
        values: [t, ha, intld15-2021, nominal-usd-2021, number, tlu]
      - &tech
        name: tech
        type: technology
        description:
          MapSPAM production system for crop rows; tech = all is the whole crop. Absent for
          livestock rows.
        values: [all, irr, rf-all, rf-highinput, rf-lowinput, rf-subsistence]
      - &crop
        name: crop
        type: commodity
        description: >
          Commodity, 54 present: 42 MapSPAM crops plus livestock species split highland / tropical
          (cattle, sheep, goats, pigs, poultry) and their tropical-livestock-unit totals.
      - &iso3
        name: iso3
        type: location
        description: ISO 3166-1 alpha-3 country code. 55 countries.
        reference_system: https://www.iso.org/iso-3166-country-codes.html
        data_type: string
      - &admin0
        name: admin0_name
        type: location
        description: Country name, as in FAO GAUL 2024.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: string
      - &admin1
        name: admin1_name
        type: location
        description: First-level administrative unit name, as in FAO GAUL 2024. Null on country rows.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: string
      - &admin2
        name: admin2_name
        type: location
        description: >
          Second-level administrative unit name, as in FAO GAUL 2024. Null on country and first-level
          rows.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: string
      - &gaul0
        name: gaul0_code
        type: location
        description: Country as the GAUL 2024 code; present on every row.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: float64
      - &gaul1
        name: gaul1_code
        type: location
        description: First-level unit as the GAUL 2024 code; null on country rows.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: float64
      - &gaul2_05
        name: gaul2_code
        type: location
        description: >
          Administrative unit as the GAUL 2024 code, from zones rasterised on the 0.05 degree exposure
          grid. Country rows carry gaul0_code only, first-level rows gaul0 and gaul1, second-level rows
          all three; admin1_name and admin2_name are null above their level. 55 countries, 712
          first-level and 6,478 second-level units are present on this grid.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: float64
      - &stat
        name: stat
        type: statistic
        description: How cells are combined into the unit total; always sum.
        values: [sum]
        data_type: string
    variables:
      - &value05
        name: value
        description: >
          The exposure total for that commodity and unit, summed over the cells the administrative
          unit owns on the 0.05 degree grid. The unit of each row is in the `unit` column.
        data_type: float64
      - &unit_full
        name: unit_full
        description:
          Identical copy of `unit`, kept for readers written before the vintage moved into
          `unit`.
        data_type: string
    foreign_keys:
      - &gaul_fk
        fields: [gaul2_code]
        reference:
          resource: https://digital-atlas.s3.amazonaws.com/domain=boundaries/type=admin/source=gaul2024/region=africa/processing=analysis-ready/level=adm2/atlas_gaul24_a2_africa.parquet
          fields: [gaul2_code]
  - name: res-25
    dimensions:
      - *exposure
      - *unit
      - *tech
      - *crop
      - *iso3
      - *admin0
      - *admin1
      - *admin2
      - *gaul0
      - *gaul1
      - &gaul2_25
        name: gaul2_code
        type: location
        description: >
          Administrative unit as the GAUL 2024 code, from zones rasterised on the 0.25 degree
          NEX-GDDP-CMIP6 hazard grid; a second-level unit that owns no cell has no row. Country rows
          carry gaul0_code only, first-level rows gaul0 and gaul1, second-level rows all three;
          admin1_name and admin2_name are null above their level. 55 countries, 696 first-level and
          4,338 second-level units are present on this grid.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
        data_type: float64
      - *stat
    variables:
      - &value25
        name: value
        description: >
          The exposure total for that commodity and unit, summed over the cells the administrative
          unit owns on the 0.25 degree grid. The unit of each row is in the `unit` column.
        data_type: float64
      - *unit_full
    foreign_keys:
      - *gaul_fk
  - name: vop-nominal-usd-2021-res-05
    dimensions:
      - &exp_vop
        name: exposure
        type: variable
        description: Value of production only.
        values: [vop]
      - name: unit
        type: unit
        description: Currency basis of `value`, one per file (nominal 2021 US dollars).
        values: [nominal-usd-2021]
      - name: tech
        type: technology
        description:
          MapSPAM production system for crop rows; tech = all is the whole crop. Absent for
          livestock rows.
        values: [all, irr, rf-all, rf-highinput, rf-lowinput, rf-subsistence]
      - name: crop
        type: commodity
        description: >
          Commodity, 43 present: the crops and livestock species-systems that carry a value on
          this basis.
      - *iso3
      - *admin0
      - *admin1
      - *admin2
      - *gaul0
      - *gaul1
      - *gaul2_05
      - *stat
    variables:
      - *value05
      - *unit_full
    foreign_keys:
      - *gaul_fk
  - name: vop-intld15-2021-res-05
    dimensions:
      - *exp_vop
      - name: unit
        type: unit
        description: Currency basis of `value`, one per file (constant 2015 international dollars).
        values: [intld15-2021]
      - name: tech
        type: technology
        description:
          MapSPAM production system for crop rows; tech = all is the whole crop. Absent for
          livestock rows.
        values: [all, irr, rf-all]
      - name: crop
        type: commodity
        description: >
          Commodity, 52 present: the crops and livestock species-systems that carry a value on
          this basis.
      - *iso3
      - *admin0
      - *admin1
      - *admin2
      - *gaul0
      - *gaul1
      - *gaul2_05
      - *stat
    variables:
      - *value05
      - *unit_full
    foreign_keys:
      - *gaul_fk
  - name: vop-nominal-usd-2021-res-25
    dimensions:
      - *exp_vop
      - name: unit
        type: unit
        description: Currency basis of `value`, one per file (nominal 2021 US dollars).
        values: [nominal-usd-2021]
      - name: tech
        type: technology
        description:
          MapSPAM production system for crop rows; tech = all is the whole crop. Absent for
          livestock rows.
        values: [all, irr, rf-all, rf-highinput, rf-lowinput, rf-subsistence]
      - name: crop
        type: commodity
        description: >
          Commodity, 43 present: the crops and livestock species-systems that carry a value on
