  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json

id: kenya-county-gender-datasheets
title: Kenya County Gender Data Sheets, 2025
description: >
  Gender and social-inclusion indicators for all 47 Kenyan counties, published as one data sheet per
  county in October 2025. Indicators cover health and fertility, education, economic participation,
  political representation, disability and attitudes to intimate-partner violence, drawn largely
  from the 2022 Kenya Demographic and Health Survey, the 2019 census and the 2022 general election.
  A federated record - the Adaptation Atlas reads these sheets but does not host or redistribute
  them.
resource_type: dataset
license: LicenseRef-KE-Gov-Statistics-Assumed-Open # WORKING ASSUMPTION, not a grant anyone made: the sheets carry no rights notice, and Kenyan official statistics published for public planning are treated as open pending evidence otherwise. Decision by the Atlas data owner, 2026-09-18. Revisit if any party states terms.
keywords:
  [
    gender,
    social inclusion,
    gesi,
    disaggregation,
    county,
    kenya,
    knbs,
    un women,
  ]

note: >
  LICENCE - AN EXPLICIT WORKING ASSUMPTION, NOT A GRANT. No party has published terms for these
  sheets. The Atlas treats them as open pending evidence otherwise, a decision taken by the data
  owner on 2026-09-18 and recorded here so it is visible rather than implied: LicenseRef-KE-Gov-
  Statistics-Assumed-Open means "no rights stated, treated as open", NOT "the publishers granted an
  open licence". Anyone relying on these figures commercially should confirm with the publishers
  first. The evidence behind the assumption follows. Every page of a sheet was read and the raw PDF
  scanned: there is NO copyright notice, NO "all rights reserved" and NO ISBN. That is materially
  better footing than the KNBS census projections (record kenya-population-knbs-projections, whose
  Volume XVI reserves rights in terms) - but absence of a notice is NOT a grant, and copyright
  subsists automatically. Worse, there is no single party whose terms could be pointed at: these are
  a six-way co-publication. The KNBS Open License Agreement does NOT reach them, being scoped to
  data published on the KNBS Open Data Platform, while these are PDFs on knbs.or.ke - the same gap
  already established for Volume XVI. UN Women co-publishes under the Women Count programme and
  normally releases CC-BY-3.0-IGO, which is a signal and not a statement. Settle with UN Women Kenya
  or the State Department for Gender before anything derived from these is published.
  EDITION. The October 2025 set, all 47 county sheets. Not the 2019 ten-county pilot, and not a mix.
  VINTAGE IS NOT UNIFORM AND IS NOT RECOVERABLE FROM THE SHEETS AS EXTRACTED. Indicators mix 2022
  KDHS, 2019 census-derived figures and 2022 election results. The Atlas extraction strips any
  trailing year from indicator labels, so no per-indicator reference year survives in the derived
  table. Treating the whole table as "2022" is wrong for some indicators.
  BLANK IS NOT ZERO. The extraction serves a series only where at least 40 of 47 counties agree with
  the modal national value; non-matching county rows are dropped individually. So a served series can
  be silently missing up to seven counties, and a missing county-series is a parse or gate drop -
  NEVER an observed zero. Only 10 of 35 series reach all 47 counties; the worst is households with
  an elderly member at 40/47. Per-county row counts run 22-35.
  COVERAGE IS ASYMMETRIC WITHIN AN INDICATOR. One code can have 47 counties for male and 46 for
  female. Do not compute a sex ratio or a gender gap without checking both sides are present for
  that county.
  CHART-ONLY INDICATORS ARE ABSENT BY METHOD. Antenatal-visit and vaccination charts and internet
  usage are dropped by the gate. Their absence reflects the extraction, not the source.
  LABELS ARE NOT DEFINITIONS. The canonical label is the longest string seen across the 47 sheets
  and several remain truncated mid-sentence. Do not lift them into variable descriptions.
  COLUMN-ORDER FRAGILITY. Values are read Kenya-then-County from the printed header. A future
  edition that flips that header would swap every value silently; the coverage gate catches it only
  if the national column also becomes inconsistent.

