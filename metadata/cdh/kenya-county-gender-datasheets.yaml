spatial:
  bbox: [33.9, -4.7, 41.9, 5.5] # restored on promotion; --draft false-fails it, see cdh-metadata-standard#33
  crs: EPSG:4326
  geography: [kenya]

dimensions:
  - name: county
    type: location
    description: >
      County name as printed on the sheet, 47 counties. The sheets carry names, not p-codes; any
      p-code is an Atlas-side addition mapped to IEBC COD-AB adm1 (record kenya-admin-codab).
  - name: indicator_code
    type: indicator
    description: >
      Stable indicator code as printed (A3, B1, D10 and so on). The extraction keys on this code and
      never on label text - keying on labels fragmented a single indicator into 142 near-duplicate
      variants in an earlier attempt. 24 codes are served.
  - name: sub
    type: subseries
    description: >
      Splits a code by sex, or by measure variant such as Gross against Net Attendance Ratio. 35
      series across the 24 codes.

variables:
  - name: county_value
    dimensions: [county, indicator_code, sub]
    description: The county figure for that indicator series, as printed on the county sheet.
    data_type: float64
    unit: "1"
  - name: kenya
    dimensions: [indicator_code, sub]
    description: >
      The national figure printed alongside the county figure. Also the gate key - a series is served
      only where at least 40 counties agree with the modal national value.
    data_type: float64
    unit: "1"

citation:
  title: County Gender Data Sheets, 2025
  authors:
    - "Kenya National Bureau of Statistics"
    - "State Department for Gender and Affirmative Action"
    - "Council of Governors"
    - "UN Women"
  date: "2025"
  publisher: Kenya National Bureau of Statistics
  url: https://www.knbs.or.ke/reports/county-gender-datasheets-2025/

processing:
  - id: source
    description: >
      KNBS, the State Department for Gender and Affirmative Action, the Council of Governors, UN
      Women (Women Count) and the SDGs Kenya Forum compile county indicators, largely from KDHS 2022,
      the 2019 census and the 2022 general election, and publish one PDF data sheet per county.
    derived_from:
      - title: County Gender Datasheets 2025 (KNBS)
        url: https://www.knbs.or.ke/reports/county-gender-datasheets-2025/
  - id: extract
    description: >
      Deterministic text extraction from the 47 PDFs - pymupdf get_text("blocks"), two-column split
      on x0 < 320, sorted by page, column and y, keyed on the printed indicator code, values read
      Kenya-then-County per the printed header, then gated at 40 of 47 counties agreeing with the
      modal national value. No language model touches a number.
    code:
      url: https://github.com/AdaptationAtlas/atlas_notebooks
      version: data/KE-enso-explorer/_sources/gesi_extract.py

data:
  - name: county-data-sheets
    description: >
      47 county gender data sheets, October 2025, one PDF per county, roughly 12 pages each. Linked,
      not hosted. Acquisition is NOT scripted in a public repository - the raw PDFs, the URL list and
      the download script sit on project OneDrive, so this dataset is reproducible by transform but
      not by fetch.
    locations:
      - url: https://www.knbs.or.ke/reports/county-gender-datasheets-2025/
        title: HTTPS
    media_type: application/pdf
    processing_steps: [source]

additional_links:
  - name: County Gender Datasheets 2025 - publication page
    rel: license
    url: https://www.knbs.or.ke/reports/county-gender-datasheets-2025/
    description: >
      The publication page for the sheets. It states no terms of use, which is the basis for the
      assumed-open working position recorded in the licence note - this link documents the ABSENCE
      of stated terms, not the presence of a grant.

cdh:
  domain: [socioeconomic]
  usage:
    intended_uses:
      - Gender and social-inclusion disaggregation of county-level exposure in the KE-ENSO Explorer.
    not_recommended_for:
      - use: Reading a missing county-series as a zero or as a low value.
        reason: >
          Series are gated at 40 of 47 counties and non-matching rows are dropped individually, so
          absence is a parse or gate artefact rather than an observation.
        use_instead: Check per-series county coverage before mapping or ranking; only 10 of 35 series are complete.
      - use: Treating the table as a single reference year, such as 2022.
        reason: >
          The sheets mix KDHS 2022, 2019 census-derived and 2022 election vintages, and the
          extraction strips trailing years from labels, so no per-indicator year survives.
        use_instead: Recover the reference year per indicator from the source sheet before making any temporal claim.
      - use: Computing a sex ratio or gender gap without checking both sides.
        reason: Coverage is asymmetric within a code - one sex can have 47 counties and the other 46.
        use_instead: Require both sexes present for that county, or drop the county from the comparison.
