created: "2026-09-25"
updated: "2026-09-25"

spatial:
  bbox: [33.9, -4.7, 41.9, 5.5]
  crs: EPSG:4326
  geography: [kenya]

temporal:
  start_date: "2019"
  end_date: "2024"

dimensions:
  - name: year
    type: temporal
    description: Calendar/crop harvest year (2019-2024).
  - name: county
    type: categorical
    description: Kenya 47 counties (ADM1).
  - name: commodity
    type: categorical
    description: Agricultural commodity or livestock species.

variables:
  - name: area_ha
    description: Area harvested in hectares.
    unit: ha
  - name: production_t
    description: Production quantity in metric tonnes.
    unit: t
  - name: value_ksh
    description: Gross farm-gate economic value in Kenya Shillings.
    unit: KES
  - name: head
    description: Total livestock population count (head).
    unit: head

data:
  - name: knbs_napr_county_production_parquet
    description: County-level crop area, production and farm-gate value table.
    s3: s3://digital-atlas/domain=agriculture/type=production/knbs_napr_county_production.parquet
    media_type: application/vnd.apache.parquet
  - name: knbs_napr_livestock_parquet
    description: County-level livestock population census estimates.
    s3: s3://digital-atlas/domain=agriculture/type=livestock/knbs_napr_livestock.parquet
    media_type: application/vnd.apache.parquet

cdh:
  domain: [agriculture]
  usage:
    intended_uses:
      - Constructing empirical historical crop balance sheets paired with ENSO/IOD phases.
      - Evaluating county-level production deviation during climate shock years.
    not_recommended_for:
      - use: Sub-county spatial allocation or field-level crop model validation without Level 2 downscaling.
        reason: Administrative estimates are compiled at county level and lack GPS field coordinates.
        use_instead: Satellite remote sensing NDVI and WRSI proxies for sub-county spatial heterogeneity.
