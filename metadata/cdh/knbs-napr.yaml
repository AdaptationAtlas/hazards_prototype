id: knbs-napr
title: KNBS National Agricultural Production Reports (Crops, Livestock & Products)
description: >
  Audited subnational agricultural statistics from the Kenya National Bureau of Statistics (KNBS)
  National Agricultural Production Reports (NAPR 2023/24 and 2024/25 editions). Contains county-level
  annual area harvested (ha), production (t), and gross farm-gate value (KES) across 22 major food
  and cash commodities (maize, beans, sorghum, tea, coffee, potatoes, pyrethrum, wheat, dairy milk,
  beef), cross-verified via dual-engine deterministic parsing (PyMuPDF) and additivity gates.
resource_type: dataset
license: LicenseRef-KNBS # Official statistics of the Republic of Kenya
keywords:
  [
    knbs,
    napr,
    crop production,
    livestock population,
    farm gate value,
    agricultural statistics,
    kenya counties,
    adm1,
    maize,
    beans,
    pastoralism,
  ]

note: >
  Attribution: "Data extracted deterministically from the Kenya National Bureau of Statistics (KNBS) National Agricultural Production Reports (2023/24, 2024/25), Republic of Kenya."
  PROJECT RULE D1 COMPLIANCE: ZERO LLM INFERENCE. Every number served from this dataset is parsed
  directly from published government PDF tables by deterministic code (_sources/napr_extract.py) and
  passed through an automated machine additivity gate. No language model reads, types, or imputes any
  numerical value.
  BLANK IS NOT ZERO. KNBS data is compiled from administrative expert-estimates. Missing county-years
  represent unobserved reporting gaps, never zero production. Records with missing data are preserved
  as null and never imputed as false zeroes.
  CROSS-EDITION REBASE (2025 EDITION PRIORITY). Where reporting years overlap between the 2023/24
  and 2024/25 editions, the latest edition is prioritised because it incorporates KNBS retrospective
  prior-year revisions.
  ADMINISTRATIVE ESTIMATES VS CENSUS SURVEYS. NAPR figures represent annual ministerial and county
  directorate of agriculture administrative estimates, not full-enumeration agricultural censuses.

