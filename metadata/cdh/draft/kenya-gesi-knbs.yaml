id: kenya-gesi-knbs
title: Kenya Gender and Social Inclusion Statistics (KNBS)
description: >
  Gender and social-inclusion indicators published by the Kenya National Bureau of Statistics,
  for disaggregating exposure and impact analysis in the KE-ENSO Explorer. A federated record - the
  Adaptation Atlas cites these statistics but does not host them.
resource_type: dataset
keywords: [gender, social inclusion, gesi, disaggregation, kenya, knbs]

note: >
  DRAFT - BLOCKED ON IDENTIFYING THE EXACT PRODUCT. KNBS publishes several gender and inclusion
  outputs and this record does not yet name which one the notebook uses; pin the specific
  publication and its release year before promotion, and record the administrative level it reports
  at, since that governs whether it can join the census tables at all.
  LICENCE. Expected to be the KNBS Open License Agreement, as for records
  kenya-population-knbs-census and kenya-population-knbs-projections, but that agreement is scoped to
  data published on the KNBS Open Data Platform - a publication that exists only as a PDF on
  knbs.or.ke is not clearly covered. Resolve alongside hazards_prototype issue 33.
  ADMIN JOINS. If it reports at sub-county level, the KNBS universe of 345 sub-counties does NOT join
  one-for-one to the 290 IEBC COD-AB constituencies; see the note in kenya-population-knbs-census.

