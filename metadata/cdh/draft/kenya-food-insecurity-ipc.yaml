processing:
  - id: source
    description: >
      KFSSG conducts the seasonal assessment; the IPC Technical Working Group classifies areas into
      phases by consensus over converging evidence and publishes area phases and population tables.
    derived_from:
      - title: IPC Kenya country analyses
        url: https://www.ipcinfo.org/ipc-country-analysis/en/?country=KEN
      - title: IPC Application Programming Interface
        url: https://www.ipcinfo.org/ipc-country-analysis/api/

data:
