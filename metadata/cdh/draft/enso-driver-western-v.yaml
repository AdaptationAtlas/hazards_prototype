processing:
  - id: source
    description: >
      An east-west gradient of sea-surface-temperature anomalies across the Pacific Western V region,
      as defined in the Funk et al. literature on East African rainfall. Exact box coordinates, base
      period and underlying SST product still to be recorded - see the note.
    derived_from:
      - title: >
          Funk et al. (2018), Examining the role of unusually warm Indo-Pacific sea-surface
          temperatures in recent African droughts, Q. J. R. Meteorol. Soc.
        url: https://doi.org/10.1002/qj.3266
      - title: >
          Funk (2023), Frequent but Predictable Droughts in East Africa Driven by a Walker
          Circulation Intensification, Earth's Future
        url: https://doi.org/10.1029/2022EF003454

