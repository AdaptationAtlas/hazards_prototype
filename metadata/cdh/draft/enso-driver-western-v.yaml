id: enso-driver-western-v
title: Western V Sea Surface Temperature Index (Funk)
description: >
  The "Western V" index of Funk and colleagues: a west-Pacific / Indian Ocean sea-surface-temperature
  pattern used as a predictor of East African rainfall, distinct from the Nino 3.4 and RONI ENSO
  indices. A federated record - the Adaptation Atlas cites this index but does not host it.
resource_type: dataset
keywords:
  [
    western v,
    sea surface temperature,
    east africa,
    rainfall prediction,
    climate index,
  ]

note: >
  DRAFT - BLOCKED ON A SOURCE. This is the least standardised index in the KE-ENSO Explorer driver
  set: unlike RONI (NOAA CPC) and DMI (NOAA PSL), it has no single canonical published time series,
  and the notebook stages it through its own builder. Before promotion, establish and record (a) the
  exact SST box definition and the paper it comes from, (b) whether an authoritative series is
  published anywhere or whether the Atlas computes it, and (c) the licence of whichever SST product
  it is computed from - if that product is HadISST, the UK Non-Commercial Government Licence applies
  and the constraint in record enso-driver-dmi carries over verbatim.

contact:
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [point-of-contact]

processing:
  - id: source
    description: >
      Area-averaged sea-surface-temperature anomalies over the Western V region, as defined in the
      Funk et al. literature on East African rainfall decline. Exact definition to be recorded.

cdh:
  domain: [climate]
