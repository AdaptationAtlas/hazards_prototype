id: harveststat-crop-production
title: HarvestStat Africa - Harmonized Subnational Crop Statistics
description: >
  Cleaned and harmonised subnational crop production, harvested area and yield for Sub-Saharan
  Africa, assembled from FEWS NET and FAO sources: 574,204 records, 33 countries, 94 crop types,
  primarily 1980-2022. A federated record - the Adaptation Atlas cites this dataset but does not
  host or redistribute it.
resource_type: dataset
keywords:
  [
    crop production,
    harvested area,
    yield,
    subnational,
    fews net,
    africa,
    food security,
  ]
doi: 10.5061/dryad.vq83bk42w

note: >
  DRAFT - BLOCKED ON LICENCE CONFIRMATION. The Dryad landing page does not state an explicit licence;
  Dryad's platform default is CC0-1.0 but that was not confirmed on the page itself, so no licence is
  asserted here rather than guessing one. Confirm with Dryad or the authors, then set license and
  promote.
  Quantities are metric tonnes, areas hectares, yields metric tonnes per hectare. Coverage is jagged
  across countries, crops and years - check per-country completeness before treating any national
  series as continuous.

