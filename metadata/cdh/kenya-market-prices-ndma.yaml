id: kenya-market-prices-ndma
title: Kenya Drought Early Warning Bulletins - Market Prices and Terms of Trade (NDMA)
description: >
  Market indicators from the National Drought Management Authority's monthly Drought Early Warning
  bulletins - staple and livestock prices and the pastoral terms of trade - published both as a
  national bulletin and as per-county bulletins for the arid and semi-arid counties. A federated
  record: the Adaptation Atlas cites these bulletins but does not host them.
resource_type: dataset
license: LicenseRef-KE-Gov-Statistics-Assumed-Open # WORKING ASSUMPTION, not a grant anyone made: NDMA publishes no terms, and Kenyan government early-warning bulletins issued for public drought response are treated as open pending evidence otherwise. Decision by the Atlas data owner, 2026-09-18.
keywords:
  [market prices, terms of trade, drought early warning, pastoral, kenya, ndma]

note: >
  DRAFT - BLOCKED ON TWO THINGS. (a) No licence is published for NDMA bulletins; confirm with NDMA
  before asserting one. As of 2026-09-18 the terms could not even be checked: ndma.go.ke presents an
  EXPIRED TLS CERTIFICATE, so the site cannot be fetched over a verified connection. That is a
  reproducibility problem as much as a licensing one - an automated ingest would have to disable
  certificate verification to reach it, which is not something to build into a pipeline. (b) The indicators are published as monthly PDF bulletins, not as a
  machine-readable series, so any time series is reconstructed by extraction - record who extracts
  it, with what code, and over which months, before promotion.
  TERMS OF TRADE IS A RATIO, NOT A PRICE. It expresses how much staple a pastoralist obtains per
  animal sold, so it moves with either leg; a fall can mean cheaper livestock or dearer grain, and
  the two have different implications. Do not read it as a price index.
  FEWS NET publishes a separate Kenya Price Bulletin covering overlapping markets - a different
  product with a different methodology, not a substitute.

