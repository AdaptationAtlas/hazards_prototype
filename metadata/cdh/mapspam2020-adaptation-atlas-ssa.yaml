# CDH v0.3.0 record - MapSPAM2020 Adaptation Atlas SSA. An Atlas-authored regional adaptation of
# IFPRI MapSPAM 2020, and the largest uncatalogued input under the whole exposure chain.
# NOT the same dataset as the Hub's `spam2020` record, which is IFPRI's GLOBAL v2r2 release.
$schema: https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/schemas/profiles/cdh.schema.json
cdh_schema_version: v0.3.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json

id: mapspam2020-adaptation-atlas-ssa
title: MapSPAM 2020 Adaptation Atlas, Sub-Saharan Africa
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Spatially disaggregated crop statistics for Sub-Saharan Africa: 42 crops across six production
  systems, harmonised to FAOSTAT country totals, as physical area, harvested area, production, yield
  and value of production. A regional adaptation of IFPRI's MapSPAM 2020 built for the Africa
  Agriculture Adaptation Atlas, supplementing the global release with national and sub-national
  sources. This is the crop-production basis of the Atlas exposure chain: every crop value-of-
  production layer, and through them the hazard-exposure product, is distributed across these
  production shares.
resource_type: dataset
license: CC-BY-4.0 # as published on CGSpace by the Alliance of Bioversity International and CIAT
doi: 10.7910/DVN/Z0HK7R
keywords:
  [
    crop production,
    harvested area,
    physical area,
    yield,
    value of production,
    MapSPAM,
    SPAM,
    sub-saharan africa,
    food security,
  ]

note: >
  NOT THE SAME DATASET AS THE HUB'S `spam2020` RECORD, DESPITE THE NAME. That record describes
  IFPRI's GLOBAL MapSPAM 2020 v2r2, licensed CC-BY-SA-4.0 and published as zarr. This one is the
  Atlas's Sub-Saharan Africa adaptation, licensed CC-BY-4.0 and published as GeoTIFF. Different
  scope, different licence, different format, different DOI. Do not substitute one for the other,
  and note that the share-alike term on the global release does NOT reach the Atlas exposure chain,
  which consumes this product.
  THREE PROCESSING LEVELS, AND THEY ARE NOT INTERCHANGEABLE. `raw` holds the released CSVs, one file
  per variable and technology code (P_TA, P_TH, P_TI and so on). `analysis-ready` holds rasterised
  GeoTIFFs. `atlas-harmonized` holds the Atlas value-of-production layers derived from them. The VoP
  chain reads `analysis-ready/variable=prod_t` and writes into `atlas-harmonized`.
  FILE NAMING DIFFERS BETWEEN LEVELS. The irrigated system is `irrigated` under `analysis-ready` and
  `irr` under `atlas-harmonized`. Anything templating a path across both levels must special-case it;
  the token values below are given per level for that reason.
  CURRENCY BASIS IS A KNOWN TRAP. Several value-of-production variables coexist - vop_intld15,
  vop_usd2015, vop_nominal-usd15, vop_nominal-usd21 - and they are NOT interchangeable. A past
  mismatch between the crop and livestock currency bases produced roughly a sevenfold error in cattle
  exposure. Constant international dollars (vop_intld15) is the Atlas standard; check the livestock
  counterpart is on the same basis before combining. Tracked as hazards_prototype issue 30.
  THREE OBJECTS ARE PUBLISHED UNDER A MALFORMED KEY. Directly beneath `region=ssa/` there are three
  parquet objects whose path reads `processing=atlas-harmonizedvariable=<name>.parquet`, missing the
  separator between the two hive fields: crop-livestock_all, vop_intld15-2021 and
  vop_nominal-usd-2021. They are not reachable by a hive-partitioned scan and should be republished
  or removed rather than left as a trap for the next reader.

