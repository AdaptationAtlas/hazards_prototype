    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact]

citation:
  title: MapSPAM2020_AdaptationAtlas_SSA
  authors:
    - "Wood-Sichra, U."
    - "Steward, P. R."
    - "Rosenstock, T. S."
    - "Youngberg, B."
    - "Guo, Z."
    - "Zhou, S."
  date: "2026"
