created: "2026-09-18"
updated: "2026-09-18"

spatial:
  bbox: [-26.0, -35.0, 58.0, 28.0] # Sub-Saharan Africa
  crs: EPSG:4326
  geography: [sub-saharan-africa]

temporal:
  date: "2020"

dimensions:
  - name: production_system
    type: production-system
    description: >
      Production system, as the file-name suffix under analysis-ready. The atlas-harmonized level
      spells the irrigated system `irr` instead of `irrigated`; otherwise the values match.
    values: [all, irrigated, rf-all, rf-highinput, rf-lowinput, rf-subsistence]

variables:
  - name: prod_t
    dimensions: [production_system]
    description: Crop production, one band per crop.
    data_type: float32
    unit: t
  - name: harv-area_ha
    dimensions: [production_system]
    description: Harvested area, one band per crop.
    data_type: float32
    unit: ha
  - name: phys-area_ha
    dimensions: [production_system]
    description: Physical area, one band per crop.
    data_type: float32
    unit: ha
  - name: yield_kgha
    dimensions: [production_system]
    description: Yield, one band per crop.
    data_type: float32
    unit: kg/ha
  - name: vop_intld15
    dimensions: [production_system]
    description: >
      Value of production in constant 2015 international dollars - the Atlas standard basis, and the
      one the exposure chain expects.
    data_type: float32
    unit: "[IUSD]"
  - name: vop_usd2015
    dimensions: [production_system]
    description: Value of production in 2015 US dollars. Not interchangeable with vop_intld15.
    data_type: float32
    unit: USD

processing:
  - id: source
    description: >
      IFPRI's Spatial Production Allocation Model disaggregates subnational crop statistics onto a
      grid; the Atlas adaptation extends the 2020 release for Sub-Saharan Africa with additional
      national and sub-national sources and harmonises the result to FAOSTAT country totals.
    derived_from:
      - title: MapSPAM2020_AdaptationAtlas_SSA (CGSpace)
        url: https://cgspace.cgiar.org/items/5736e3ff-aadc-4999-8922-8bac50b1c916
      - title: MapSPAM, Spatial Production Allocation Model
        url: https://www.mapspam.info/
  - id: rasterise
    description: Rasterise the released CSVs to GeoTIFF, one file per variable and production system.
  - id: vop
    description: >
      Distribute FAOSTAT gross production value across pixels by each crop's production share, so
      that the country total reconstructs the FAOSTAT figure.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: R/0.4.0_create_crop_vop_intld15.R

data:
  - name: raw-csv
    description: The released CSVs, one per variable and technology code.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=exposure/type=crop/source=spam2020v1r2_ssa/region=ssa/processing=raw/
        title: HTTPS
      - url: s3://digital-atlas/domain=exposure/type=crop/source=spam2020v1r2_ssa/region=ssa/processing=raw/
        title: S3
    media_type: text/csv
    processing_steps: [source]
  - name: analysis-ready
    description: Rasterised GeoTIFFs, one file per production system within each variable directory.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=exposure/type=crop/source=spam2020v1r2_ssa/region=ssa/processing=analysis-ready/
        title: HTTPS
      - url: s3://digital-atlas/domain=exposure/type=crop/source=spam2020v1r2_ssa/region=ssa/processing=analysis-ready/
        title: S3
    href_template: "variable={variable}/spam_{variable}_{production_system}.tif" # e.g. variable=prod_t/spam_prod_t_rf-all.tif
    media_type: image/tiff; application=geotiff
    processing_steps: [source, rasterise]
  - name: atlas-harmonized-vop
    description: >
      Atlas value-of-production layers derived from the production rasters. Note the irrigated system
      is spelled `irr` here, not `irrigated`.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=exposure/type=crop/source=spam2020v1r2_ssa/region=ssa/processing=atlas-harmonized/
        title: HTTPS
      - url: s3://digital-atlas/domain=exposure/type=crop/source=spam2020v1r2_ssa/region=ssa/processing=atlas-harmonized/
        title: S3
    media_type: image/tiff; application=geotiff
    processing_steps: [source, rasterise, vop]

cdh:
  domain: [agricultural-production]
  usage:
    intended_uses:
      - Distributing FAOSTAT gross production value across pixels to build crop value-of-production layers.
      - Weighting hazard exposure by where crops are actually grown, rather than by land area.
    not_recommended_for:
      - use: Substituting the Hub's `spam2020` record's data for this one, or vice versa.
        reason: >
          That record is IFPRI's global v2r2 release under CC-BY-SA-4.0 as zarr; this is the Atlas's
          Sub-Saharan Africa adaptation under CC-BY-4.0 as GeoTIFF. Different scope, licence, format
          and DOI.
        use_instead: Choose deliberately, and state which in any derived product.
      - use: Mixing value-of-production variables across currency bases.
        reason: >
          vop_intld15, vop_usd2015, vop_nominal-usd15 and vop_nominal-usd21 are not interchangeable,
          and a past crop-versus-livestock mismatch produced roughly a sevenfold error in cattle exposure.
        use_instead: Constant international dollars (vop_intld15) throughout, with the livestock counterpart checked to match.
