id: kenya-population-grid3
title: GRID3 / WOPR Bottom-up Gridded Population 2020 (Kenya)
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  Gridded population count for Kenya from the WorldPop Open Population Repository (WOPR) KEN v2.0, a
  bottom-up 100 m surface modelled from KNBS microcensus survey clusters (GRID3-branded), cropped to
  Kenya and written as a Cloud Optimized GeoTIFF. The second population-exposure surface of the
  KE-ENSO Explorer, alongside the WorldPop constrained (top-down) product (record
  kenya-population-worldpop): same grain, different estimation method.
resource_type: dataset
license: CC-BY-4.0 # WorldPop / WOPR standard licence; a clip/subset, so the source licence carries through

keywords:
  [
    population,
    GRID3,
    WOPR,
    WorldPop,
    bottom-up,
    microcensus,
    exposure,
    100 m,
    Kenya,
    "2020",
  ]

note: >
  NOT USED BY ANY ATLAS PRODUCT, AND NOT SUBMITTED TO THE CATALOG (decision 2026-09-18).
  GRID3 was published to Atlas storage as an alternative population surface and nothing ever
  consumed it. The Kenya exposure chain reads WorldPop and only WorldPop: 7_zonal_exposure.R fixes
  the grid at worldpop-constrained-2020, and POP_SOURCE selects between census levelling, projection
  levelling and no levelling - never between gridded providers. The continental chain likewise reads
  the aggregated WorldPop surface (record africa-population-worldpop-aggregated).
  This record is therefore kept LOCAL: it documents an object that is public on S3, which should not
  be left undocumented, but it is not offered to the Hub as a dataset the Atlas uses. If GRID3 is
  ever wired in, the record is ready; if the objects are removed from S3, this record goes with them.
  The methodological contrast is still worth knowing: GRID3/WOPR is bottom-up from microcensus and
  building footprints, WorldPop constrained is top-down dasymetric. They fail in different places,
  and both run about 17 per cent above the enumerated 2019 census nationally.

  Bottom-up = built up from microcensus survey clusters, not redistributed from a national total.
  Differs from the WorldPop constrained surface spatially, not in national scale; use for method
  comparison.
  DISCREPANCY AGAINST THE CENSUS: the national total, ~55.9 M, is about 17 per cent above the
  enumerated KNBS 2019 census figure of 47,564,296 (record kenya-population-knbs-census). That is
  worth stating plainly for this product in particular, because it is modelled FROM KNBS microcensus
  survey clusters, so a total near the census was the expectation rather than the exception. Any
  absolute headcount taken straight off this surface is ~17 per cent above what a Kenyan user will
  compare it against; the KE-ENSO exposure tables take the LEVEL from KNBS at county and only the
  within-county SHARE from a grid (record kenya-flood-exposure-intersect).

contact:
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact]
  - organization: WorldPop / GRID3, University of Southampton
    url: https://wopr.worldpop.org/
    roles: [licensor, producer]

citation:
  title: "WOPR: WorldPop Open Population Repository - Kenya population v2.0 (bottom-up)"
  authors: [WorldPop, GRID3]
  date: "2020"
  publisher: WorldPop, University of Southampton
  url: https://wopr.worldpop.org/?KEN/population

created: "2026-08-28"
updated: "2026-09-14"

spatial:
  bbox: [33.9, -4.7, 41.9, 5.5]
  crs: EPSG:4326
  geography: [kenya]
  resolution:
    - type: xy
      value: 100
      unit: meter
      label: ~100 m (0.000833 deg)

temporal:
  date: "2020"

variables:
  - name: count
    description: Estimated number of people per pixel, bottom-up model.
    data_type: float32
    unit: "{person}"

processing:
  - id: source
    description: WOPR KEN v2.0 bottom-up gridded population (KNBS microcensus-modelled), 100 m.
    derived_from:
      - title: WOPR KEN population v2.0
        url: https://data.worldpop.org/repo/wopr/KEN/population/v2.0/
  - id: crop-cog
    description: Crop to Kenya, set the fill value (-3.4e38) to NoData, write a COG with overviews.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype
      version: python/ingest_exposure_grid3.py

data:
  - name: population
    description: Bottom-up population count, single COG.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=exposure/type=population/source=grid3/region=east-africa/processing=bottom-up/variable=count/population_2020.tif
        title: HTTPS
      - url: s3://digital-atlas/domain=exposure/type=population/source=grid3/region=east-africa/processing=bottom-up/variable=count/population_2020.tif
        title: S3
    media_type: image/tiff; application=geotiff; profile=cloud-optimized
    file_size: 49.2 MB
    nodata: NaN
    processing_steps: [source, crop-cog]

cdh:
  domain: [socioeconomic]
  usage:
    intended_uses:
      - Second population-exposure surface for method comparison against the WorldPop constrained product.
    not_recommended_for:
      - use: Reporting census-anchored population totals.
        reason: The national total (~55.9 M) runs about 17 per cent above the KNBS 2019 census (47.56 M).
        use_instead: Record kenya-population-knbs-census for official totals (or kenya-population-knbs-projections for a later year); this surface for spatial distribution only.
