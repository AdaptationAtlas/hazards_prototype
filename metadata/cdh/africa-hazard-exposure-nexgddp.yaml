# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.bundled.json
# The Atlas hazard x exposure product, nominal US dollar tier. READ THE NOTE BEFORE USE: the basis is
# NOMINAL USD 2021, not the Atlas standard constant international dollars.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/climate/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json

id: africa-hazard-exposure-nexgddp
title: Hazard Frequency crossed with Crop and Livestock Value of Production (nominal 2021 US dollars), Sub-Saharan Africa
version: v2026.11
series:
  name: Africa Agriculture Adaptation Atlas
  url: https://adaptationatlas.cgiar.org/
description: >
  The Atlas hazard-exposure product: the frequency of each agro-climatic hazard crossed with the
  value of crop and livestock production exposed to it, in nominal 2021 US dollars, by
  administrative unit, commodity, hazard, scenario, period and timeframe, for Sub-Saharan Africa.
  Built from NEX-GDDP-CMIP6 hazard indices, MapSPAM-derived crop value of production and GLW4-derived
  livestock value. This is the layer the Atlas notebooks read to answer "how much production is
  exposed to this hazard, where, and how does that change under future scenarios".
resource_type: dataset
license: CC-BY-4.0 # derived product; principal inputs (MapSPAM Adaptation Atlas SSA, GAUL 2024) are CC-BY-4.0
keywords:
  [
    hazard exposure,
    climate risk,
    value of production,
    crop exposure,
    CMIP6,
    NEX-GDDP,
    sub-saharan africa,
  ]

note: >
  CURRENCY BASIS - THE MOST IMPORTANT THING TO KNOW. What is published is
  variable=vop_nominal-usd21, value of production in NOMINAL 2021 US dollars. That is NOT the Atlas
  standard basis, constant 2015 international dollars, which is the sibling record
  africa-hazard-exposure-intld (variable=vop_intld15-21). Nominal values are not deflated, so a
  change between timeframes mixes price change with production change, and figures are not
  comparable with any Atlas product quoted in constant international dollars. Crops are priced with
  FAOSTAT's implied farm-gate price, a basis guard and cited evidence pins
  (docs/methods/nominal_price_method.md in the repository). Livestock are priced at each country's
  own FAOSTAT producer price (clipped to a band around the world median, 2019-2023 median, longer
  series as fallback), gap-filled with medians of neighbouring, regional and continental own prices;
  goat and sheep milk keep the world median by decision. Own producer prices exist for only about a
  quarter of country-livestock-product rows; the rest are fills, some of them a single neighbour's
  price. Sudan and Nigeria-banana rows are sound on this nominal basis.
  THE DENOMINATOR. Consumers divide this product by the exposure table africa-exposure-combined
  (domain=exposure/type=combined/.../variable=crop-livestock_all*.parquet). Use its 0.25 degree
  structure, variable=crop-livestock_all_res-25, which is extracted on the 0.25 degree NEX-GDDP
  hazard grid - THE SAME GRID AS THIS PRODUCT. The 0.05 degree structure,
  variable=crop-livestock_all_res-05 (and its deprecated unsuffixed alias
  variable=crop-livestock_all), resolves roughly 2,100 more second-level units than this product can
  populate, so dividing by it yields exposure fractions above 100 per cent in small units. The
  denominator is MULTI-UNIT: its nominal-usd-2021 rows share this product's basis, its intld15-2021
  rows are constant international dollars and do not. Select on `unit`. Per country and crop this
  product's total exposed value equals the denominator's nominal-usd-2021 rows to within a few per
  cent; the publish gate measures that, plus 18 ensemble members. Known exceptions: 31 border cells
  that the denominator assigns at admin0 and this product, aggregated from second-level units,
  assigns to the neighbour (hazards_prototype issue 18) - visible nationally only for Kenya robusta
  coffee and Sierra Leone robusta coffee and coconut; and Tanzania coconut, which undershoots its
  exposure by 2.4 per cent from a hazard-coverage hole on Pemba Island (issue 50).
  HAZARD SETS. The crop-specific interaction set PTOT-L+NTxS+PTOT-G is retired and replaced by
  PTOT-L+NTxM+PTOT-G (the per-crop ecocrop-optimum heat threshold; the old NTxS averaged the optimum
  with the survival limit and reported zero heat-exposed maize value), and NDWS+NTxM+NDWL0 gives
  crop-specific heat with the water-balance framing. PTOT-L+NTxS+PTOT-G readers must move to the
  NTxM name. The poultry_highland THI extreme threshold is 89 (was 79).
  FIVE TIERS, ONE RECORD EACH. Under source=nex-gddp-cmip6 this nominal-dollar tier sits beside
  constant international dollars (africa-hazard-exposure-intld), harvested area
  (africa-hazard-exposure-harvested-area), production tonnes (africa-hazard-exposure-production) and
  livestock head counts (africa-hazard-exposure-livestock-numbers). There is no population exposure
  tier under this source.
  ONLY THE ENSEMBLE MEAN IS PUBLISHED. model = ENSEMBLEmean throughout; no per-model files exist
  here. Ensemble membership has previously varied between 18, 13 and 5 members across products
  without being recorded, which is why membership is now stamped into the .json sidecar beside each
  file - check it rather than assuming 18. Tracked as hazards_prototype issue 26.
  BOTH PERIODS ARE PUBLISHED. period = jagermeyr (crop-calendar growing season) and period = annual
  (full calendar year, published since 2026-10-19).
  SCALE. A jagermeyr file holds roughly 94 million rows at 77 to 87 MB compressed. Query it with
  predicate pushdown - reading it whole into memory is not the intended access pattern.
  BASELINE. The historic window is 1995-2014, which is the end of the CMIP6 historical run, not a
  WMO 1991-2020 normal. Comparisons against a 1991-2020 baseline are not possible from this source.
  VERSION HISTORY. This is the first Climate Data Hub release (v2026.11, the files as published on
  2026-10-23). The public changes before it, with dates and how far values moved, are in the version
  history linked below: among them the 2026-09-25 denominator fix (issue 30), the 2026-09-30 re-bake
  on the 0.25 degree grid, the 2026-10-06 crop price revision, the 2026-10-16 to 10-19 hazard rebuild,
  and the 2026-10-23 livestock repricing (issue 47), which moved country-species values 0.43 to 2.2
  times (South Africa poultry -32 per cent, Egypt cattle +39, Mozambique poultry +92) while leaving
  crop values unchanged.

contact:
  - organization: Alliance of Bioversity International and CIAT
    url: https://alliancebioversityciat.org/
    roles: [licensor, producer]
  - name: Peter Steward
    organization: Alliance of Bioversity International and CIAT
    email: p.steward@cgiar.org
    roles: [processor, point-of-contact, maintainer]

citation:
  title: Africa Agriculture Adaptation Atlas hazard-exposure product
  authors:
    - organization: Alliance of Bioversity International and CIAT
  date: "2026"
  publisher: Alliance of Bioversity International and CIAT
  url: https://adaptationatlas.cgiar.org/

created: "2026-09-18"
updated: "2026-11-13"

spatial:
  bbox: [-26.0, -35.0, 58.0, 28.0] # Sub-Saharan Africa, 55 countries present
  crs: EPSG:4326
  geography: [sub-saharan-africa]
  # No horizontal axes: the table's reporting unit is the gaul2_code location dimension.

temporal:
  start_date: "1995"
  end_date: "2100"

structures:
  - name: hazard-exposure
    dimensions:
      - name: period
        type: season
        description: >
          Hazard aggregation window. jagermeyr = the Jagermeyr et al. crop-calendar growing season;
          annual = the full calendar year. One key prefix per period.
        values: [jagermeyr, annual]
      - name: severity
        type: severity
        description: Hazard severity tier. One file per period x tier.
        values: [moderate, severe, extreme]
      - name: scenario
        type: scenario
        description: Emissions pathway; historic is the CMIP6 historical run.
        values: [historic, ssp126, ssp245, ssp370, ssp585]
      - name: timeframe
        type: temporal
        description: >
          Twenty-year window, labelled here by its first year; the column stores the window as text
          (1995-2014, 2021-2040, 2041-2060, 2061-2080, 2081-2100). 1995-2014 is the historical
          baseline.
        values: ["1995", "2021", "2041", "2061", "2081"]
      - name: crop
        type: commodity
        description: >
          Commodity, 44 present: 33 MapSPAM crops, 10 livestock species-systems (cattle, goats, pigs,
          poultry, sheep x tropical/highland) and `generic-crop`. `generic-crop` is all crops' value
          under the generic-threshold set; never add it to the individual crops. Livestock VALUE rows
          are published here under the two THI sets; livestock head counts are a separate tier.
      - name: hazard
        type: hazard
        description: >
          Agro-climatic hazard, 9 present, plus the multi-hazard interaction sets. Since 2026-10 the
          published hazard_vars sets are NDWS+NTx35+NDWL0 (generic crop heat, water-balance framing),
          NDWS+NTxM+NDWL0 (crop-specific heat, water-balance framing), PTOT-L+NTxM+PTOT-G
          (crop-specific heat, precipitation framing; renamed from PTOT-L+NTxS+PTOT-G, issue 25), and
          the two livestock THI sets. Interaction classes are mutually exclusive, so hazard='any' +
          hazard='none' equals the exposure total of that unit and crop.
      - name: gaul2_code
        type: location
        description: >
          Second-level administrative unit, as the GAUL 2024 code and the join key to the boundaries
          (record africa-admin-boundaries-gaul2024). Rows also carry iso3, admin0_name, admin1_name,
          admin2_name and the adm0 and adm1 GAUL codes. 55 countries present. Each file holds admin0,
          admin1 and admin2 rows; the higher levels are sums of admin2.
        reference_system: https://data.apps.fao.org/catalog/dataset/global-administrative-unit-layers-gaul-2024
    variables:
      - name: value
        description: >
          Value of crop or livestock production exposed to the hazard at that severity, in NOMINAL
          2021 US dollars. Read exposure_var and exposure_unit on each row rather than assuming the
          basis.
        data_type: float64
        unit: "{nominal-usd-2021}"
      - name: exposure_unit
        description: >
          The currency basis of `value`, carried per row. This column exists precisely because the
          basis has changed before and must not be assumed.
        data_type: string
        categories:
          - value: nominal-usd-2021
            label: Nominal 2021 US dollars
            description: The only value present in this tier.
    foreign_keys:
      - fields: [gaul2_code]
        reference:
          resource: https://digital-atlas.s3.amazonaws.com/domain=boundaries/type=admin/source=gaul2024/region=africa/processing=analysis-ready/level=adm2/atlas_gaul24_a2_africa.parquet
          fields: [gaul2_code]

processing:
  - id: source
    description: >
      Monthly agro-climatic hazard indices computed per GCM from NEX-GDDP-CMIP6 (18 GCMs; the sidecar
      on every key records membership), and crop and livestock value of production in nominal 2021 US
      dollars from the combined exposure table on the 0.25 degree hazard grid.
    derived_from:
      - title: Monthly hazard indices from NEX-GDDP-CMIP6 (record nexgddp-indices-monthly)
        url: https://github.com/AdaptationAtlas/hazards
      - title: MapSPAM2020_AdaptationAtlas_SSA (record mapspam2020-adaptation-atlas-ssa)
        url: https://doi.org/10.7910/DVN/Z0HK7R
      - id: africa-exposure-combined
        title: Combined crop and livestock exposure, 0.25 degree structure (variable=crop-livestock_all_res-25), the denominator
        version: v2026.11
  - id: frequency
    description: >
      Convert hazard indices to the frequency with which each severity threshold is exceeded, per
      scenario, timeframe and admin unit.
  - id: exposure
    description: >
      Cross hazard frequency with value of production to give exposed value, and aggregate onto GAUL
      2024 administrative units.
    code:
      url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/R/3_freq_x_exposure.R

data:
  - name: hazard-exposure-by-period-severity
    description: >
      One parquet per period x severity tier, 77 to 87 MB each, with a .json sidecar beside each
      recording the ensemble membership. Published by scripts/r3_publish_tiers.R.
    locations:
      - url: https://digital-atlas.s3.amazonaws.com/domain=hazard_exposure/source=nex-gddp-cmip6/region=ssa/processing=hazard-risk-exposure/variable=vop_nominal-usd21/
        title: HTTPS
      - url: s3://digital-atlas/domain=hazard_exposure/source=nex-gddp-cmip6/region=ssa/processing=hazard-risk-exposure/variable=vop_nominal-usd21/
        title: S3
    href_template: "period={period}/model=ENSEMBLEmean/severity={severity}/int=multi-hazard.parquet"
    media_type: application/vnd.apache.parquet
    file_size: 83 MB
    processing_steps: [source, frequency, exposure]

additional_links:
  - title: Version history
    rel: version-history
    url: https://github.com/AdaptationAtlas/hazards_prototype/blob/develop/metadata/cdh/changelogs/africa-hazard-exposure-nexgddp.md
    description: Public changes to these files before and since the first Hub release, dated.

climate:
  mip_era: CMIP6
  scenarios: [historical, ssp126, ssp245, ssp370, ssp585]
  models: [ensemble]

commodities: [crops, cattle, goats, sheep, swine-pigs, chickens]

cdh:
  domain: [agricultural-production, climate]
  usage:
    intended_uses:
      - Quantifying how much crop and livestock production value is exposed to a given hazard, by admin unit and scenario.
      - Comparing exposure between emissions pathways and future timeframes.
    not_recommended_for:
      - use: Comparing exposed value between timeframes as though it were a real-terms change.
        reason: >
          Values are NOMINAL 2021 US dollars and are not deflated, so a difference between timeframes
          mixes price change with production and hazard change.
        use_instead: Use the constant-dollar sibling tier (record africa-hazard-exposure-intld, variable=vop_intld15-21), published 2026-10-19.
      - use: Combining these figures with any Atlas product quoted in constant international dollars.
        reason: >
          Different currency basis. A previous crop-versus-livestock mismatch of exactly this kind,
          in the upstream livestock chain, produced roughly a sevenfold error in cattle exposure
          (corrected upstream 2026-09-25).
        use_instead: Check exposure_unit on both sides and convert, or use products on one basis throughout.
      - use: Treating a livestock value in a country without its own FAOSTAT producer price as that country's price.
        reason: >
          About three quarters of country-livestock-product rows carry a gap-filled price (median of
          neighbouring, regional or continental own prices; world median for goat and sheep milk).
          The price used and its source per row are in the processing audit, not in this table.
        use_instead: For a country-level livestock comparison, use the head-count tier or the constant-dollar tier alongside this one.
      - use: Reading this as covering population exposure.
        reason: >
          This tier is crop and livestock value of production. Livestock exposure is also published
          as head counts (record africa-hazard-exposure-livestock-numbers) and in the constant-dollar
          tier; no population tier exists under this source.
        use_instead: The observational exposure products for population.
      - use: Benchmarking against a WMO 1991-2020 normal.
        reason: The historical window is 1995-2014, the end of the CMIP6 historical run.
        use_instead: Use 1995-2014 as the stated baseline and say so.
